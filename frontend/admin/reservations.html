<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservations — The~Yo's Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-shell.css?v=3">
<style>
  .res-counts { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .res-count {
    font-family: 'Space Mono', monospace; font-size: 0.68rem; text-transform: uppercase;
    letter-spacing: 0.05em; padding: 7px 12px; border: 1px solid var(--line);
    border-radius: 20px; opacity: 0.85;
  }
  .res-count b { font-size: 0.82rem; margin-left: 4px; }
  .res-count.pending { border-color: rgba(184,134,11,0.35); color: var(--warning); }
  .res-count.today { border-color: rgba(163,132,74,0.4); color: var(--brass-dark); }
  .res-count.overdue { border-color: rgba(192,57,43,0.35); color: var(--danger); }

  /* Urgency: overdue pending/confirmed rows get red, today's get amber. */
  tr.urgency-overdue td { background: rgba(192,57,43,0.06); }
  tr.urgency-overdue:hover td { background: rgba(192,57,43,0.1); }
  tr.urgency-today td { background: rgba(184,134,11,0.07); }
  tr.urgency-today:hover td { background: rgba(184,134,11,0.11); }
  .urgency-tag {
    font-family: 'Space Mono', monospace; font-size: 0.6rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em; margin-left: 6px; padding: 1px 6px;
    border-radius: 10px;
  }
  .urgency-tag.today { background: rgba(163,132,74,0.2); color: var(--brass-dark); }
  .urgency-tag.overdue { background: rgba(192,57,43,0.15); color: var(--danger); }

  /* Notes truncation: keep the row a fixed height, hover for full text. */
  .notes-cell {
    max-width: 190px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 0.8rem; opacity: 0.75; cursor: help;
  }
  .notes-cell.empty { opacity: 0.4; font-style: italic; }

  .clickable { cursor: pointer; }
  .clickable:hover { text-decoration: underline; text-underline-offset: 2px; }

  .contact-row { display: flex; flex-direction: column; gap: 2px; }
  .contact-row .sub { font-size: 0.72rem; opacity: 0.6; }

  .detail-list { display: grid; grid-template-columns: 130px 1fr; gap: 8px 14px; font-size: 0.85rem; }
  .detail-list dt { font-family: 'Space Mono', monospace; font-size: 0.65rem; text-transform: uppercase; opacity: 0.55; align-self: center; }
  .detail-list dd { margin: 0; }
  .detail-list a { color: var(--brass-dark); }

  .confirm-capacity { margin-top: 8px; font-size: 0.78rem; opacity: 0.75; }
  .confirm-capacity.bad { color: var(--danger); opacity: 1; font-weight: 600; }
  .modal-error {
    margin-top: 12px; padding: 10px 12px; border-radius: 5px; font-size: 0.8rem;
    background: rgba(192,57,43,0.1); color: var(--danger); display: none;
  }
  .modal-error.show { display: block; }

  /* Order status pills */
  .order-status-pill {
    padding: 3px 10px; border-radius: 20px; font-size: 0.6rem; font-family: 'Space Mono', monospace;
    font-weight: 700; text-transform: uppercase; white-space: nowrap;
  }
  .order-status-no_order { background: rgba(21,23,26,0.08); color: var(--ink); opacity: 0.65; }
  .order-status-editable { background: rgba(46,125,79,0.12); color: #1e6b41; }
  .order-status-finalized { background: rgba(163,132,74,0.15); color: var(--brass-dark); }
  .order-status-locked { background: rgba(192,57,43,0.12); color: #a3271b; }

  /* Reservation status pills */
  .res-status-pill {
    padding: 3px 10px; border-radius: 20px; font-size: 0.6rem; font-family: 'Space Mono', monospace;
    font-weight: 700; text-transform: uppercase; white-space: nowrap;
  }
  .res-status-pending { background: rgba(184,134,11,0.14); color: #b8860b; }
  .res-status-contact_customer { background: rgba(163,132,74,0.15); color: var(--brass-dark); }
  .res-status-order_preparing { background: rgba(46,125,79,0.12); color: #1e6b41; }
  .res-status-order_finalized { background: rgba(163,132,74,0.2); color: var(--brass-dark); }
  .res-status-confirmed { background: rgba(163,132,74,0.15); color: var(--brass); }
  .res-status-cancelled { background: rgba(192,57,43,0.14); color: #c0392b; }
  .res-status-completed { background: rgba(46,125,79,0.14); color: #2e7d4f; }

  .pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .pager-info { font-family: 'Space Mono', monospace; font-size: 0.68rem; text-transform: uppercase; opacity: 0.6; }

  /* Order items table in modal */
  .order-items-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 10px; }
  .order-items-table th { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); font-family: 'Space Mono', monospace; font-size: 0.6rem; text-transform: uppercase; opacity: 0.55; }
  .order-items-table td { padding: 8px; border-bottom: 1px dashed var(--line); }
  .order-items-table .item-name { font-weight: 600; }
  .order-items-table .item-qty { font-family: 'Space Mono', monospace; text-align: center; width: 60px; }
  .order-items-table .item-price { font-family: 'Space Mono', monospace; text-align: right; width: 80px; }
  .order-items-table .item-subtotal { font-family: 'Space Mono', monospace; text-align: right; width: 90px; font-weight: 700; color: var(--brass-dark); }
  .order-items-table .item-notes { font-size: 0.75rem; opacity: 0.6; margin-top: 2px; }
  .order-items-table .addon-row { font-size: 0.7rem; opacity: 0.6; color: var(--brass-dark); padding-left: 16px; }

  .order-total-row { display: flex; justify-content: flex-end; gap: 16px; margin-top: 12px; padding-top: 12px; border-top: 2px solid var(--line); font-family: 'Space Mono', monospace; font-size: 0.9rem; font-weight: 700; color: var(--brass); }

  .deadline-display { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .deadline-label { font-family: 'Space Mono', monospace; font-size: 0.6rem; text-transform: uppercase; opacity: 0.55; }
  .deadline-value { font-weight: 700; }
  .deadline-value.locked { color: var(--danger); }
  .deadline-value.editable { color: var(--success); }
  .deadline-value.final-day { color: var(--warning); }

  .admin-override-btn {
    background: none; border: 1px solid var(--danger); color: var(--danger);
    border-radius: 5px; padding: 6px 12px; font-size: 0.7rem; font-family: 'Space Mono', monospace;
    font-weight: 700; text-transform: uppercase; cursor: pointer; transition: all .15s;
  }
  .admin-override-btn:hover { background: var(--danger); color: #fff; }

  .toast {
    position: fixed; bottom: 20px; right: 20px; z-index: 200;
    background: var(--ink); color: var(--bone); padding: 12px 18px; border-radius: 6px;
    font-size: 0.84rem; font-family: 'Inter', sans-serif; box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    opacity: 0; transform: translateY(8px); pointer-events: none; transition: all .2s ease;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { border-left: 3px solid var(--success); }
  .toast.error { border-left: 3px solid var(--danger); }

  @media (max-width: 640px) {
    .detail-list { grid-template-columns: 1fr; gap: 2px 0; }
    .detail-list dt { margin-top: 8px; }
    .notes-cell { max-width: 140px; }
    .toast { left: 12px; right: 12px; bottom: 12px; }
    .order-items-table { display: block; overflow-x: auto; }
  }
</style>
</head>
<body>

<div id="adminShell"></div>

<script type="module">
  import { renderAdminShell, confirmDialog } from "./admin-shell.js";
  import { adminFetch, formatDate, escapeHtml, peso } from "./admin-api.js";

  const session = renderAdminShell({ active: 'reservations', title: 'Reservations' });
  if (session) init();

  let reservations = [];
  let tables = [];
  let menuItems = []; // loaded for order editor
  const PAGE_SIZE = 8;
  let page = 1;

  const STATUS_PILL = { pending: 'pill-warning', confirmed: 'pill-brass', cancelled: 'pill-danger', completed: 'pill-success' };
  const RES_STATUS_PILL = { 
    pending: 'res-status-pending', 
    contact_customer: 'res-status-contact_customer',
    order_preparing: 'res-status-order_preparing',
    order_finalized: 'res-status-order_finalized',
    confirmed: 'res-status-confirmed',
    cancelled: 'res-status-cancelled',
    completed: 'res-status-completed'
  };
  const ORDER_STATUS_PILL = {
    no_order: 'order-status-no_order',
    editable: 'order-status-editable',
    finalized: 'order-status-finalized',
    locked: 'order-status-locked'
  };
  const TERMINAL = ['cancelled', 'completed'];

  function init() {
    const content = document.getElementById('adminContent');
    content.innerHTML = `
      <div class="filter-bar">
        <div><label>Search</label>
          <input type="text" id="filterQ" placeholder="Name, email, table, notes…" style="min-width:220px;">
        </div>
        <div><label>Status</label>
          <select id="filterStatus">
            <option value="all">All</option>
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div><label>From</label><input type="date" id="filterFrom"></div>
        <div><label>To</label><input type="date" id="filterTo"></div>
      </div>
      <div class="res-counts" id="resCounts"></div>
      <div class="admin-panel">
        <div class="admin-panel-body" style="padding:0;" id="resWrap"><div class="admin-loading">Loading reservations…</div></div>
      </div>
    `;
    ['filterQ', 'filterStatus', 'filterFrom', 'filterTo'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => { page = 1; render(); });
    });
    load();
  }

  async function load() {
    try {
      const [resData, tableData, menuData] = await Promise.all([
        adminFetch('/api/admin/reservations'),
        adminFetch('/api/admin/reservations/tables'),
        adminFetch('/api/admin/products/menuitems'),
      ]);
      const resJson = await resData.json();
      const tableJson = await tableData.json();
      const menuJson = await menuData.json();
      if (!resData.ok) throw new Error(resJson.error || 'Could not load reservations.');
      if (!tableData.ok) throw new Error(tableJson.error || 'Could not load tables.');
      if (!menuData.ok) throw new Error(menuJson.error || 'Could not load menu items.');
      reservations = resJson.reservations || [];
      tables = tableJson.tables || [];
      menuItems = menuJson.items || [];
      render();
    } catch (err) {
      document.getElementById('resWrap').innerHTML = `<div class="admin-error">⚠ ${escapeHtml(err.message)}</div>`;
    }
  }

  function filteredRows() {
    const q = (document.getElementById('filterQ').value || '').toLowerCase().trim();
    const status = document.getElementById('filterStatus').value;
    const from = document.getElementById('filterFrom').value;
    const to = document.getElementById('filterTo').value;
    return reservations.filter(r => {
      if (status !== 'all' && r.status !== status) return false;
      const d = r.reservation_date || '';
      if (from && d < from) return false;
      if (to && d > to) return false;
      if (q) {
        const hay = [r.customer_name, r.customer_email, r.customer_phone, r.table_no, r.notes]
          .map(x => (x || '').toLowerCase()).join(' ');
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function render() {
    const rows = filteredRows();
    const wrap = document.getElementById('resWrap');

    const pending = reservations.filter(r => r.status === 'pending').length;
    const today = startOfDay(new Date());
    const open = rows.filter(r => !TERMINAL.includes(r.status));
    const todayCount = open.filter(r => dayDiff(r.reservation_date, today) === 0).length;
    const overdueCount = open.filter(r => dayDiff(r.reservation_date, today) < 0).length;
    document.getElementById('resCounts').innerHTML = `
      <span class="res-count pending">Pending <b>${pending}</b></span>
      <span class="res-count today">Today <b>${todayCount}</b></span>
      <span class="res-count overdue">Overdue <b>${overdueCount}</b></span>
    `;

    if (rows.length === 0) {
      wrap.innerHTML = `<div class="panel-empty" style="padding:20px;">No reservations match this filter.</div>`;
      return;
    }

    const pageCount = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    if (page > pageCount) page = pageCount;
    const slice = rows.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

    wrap.innerHTML = `
      <table class="admin-table">
        <thead><tr>
          <th>Customer</th><th>Table</th><th>Date</th><th>Time</th><th>Guests</th>
          <th>Requested</th><th>Res. Status</th><th>Order Status</th><th>Order Deadline</th><th>Notes</th><th>Actions</th>
        </tr></thead>
        <tbody>
          ${slice.map(r => rowHtml(r, today)).join('')}
        </tbody>
      </table>
      <div class="pager">
        <span class="pager-info">${rows.length} result${rows.length === 1 ? '' : 's'} · Page ${page} of ${pageCount}</span>
        <div class="row-actions">
          <button type="button" ${page <= 1 ? 'disabled' : ''} data-nav="prev">‹ Prev</button>
          <button type="button" ${page >= pageCount ? 'disabled' : ''} data-nav="next">Next ›</button>
        </div>
      </div>
    `;

    wrap.querySelectorAll('button[data-nav]').forEach(btn => {
      btn.addEventListener('click', () => { page += btn.dataset.nav === 'next' ? 1 : -1; render(); });
    });
    wrap.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        if (action === 'confirmed') openConfirmModal(id);
        else if (action === 'manage') openManageModal(id);
        else if (action === 'contact') updateReservationStatus(id, 'contact_customer');
        else if (action === 'order') openManageModal(id);
        else if (action === 'finalize') updateReservationStatus(id, 'order_finalized');
        else updateStatus(id, action);
      });
    });
    wrap.querySelectorAll('[data-customer]').forEach(el => {
      el.addEventListener('click', () => openDetailsModal(el.dataset.customer));
    });
  }

  function rowHtml(r, today) {
    const diff = dayDiff(r.reservation_date, today);
    const terminal = TERMINAL.includes(r.status);
    const urgency = !terminal && diff < 0 ? 'urgency-overdue'
                  : !terminal && diff === 0 ? 'urgency-today' : '';
    const tag = !terminal && diff === 0 ? '<span class="urgency-tag today">Today</span>'
              : !terminal && diff < 0 ? '<span class="urgency-tag overdue">Overdue</span>' : '';
    const notes = r.notes || '';
    
    // Order deadline display
    const deadline = r.order_editing_deadline ? fmtDate(r.order_editing_deadline) : '—';
    const deadlineDaysLeft = r.order_editing_deadline ? dayDiff(r.order_editing_deadline, today) : null;
    let deadlineClass = '';
    if (deadlineDaysLeft !== null) {
      if (deadlineDaysLeft < 0) deadlineClass = 'locked';
      else if (deadlineDaysLeft === 0) deadlineClass = 'final-day';
      else deadlineClass = 'editable';
    }
    
    // Status labels
    const resStatusLabel = r.reservation_status || r.status;
    const orderStatusLabel = r.order_status || 'no_order';
    
    return `
      <tr class="${urgency}">
        <td>
          <div class="contact-row">
            <span class="clickable" data-customer="${r.id}" title="View contact details">${escapeHtml(r.customer_name)}</span>
            ${r.customer_phone ? `<span class="sub">${escapeHtml(r.customer_phone)}</span>` : ''}
          </div>
        </td>
        <td>${r.table_no ? escapeHtml(r.table_no) : '<span style="color:var(--ink-muted);">—</span>'}</td>
        <td>${r.reservation_date ? fmtDate(r.reservation_date) : '—'}${tag}</td>
        <td>${r.reservation_time ? String(r.reservation_time).slice(0, 5) : '—'}</td>
        <td>${r.guests}</td>
        <td title="${formatDate(r.datetime_reserved)}" style="white-space:nowrap;">${formatDate(r.datetime_reserved, { dateStyle: 'medium', timeStyle: 'short' })}</td>
        <td><span class="res-status-pill ${RES_STATUS_PILL[resStatusLabel] || 'res-status-pending'}">${escapeHtml(resStatusLabel.replace(/_/g, ' '))}</span></td>
        <td><span class="order-status-pill ${ORDER_STATUS_PILL[orderStatusLabel] || 'order-status-no_order'}">${escapeHtml(orderStatusLabel.replace(/_/g, ' '))}</span></td>
        <td><span class="deadline-value ${deadlineClass}">${deadline}</span></td>
        <td><div class="notes-cell${notes ? '' : ' empty'}" title="${escapeHtml(notes)}">${notes ? escapeHtml(notes) : '—'}</div></td>
        <td><div class="row-actions">${actionButtons(r)}</div></td>
      </tr>
    `;
  }

  function actionButtons(r) {
    const resStatus = r.reservation_status || r.status;
    const orderStatus = r.order_status || 'no_order';
    const today = startOfDay(new Date());
    const deadline = r.order_editing_deadline ? new Date(r.order_editing_deadline) : null;
    const isPastDeadline = deadline && today > deadline;
    const isLocked = isPastDeadline && orderStatus !== 'locked';
    const isAdmin = session?.staff?.role === 'Admin';

    // If order is locked (past deadline) and not admin, show locked state
    if (isLocked) {
      return `<span class="pill pill-danger" style="font-size:0.7rem;">Order Locked</span>
              ${isAdmin ? `<button class="primary" data-action="manage" data-id="${r.id}" style="margin-left:4px; font-size:0.65rem; padding:4px 8px;">Admin Override</button>` : ''}`;
    }

    if (resStatus === 'pending') {
      return `<button class="primary" data-action="contact" data-id="${r.id}" style="font-size:0.7rem;">Contact Customer</button>
              <button class="danger" data-action="cancelled" data-id="${r.id}">Cancel</button>`;
    }
    if (resStatus === 'contact_customer') {
      return `<button class="primary" data-action="order" data-id="${r.id}" style="font-size:0.7rem;">Add Order</button>
              <button class="danger" data-action="cancelled" data-id="${r.id}">Cancel</button>`;
    }
    if (resStatus === 'order_preparing') {
      return `<button class="primary" data-action="manage" data-id="${r.id}" style="font-size:0.7rem;">Edit Order</button>
              <button class="primary" data-action="finalize" data-id="${r.id}" style="font-size:0.7rem;">Finalize Order</button>
              <button class="danger" data-action="cancelled" data-id="${r.id}">Cancel</button>`;
    }
    if (resStatus === 'order_finalized') {
      return `<button class="primary" data-action="confirmed" data-id="${r.id}" style="font-size:0.7rem;">Confirm Reservation</button>
              <button class="primary" data-action="manage" data-id="${r.id}" style="font-size:0.7rem;">Edit Order</button>
              <button class="danger" data-action="cancelled" data-id="${r.id}">Cancel</button>`;
    }
    if (r.status === 'confirmed') {
      return `<button class="primary" data-action="completed" data-id="${r.id}">Mark Completed</button>
              <button class="danger" data-action="cancelled" data-id="${r.id}">Cancel</button>`;
    }
    return `<span style="font-size:0.75rem; color:var(--ink-muted);">No further action</span>`;
  }

  // ---- Confirm modal: table assignment is mandatory, capacity checked live ----

  function openConfirmModal(id) {
    const r = reservations.find(x => x.id == id);
    if (!r) return;
    const options = tables.map(t => {
      const selected = r.table_no === t.table_no ? ' selected' : '';
      return `<option value="${escapeHtml(t.table_no)}" data-cap="${t.capacity}"${selected}>${escapeHtml(t.table_no)} — seats ${t.capacity}</option>`;
    }).join('') || `<option value="">No active tables</option>`;

    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop active';
    backdrop.innerHTML = `
      <div class="modal-box" style="max-width:520px;">
        <h3>Confirm reservation</h3>
        <div class="detail-list">
          <dt>Customer</dt><dd>${escapeHtml(r.customer_name)}</dd>
          <dt>Date</dt><dd>${r.reservation_date ? fmtDate(r.reservation_date) : '—'} at ${String(r.reservation_time || '').slice(0, 5)}</dd>
          <dt>Guests</dt><dd>${r.guests}</dd>
        </div>
        <div class="form-field" style="margin-top:16px;">
          <label for="confirmTable">Assign table</label>
          <select id="confirmTable">${options}</select>
          <div class="confirm-capacity" id="confirmCapacity"></div>
        </div>
        <div class="modal-error" id="confirmError"></div>
        <div class="modal-close-row">
          <button class="btn btn-outline" id="confirmClose">Back</button>
          <button class="btn" id="confirmSubmit">Confirm</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);

    const sel = backdrop.querySelector('#confirmTable');
    const capEl = backdrop.querySelector('#confirmCapacity');
    function refreshCapacity() {
      const opt = sel.options[sel.selectedIndex];
      const cap = opt ? Number(opt.dataset.cap) : 0;
      if (!cap) {
        capEl.textContent = 'No active tables available.';
        capEl.className = 'confirm-capacity bad';
      } else if (cap >= r.guests) {
        capEl.textContent = `Seats ${cap} — fits your ${r.guests} guests.`;
        capEl.className = 'confirm-capacity';
      } else {
        capEl.textContent = `Only seats ${cap}, but this reservation is for ${r.guests}. Pick a bigger table.`;
        capEl.className = 'confirm-capacity bad';
      }
    }
    sel.addEventListener('change', refreshCapacity);
    refreshCapacity();

    backdrop.querySelector('#confirmClose').addEventListener('click', close);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
    backdrop.querySelector('#confirmSubmit').addEventListener('click', async () => {
      const btn = backdrop.querySelector('#confirmSubmit');
      const errEl = backdrop.querySelector('#confirmError');
      errEl.classList.remove('show');
      btn.disabled = true;
      try {
        const res = await adminFetch(`/api/admin/reservations/${id}/confirm`, {
          method: 'PATCH',
          body: JSON.stringify({ table_no: sel.value }),
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.error || 'Could not confirm this reservation.';
          errEl.classList.add('show');
          btn.disabled = false;
          return;
        }
        const r0 = reservations.find(x => x.id == id);
        if (r0) { 
          r0.status = 'confirmed'; 
          r0.table_no = data.reservation.table_no;
          r0.reservation_status = 'confirmed';
          r0.order_status = 'finalized';
        }
        close();
        toast(`Confirmed — ${data.reservation.table_no} assigned.`, 'success');
        render();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.add('show');
        btn.disabled = false;
      }
    });

    function close() { backdrop.remove(); }
  }

  // ---- Manage Reservation Order Modal ----
  async function openManageModal(id) {
    const r = reservations.find(x => x.id == id);
    if (!r) return;

    // Fetch order details
    let orderData = null;
    try {
      const res = await adminFetch(`/api/admin/reservations/${id}/order`);
      if (res.ok) orderData = await res.json();
    } catch (err) {
      console.error('Failed to load order:', err);
    }

    const resStatus = r.reservation_status || r.status;
    const orderStatus = r.order_status || 'no_order';
    const today = startOfDay(new Date());
    const deadline = r.order_editing_deadline ? new Date(r.order_editing_deadline) : null;
    const isPastDeadline = deadline && today > deadline;
    const canEdit = (orderStatus === 'editable' || orderStatus === 'finalized') && !isPastDeadline;
    const isAdmin = session?.staff?.role === 'Admin';

    const order = orderData?.order;
    const menuItems = orderData?.menu_items || [];

    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop active';
    backdrop.innerHTML = `
      <div class="modal-box" style="max-width:700px; max-height:90vh; overflow-y:auto;">
        <div class="prd-modal-head" style="margin-bottom:16px;">
          <h3>Manage Reservation #${r.id} — ${escapeHtml(r.customer_name)}</h3>
          <button class="close-btn" id="manageCloseBtn"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        
        <div class="detail-list" style="margin-bottom:16px; font-size:0.8rem;">
          <dt>Date</dt><dd>${r.reservation_date ? fmtDate(r.reservation_date) : '—'} at ${String(r.reservation_time || '').slice(0, 5)}</dd>
          <dt>Guests</dt><dd>${r.guests}</dd>
          <dt>Reservation Status</dt><dd><span class="res-status-pill ${RES_STATUS_PILL[resStatus] || 'res-status-pending'}">${escapeHtml(resStatus.replace(/_/g, ' '))}</span></dd>
          <dt>Order Status</dt><dd><span class="order-status-pill ${ORDER_STATUS_PILL[orderStatus] || 'order-status-no_order'}">${escapeHtml(orderStatus.replace(/_/g, ' '))}</span></dd>
          <dt>Order Editing Deadline</dt><dd>
            <span class="deadline-value ${deadline ? (isPastDeadline ? 'locked' : (dayDiff(r.order_editing_deadline, today) === 0 ? 'final-day' : 'editable')) : ''}">
              ${deadline ? fmtDate(r.order_editing_deadline) : '—'}
            </span>
            ${isPastDeadline ? ' <span style="color:var(--danger); font-size:0.7rem;">(PASSED)</span>' : (deadline && dayDiff(r.order_editing_deadline, today) === 0 ? ' <span style="color:var(--warning); font-size:0.7rem;">(TODAY)</span>' : '')}
          </dd>
          ${isPastDeadline && isAdmin ? '<dt></dt><dd><button class="admin-override-btn" id="adminOverrideBtn">Admin Override</button></dd>' : ''}
        </div>

        ${order ? `
        <div style="border-top:1px solid var(--line); padding-top:16px;">
          <h4 style="font-family:'Archivo',sans-serif; text-transform:uppercase; font-size:0.85rem; margin-bottom:10px;">Order Items</h4>
          <table class="order-items-table">
            <thead><tr>
              <th style="width:40%;">Item</th>
              <th class="item-qty">Qty</th>
              <th class="item-price">Price</th>
              <th class="item-subtotal">Subtotal</th>
            </tr></thead>
            <tbody>
              ${order.items.map(item => `
                <tr>
                  <td>
                    <div class="item-name">${escapeHtml(item.name)}</div>
                    ${item.add_ons?.length ? item.add_ons.map(a => `<div class="addon-row">+ ${a.name} × ${a.quantity}</div>`).join('') : ''}
                    ${item.notes ? `<div class="item-notes">${escapeHtml(item.notes)}</div>` : ''}
                  </td>
                  <td class="item-qty">${item.quantity}</td>
                  <td class="item-price">${peso(item.price)}</td>
                  <td class="item-subtotal">${peso(item.subtotal)}</td>
                </tr>
              `).join('') || '<tr><td colspan="4">No items in order</td></tr>'}
            </tbody>
          </table>
          <div class="order-total-row">
            <span>Total:</span>
            <span>${peso(order.total_amount)}</span>
          </div>
        </div>
        ` : `
        <div style="border-top:1px solid var(--line); padding-top:16px; text-align:center; color:var(--ink-muted);">
          <p>No order recorded yet.</p>
        </div>
        `}

        <div style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap;">
          ${!order ? `
            <button class="btn" id="addOrderBtn" style="flex:1; min-width:140px;">Add Order</button>
          ` : `
            ${canEdit ? `
              <button class="btn" id="editOrderBtn" style="flex:1; min-width:140px;">Edit Order</button>
            ` : ''}
            ${resStatus === 'order_preparing' ? `
              <button class="btn" id="finalizeOrderBtn" style="flex:1; min-width:140px; background:var(--success); border-color:var(--success);">Finalize Order</button>
            ` : ''}
            ${resStatus === 'order_finalized' ? `
              <button class="btn" id="confirmReservationBtn" style="flex:1; min-width:140px;">Confirm Reservation</button>
            ` : ''}
            ${isAdmin && isPastDeadline && orderStatus === 'locked' ? `
              <button class="btn" id="adminOverrideEditBtn" style="flex:1; min-width:140px; background:var(--danger); border-color:var(--danger);">Admin Override: Edit</button>
            ` : ''}
          `}
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);

    const close = () => backdrop.remove();
    backdrop.querySelector('#manageCloseBtn').addEventListener('click', close);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });

    // Add Order button
    const addOrderBtn = backdrop.querySelector('#addOrderBtn');
    if (addOrderBtn) addOrderBtn.addEventListener('click', () => openOrderEditorModal(id, r, menuItems, false));

    // Edit Order button
    const editOrderBtn = backdrop.querySelector('#editOrderBtn');
    if (editOrderBtn) editOrderBtn.addEventListener('click', () => openOrderEditorModal(id, r, menuItems, true, order));

    // Finalize Order button
    const finalizeOrderBtn = backdrop.querySelector('#finalizeOrderBtn');
    if (finalizeOrderBtn) finalizeOrderBtn.addEventListener('click', () => finalizeOrder(id));

    // Confirm Reservation button
    const confirmReservationBtn = backdrop.querySelector('#confirmReservationBtn');
    if (confirmReservationBtn) confirmReservationBtn.addEventListener('click', () => openConfirmModal(id));

    // Admin Override button
    const adminOverrideBtn = backdrop.querySelector('#adminOverrideBtn');
    if (adminOverrideBtn) adminOverrideBtn.addEventListener('click', () => {
      const ok = confirm('The order editing deadline has passed. Are you sure you want to override the cutoff and modify this order?');
      if (ok) openOrderEditorModal(id, r, menuItems, true, order, true);
    });

    const adminOverrideEditBtn = backdrop.querySelector('#adminOverrideEditBtn');
    if (adminOverrideEditBtn) adminOverrideEditBtn.addEventListener('click', () => openOrderEditorModal(id, r, menuItems, true, order, true));
  }

  // Order Editor Modal
  function openOrderEditorModal(reservationId, reservation, menuItems, isEdit, existingOrder = null, adminOverride = false) {
    // Close the manage modal first
    closeModals();

    // Group menu items by category
    const categories = {};
    menuItems.forEach(item => {
      const cat = item.category_name || 'Uncategorized';
      if (!categories[cat]) categories[cat] = [];
      categories[cat].push(item);
    });

    // Build existing order items map for editing
    const existingItems = new Map();
    if (existingOrder?.items) {
      existingOrder.items.forEach(item => {
        const key = `${item.menu_id}|${item.notes || ''}|${JSON.stringify(item.add_ons?.map(a => `${a.addon_id}:${a.quantity}`).sort() || [])}`;
        existingItems.set(key, item);
      });
    }

    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop active';
    backdrop.innerHTML = `
      <div class="modal-box" style="max-width:800px; max-height:90vh; overflow-y:auto;">
        <div class="prd-modal-head" style="margin-bottom:16px;">
          <h3>${isEdit ? 'Edit' : 'Add'} Order — Reservation #${reservationId}</h3>
          <button class="close-btn" id="orderEditorCloseBtn"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>

        <div style="margin-bottom:16px; padding:12px; background:var(--stone); border-radius:8px; font-size:0.8rem;">
          <strong>${escapeHtml(reservation.customer_name)}</strong> • 
          ${reservation.reservation_date ? fmtDate(reservation.reservation_date) : '—'} at ${String(reservation.reservation_time || '').slice(0, 5)} • 
          ${reservation.guests} guests
        </div>

        <div id="orderEditorContent">
          <!-- Category tabs and items will be rendered here -->
        </div>

        <div style="margin-top:16px; border-top:1px solid var(--line); padding-top:16px;">
          <h4 style="font-family:'Archivo',sans-serif; text-transform:uppercase; font-size:0.85rem; margin-bottom:10px;">Current Order Items</h4>
          <div id="currentOrderItems" style="max-height:200px; overflow-y:auto;"></div>
          <div class="order-total-row" id="orderTotalRow" style="display:none;">
            <span>Total:</span>
            <span id="orderTotalDisplay">₱0.00</span>
          </div>
        </div>

        <div class="modal-error" id="orderEditorError"></div>
        <div class="modal-close-row" style="margin-top:20px;">
          <button class="btn btn-outline" id="orderEditorCancelBtn">Cancel</button>
          <button class="btn" id="orderEditorSaveBtn">${isEdit ? 'Update Order' : 'Save Order'}</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);

    const close = () => backdrop.remove();
    backdrop.querySelector('#orderEditorCloseBtn').addEventListener('click', close);
    backdrop.querySelector('#orderEditorCancelBtn').addEventListener('click', close);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });

    // Render category tabs and items
    renderOrderEditorCategories(backdrop, categories, existingItems);

    // Save button
    backdrop.querySelector('#orderEditorSaveBtn').addEventListener('click', async () => {
      await saveOrderFromEditor(reservationId, backdrop, adminOverride);
    });
  }

  // Order Editor State
  let orderEditorState = {
    selectedItems: new Map(), // key -> { menuItem, quantity, notes, addons: Map<addonId, quantity> }
  };

  function renderOrderEditorCategories(backdrop, categories, existingItems) {
    const contentEl = backdrop.querySelector('#orderEditorContent');
    const categoryNames = Object.keys(categories).sort();
    let activeCategory = categoryNames[0];

    const renderCategoryTabs = () => {
      return `
        <div style="display:flex; gap:4px; margin-bottom:12px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:8px;">
          ${categoryNames.map(cat => `
            <button type="button" class="prd-sub-tab ${cat === activeCategory ? 'active' : ''}" data-category="${escapeHtml(cat)}" style="padding:6px 12px; font-size:0.75rem;">
              ${escapeHtml(cat)}
            </button>
          `).join('')}
        </div>
      `;
    };

    const renderItems = (cat) => {
      const items = categories[cat];
      if (!items || !items.length) return '<div style="padding:12px; color:var(--ink-muted);">No items in this category</div>';

      return `
        <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:10px; max-height:300px; overflow-y:auto;">
          ${items.map(item => {
            // Check if this item is already in the order
            const existingKey = Array.from(orderEditorState.selectedItems.keys()).find(k => k.startsWith(`${item.id}|`));
            const isSelected = !!existingKey;
            const existingItem = existingKey ? orderEditorState.selectedItems.get(existingKey) : null;
            const qty = existingItem?.quantity || 1;

            return `
              <div class="prd-form-field" style="background:#fff; border:1px solid ${isSelected ? 'var(--brass)' : 'var(--line)'}; border-radius:8px; padding:10px; ${isSelected ? 'box-shadow:0 0 0 2px rgba(163,132,74,0.2);' : ''}">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                  <strong style="font-size:0.8rem;">${escapeHtml(item.name)}</strong>
                  <span style="font-family:'Space Mono',monospace; color:var(--brass-dark);">₱${Number(item.price).toFixed(2)}</span>
                </div>
                <div style="display:flex; gap:8px; align-items:center;">
                  <div class="stepper" style="flex-shrink:0;">
                    <button type="button" class="qty-dec" data-id="${item.id}" ${qty <= 1 ? 'disabled' : ''}>−</button>
                    <span class="qty-val" data-id="${item.id}">${qty}</span>
                    <button type="button" class="qty-inc" data-id="${item.id}">+</button>
                  </div>
                  <button type="button" class="btn ${isSelected ? 'btn-danger' : 'btn-ghost'}" 
                    data-action="${isSelected ? 'remove' : 'add'}" 
                    data-id="${item.id}"
                    style="flex:1; padding:6px 10px; font-size:0.7rem;"
                  >${isSelected ? 'Remove' : 'Add'}</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    };

    const updateView = () => {
      contentEl.innerHTML = renderCategoryTabs() + renderItems(activeCategory);
      
      // Bind category tabs
      contentEl.querySelectorAll('[data-category]').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.category;
          updateView();
        });
      });

      // Bind quantity buttons
      contentEl.querySelectorAll('.qty-inc, .qty-dec').forEach(btn => {
        btn.addEventListener('click', () => {
          const itemId = Number(btn.dataset.id);
          handleQuantityChange(itemId, btn.classList.contains('qty-inc') ? 1 : -1);
          updateView();
        });
      });

      // Bind add/remove buttons
      contentEl.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', () => {
          const itemId = Number(btn.dataset.id);
          const action = btn.dataset.action;
          if (action === 'add') {
            addItemToOrder(itemId);
          } else {
            removeItemFromOrder(itemId);
          }
          updateView();
          updateCurrentOrderDisplay(backdrop);
        });
      });
    };

    updateView();
    updateCurrentOrderDisplay(backdrop);
  }

  function addItemToOrder(itemId) {
    const item = menuItems.find(m => m.id === itemId);
    if (!item) return;
    
    const key = `${itemId}||`;
    orderEditorState.selectedItems.set(key, {
      menuItem: item,
      quantity: 1,
      notes: '',
      addons: new Map()
    });
  }

  function removeItemFromOrder(itemId) {
    // Find and remove all entries for this menu item
    const keysToRemove = Array.from(orderEditorState.selectedItems.keys()).filter(k => k.startsWith(`${itemId}|`));
    keysToRemove.forEach(k => orderEditorState.selectedItems.delete(k));
  }

  function handleQuantityChange(itemId, delta) {
    const key = Array.from(orderEditorState.selectedItems.keys()).find(k => k.startsWith(`${itemId}|`));
    if (!key) return;
    
    const item = orderEditorState.selectedItems.get(key);
    item.quantity = Math.max(1, item.quantity + delta);
    orderEditorState.selectedItems.set(key, item);
  }

  function updateCurrentOrderDisplay(backdrop) {
    const container = backdrop.querySelector('#currentOrderItems');
    const totalRow = backdrop.querySelector('#orderTotalRow');
    const totalDisplay = backdrop.querySelector('#orderTotalDisplay');

    if (orderEditorState.selectedItems.size === 0) {
      container.innerHTML = '<div style="padding:12px; color:var(--ink-muted); text-align:center;">No items added yet</div>';
      totalRow.style.display = 'none';
      return;
    }

    let total = 0;
    container.innerHTML = Array.from(orderEditorState.selectedItems.entries()).map(([key, data]) => {
      const subtotal = data.menuItem.price * data.quantity;
      total += subtotal;
      const addonTotal = Array.from(data.addons.values()).reduce((sum, a) => sum + a.price * a.quantity, 0);
      total += addonTotal;

      return `
        <div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px dashed var(--line);">
          <div>
            <strong>${escapeHtml(data.menuItem.name)}</strong>
            ${data.notes ? `<div class="item-notes">${escapeHtml(data.notes)}</div>` : ''}
            <span style="font-family:'Space Mono',monospace; color:var(--brass);">× ${data.quantity}</span>
          </div>
          <span style="font-family:'Space Mono',monospace; font-weight:700; color:var(--brass-dark);">
            ₱${(subtotal + addonTotal).toFixed(2)}
          </span>
        </div>
      `;
    }).join('');

    totalDisplay.textContent = `₱${total.toFixed(2)}`;
    totalRow.style.display = 'flex';
  }

  async function saveOrderFromEditor(reservationId, backdrop, adminOverride) {
    const errEl = backdrop.querySelector('#orderEditorError');
    const saveBtn = backdrop.querySelector('#orderEditorSaveBtn');

    if (orderEditorState.selectedItems.size === 0) {
      errEl.textContent = 'Please add at least one item to the order.';
      errEl.classList.add('show');
      return;
    }

    const items = Array.from(orderEditorState.selectedItems.values()).map(data => ({
      menu_id: data.menuItem.id,
      quantity: data.quantity,
      notes: data.notes,
      add_ons: Array.from(data.addons.entries()).map(([addonId, addon]) => ({
        addon_id: addonId,
        quantity: addon.quantity
      }))
    }));

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';
    errEl.classList.remove('show');

    try {
      const res = await adminFetch(`/api/admin/reservations/${reservationId}/order`, {
        method: 'POST',
        body: JSON.stringify({ 
          items, 
          status: 'editable',
          admin_override: adminOverride 
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not save order.');

      toast('Order saved successfully.', 'success');
      closeModals();
      // Reopen manage modal to show updated order
      openManageModal(reservationId);
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.add('show');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save Order';
    }
  }

  async function finalizeOrder(id) {
    const ok = await confirmDialog('Finalize this order? The customer will no longer be able to request changes (except admin override).', { confirmLabel: 'Finalize Order' });
    if (!ok) return;
    try {
      const res = await adminFetch(`/api/admin/reservations/${id}/reservation-status`, {
        method: 'PATCH',
        body: JSON.stringify({ reservation_status: 'order_finalized' }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not finalize order.');
      const r0 = reservations.find(x => x.id == id);
      if (r0) { r0.reservation_status = 'order_finalized'; r0.order_status = 'finalized'; }
      toast('Order finalized.', 'success');
      render();
      closeModals();
    } catch (err) {
      toast(err.message, 'error');
    }
  }

  function closeModals() {
    document.querySelectorAll('.modal-backdrop').forEach(m => m.remove());
  }

  // ---- Customer details modal (contact info for follow-up calls) ----

  function openDetailsModal(id) {
    const r = reservations.find(x => x.id == id);
    if (!r) return;
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop active';
    backdrop.innerHTML = `
      <div class="modal-box" style="max-width:520px;">
        <h3>${escapeHtml(r.customer_name)}</h3>
        <div class="detail-list">
          <dt>Email</dt>
          <dd>${r.customer_email ? `<a href="mailto:${escapeHtml(r.customer_email)}">${escapeHtml(r.customer_email)}</a>` : '—'}</dd>
          <dt>Phone</dt>
          <dd>${r.customer_phone ? `<a href="tel:${escapeHtml(r.customer_phone)}">${escapeHtml(r.customer_phone)}</a>` : '—'}</dd>
          <dt>Reservation</dt>
          <dd>${r.reservation_date ? fmtDate(r.reservation_date) : '—'} at ${String(r.reservation_time || '').slice(0, 5)}</dd>
          <dt>Guests</dt><dd>${r.guests}</dd>
          <dt>Table</dt><dd>${r.table_no ? escapeHtml(r.table_no) : 'Not yet assigned'}</dd>
          <dt>Status</dt><dd><span class="pill ${STATUS_PILL[r.status] || 'pill-neutral'}">${escapeHtml(r.status)}</span></dd>
          <dt>Requested</dt><dd>${formatDate(r.datetime_reserved)}</dd>
          <dt>Notes</dt><dd style="white-space:pre-wrap;">${r.notes ? escapeHtml(r.notes) : '—'}</dd>
        </div>
        <div class="modal-close-row"><button class="btn" id="detailsClose">Close</button></div>
      </div>
    `;
    document.body.appendChild(backdrop);
    backdrop.querySelector('#detailsClose').addEventListener('click', () => backdrop.remove());
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
  }

  async function updateReservationStatus(id, reservationStatus, contactNotes = null) {
    const r = reservations.find(x => x.id == id);
    if (!r) return;

    const verbMap = {
      contact_customer: 'Mark as contacted customer?',
      order_finalized: 'Finalize this order? Changes will be locked after this (except admin override).',
    };
    const verb = verbMap[reservationStatus] || `Change reservation status to ${reservationStatus}?`;
    const confirmLabelMap = {
      contact_customer: 'Mark Contacted',
      order_finalized: 'Finalize Order',
    };
    const confirmLabel = confirmLabelMap[reservationStatus] || 'Confirm';
    
    const ok = await confirmDialog(verb, { confirmLabel, danger: reservationStatus === 'cancelled' });
    if (!ok) return;

    try {
      const res = await adminFetch(`/api/admin/reservations/${id}/reservation-status`, {
        method: 'PATCH',
        body: JSON.stringify({ reservation_status: reservationStatus, contact_notes: contactNotes }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not update reservation status.');

      // Update local data
      const r0 = reservations.find(x => x.id == id);
      if (r0) {
        r0.reservation_status = reservationStatus;
        if (data.reservation) {
          Object.assign(r0, data.reservation);
        }
      }
      toast(`${reservationStatus.replace(/_/g, ' ')} updated.`, 'success');
      render();
      closeModals();
    } catch (err) {
      toast(err.message, 'error');
    }
  }

  async function updateStatus(id, status) {
    const r = reservations.find(x => x.id == id);
    if (!r) return;
    const verb = status === 'cancelled' ? 'Cancel this reservation?' : 'Mark this reservation as completed?';
    const ok = await confirmDialog(verb, { confirmLabel: status === 'cancelled' ? 'Cancel Reservation' : 'Mark Complete', danger: status === 'cancelled' });
    if (!ok) return;
    try {
      const res = await adminFetch(`/api/admin/reservations/${id}/status`, {
        method: 'PATCH',
        body: JSON.stringify({ status }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not update reservation.');
      r.status = status;
      toast(status === 'cancelled' ? 'Reservation cancelled.' : 'Reservation completed.', 'success');
      render();
    } catch (err) {
      toast(err.message, 'error');
    }
  }

  // ---- Shared helpers ----

  function toast(msg, kind = '') {
    let el = document.querySelector('.toast');
    if (!el) {
      el = document.createElement('div');
      el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.className = `toast show ${kind}`;
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 3500);
  }

  function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }

  function parseDateOnly(s) {
    if (!s) return null;
    const [y, m, d] = String(s).split('-').map(Number);
    return new Date(y, (m || 1) - 1, d || 1);
  }

  // Whole-day difference; date-only strings avoid the UTC/local TZ mismatch
  // you get from `new Date('YYYY-MM-DD')`.
  function dayDiff(dateStr, today) {
    const d = parseDateOnly(dateStr);
    if (!d) return Infinity;
    return Math.round((startOfDay(d) - today) / 86400000);
  }

  function fmtDate(dateStr) {
    const d = parseDateOnly(dateStr);
    return d ? d.toLocaleDateString('en-PH') : '—';
  }
</script>
