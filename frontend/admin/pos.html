<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Point of Sale — The~Yo's Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-shell.css?v=6">
<style>

/* ================================================================
   POS PAGE OVERRIDE — admin-body fills height edge-to-edge
   ================================================================ */
.admin-body { padding: 0 !important; display: flex; flex-direction: column; overflow: hidden; }
.admin-section { max-width: none !important; flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* ================================================================
   POS WORKSPACE — two-panel horizontal split
   ================================================================ */
.pos-workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 420px;
  height: calc(100vh - var(--header-h));
  overflow: hidden;
}

/* LEFT PANEL */
.pos-left {
  display: flex; flex-direction: column; overflow: hidden;
  border-right: 1px solid var(--line);
  background: var(--bone);
}
.pos-left-toolbar {
  flex-shrink: 0; padding: 18px 22px 14px;
  background: var(--component-bg);
  border-bottom: 1px solid var(--line);
}
.pos-search-row { display: flex; gap: 10px; margin-bottom: 12px; }
.pos-search-row input[type="text"] {
  flex: 1; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px;
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.88rem;
  background: var(--bone); color: var(--ink); transition: border-color 0.14s;
}
.pos-search-row input[type="text"]:focus { outline: none; border-color: var(--brass); background: #fff; }

.pos-cat-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pos-cat-pill {
  padding: 6px 14px; border-radius: 20px; border: 1px solid var(--line);
  background: var(--bone); color: var(--ink-muted);
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.62rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.04em;
  cursor: pointer; transition: all 0.14s; white-space: nowrap;
}
.pos-cat-pill:hover { border-color: var(--brass); color: var(--brass-dark); background: rgba(163,132,74,0.07); }
.pos-cat-pill.active { background: var(--brass); border-color: var(--brass); color: #fff; }

.pos-product-scroll { flex: 1; overflow-y: auto; padding: 20px 22px; overscroll-behavior: contain; }
.pos-product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 14px; }
.pos-product-card {
  overflow: hidden; border: 1px solid var(--line); border-radius: 12px;
  background: var(--component-bg); box-shadow: var(--shadow-xs);
  cursor: pointer; transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
}
.pos-product-card:hover { transform: translateY(-3px); border-color: var(--brass); box-shadow: var(--shadow-md); }
.pos-product-image {
  height: 110px; position: relative; overflow: hidden;
  background: linear-gradient(135deg, #ebe1d0, #c5ad80);
}
.pos-product-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pos-product-fallback {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; color: rgba(255,255,255,.9);
}
.pos-product-image.has-image .pos-product-fallback { display: none; }
.pos-product-copy { padding: 11px 13px 12px; display: flex; flex-direction: column; }
.pos-product-card .n { font-weight: 700; font-size: .85rem; line-height: 1.3; }
.pos-product-card .cat { font-size: .68rem; color: var(--ink-muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pos-product-card .product-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: 10px; }
.pos-product-card .p { font-family: 'Plus Jakarta Sans', sans-serif; color: var(--brass-dark); font-weight: 700; font-size: .88rem; }
.pos-add-mark {
  width: 30px; height: 30px; border: 0; border-radius: 8px;
  background: var(--brass); color: #fff; font-size: 1.1rem; font-weight: 700;
  pointer-events: none; display: flex; align-items: center; justify-content: center;
  transition: background 0.14s;
}
.pos-product-card:hover .pos-add-mark { background: var(--brass-dark); }
.addon-flag {
  display: inline-block; margin-left: 6px; padding: 2px 6px; border-radius: 20px;
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.52rem; font-weight: 700; text-transform: uppercase;
  background: rgba(163,132,74,0.14); color: var(--brass-dark); vertical-align: middle;
}

/* RIGHT PANEL */
.pos-right { display: flex; flex-direction: column; background: var(--component-bg); overflow: hidden; }
.pos-orders-head {
  flex-shrink: 0; display: flex; align-items: center;
  justify-content: space-between; gap: 10px; padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(to bottom, #fdfaf5, #fff);
}
.pos-orders-head h3 { margin: 0; font-family: 'Archivo', sans-serif; text-transform: uppercase; font-size: 0.95rem; letter-spacing: 0.03em; }
.pos-orders-head select {
  padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bone); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.8rem; color: var(--ink); cursor: pointer;
}
.pos-order-thead {
  flex-shrink: 0; display: grid; grid-template-columns: 1fr auto auto auto;
  padding: 9px 16px; border-bottom: 1px solid var(--line); background: var(--stone);
}
.pos-order-thead span {
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.58rem;
  text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-muted);
}
.pos-order-thead span:nth-child(2),
.pos-order-thead span:nth-child(3),
.pos-order-thead span:nth-child(4) { text-align: right; }

.pos-cart-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.pos-empty-orders { padding: 50px 20px; text-align: center; color: var(--ink-muted); font-size: 0.85rem; }
.pos-empty-orders svg { display: block; margin: 0 auto 12px; opacity: 0.25; }

.pos-cart-row {
  display: grid; grid-template-columns: 1fr auto auto auto;
  align-items: start; padding: 12px 16px; border-bottom: 1px solid var(--line); transition: background 0.12s;
}
.pos-cart-row:hover { background: #faf7f2; }
.pos-cart-row:last-child { border-bottom: none; }
.pos-cart-row .item-name { font-weight: 600; font-size: 0.84rem; line-height: 1.3; }
.pos-cart-row .item-notes { display: block; font-size: 0.71rem; opacity: 0.55; margin-top: 2px; }
.pos-cart-row .addon-notes { color: var(--brass-dark); opacity: 0.85; }
.edit-line-btn {
  border: 1px solid var(--line); background: var(--bone); border-radius: 4px; cursor: pointer;
  width: 20px; height: 20px; font-size: 0.72rem; line-height: 1; color: var(--brass-dark); flex-shrink: 0;
}
.edit-line-btn:hover { border-color: var(--brass); }
.pos-cart-row .unit-price {
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.78rem; color: var(--ink-muted);
  text-align: right; padding: 0 10px; white-space: nowrap; padding-top: 2px;
}
.qty-controls { display: flex; align-items: center; gap: 4px; padding: 0 8px; }
.qty-controls button {
  width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--line);
  background: var(--component-bg); cursor: pointer; font-weight: 700; color: var(--ink); line-height: 1;
  transition: border-color 0.12s, background 0.12s;
}
.qty-controls button:hover { border-color: var(--brass); background: var(--stone); }
.qty-controls span { font-family: 'Plus Jakarta Sans', sans-serif; min-width: 20px; text-align: center; font-size: 0.82rem; }
.pos-cart-row .line-total {
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.82rem; font-weight: 700;
  text-align: right; white-space: nowrap; padding-top: 2px;
}
.remove-line-btn {
  display: block; width: 100%; border: none; background: none;
  color: var(--danger); cursor: pointer; font-size: 0.75rem;
  text-align: right; padding: 2px 0; opacity: 0.6; transition: opacity 0.12s;
}
.remove-line-btn:hover { opacity: 1; }

.pos-summary { flex-shrink: 0; padding: 14px 20px; border-top: 2px solid var(--line); background: #fdfaf5; }
.pos-summary .sum-row {
  display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 0.84rem;
}
.pos-summary .sum-row span:first-child { color: var(--ink-muted); }
.pos-summary .sum-row input[type="number"] {
  width: 90px; text-align: right; padding: 4px 7px; border: 1px solid var(--line); border-radius: 5px;
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.82rem; background: var(--bone); color: var(--ink);
}
.pos-summary .sum-grand {
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 700; font-size: 1rem; border-top: 2px solid var(--ink); margin-top: 8px; padding-top: 10px;
}

.pos-actions { flex-shrink: 0; padding: 14px 20px; border-top: 1px solid var(--line); background: #fff; }
.pos-payment-select {
  width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 7px; margin-bottom: 10px;
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.84rem; background: var(--bone); color: var(--ink); cursor: pointer;
}
.cust-search-wrap { position: relative; margin-bottom: 8px; }
.cust-search-wrap input[type="text"] {
  width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 7px;
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.84rem; background: var(--bone); color: var(--ink);
}
.cust-results {
  position: absolute; top: 100%; left: 0; right: 0; z-index: 20;
  background: var(--component-bg); border: 1px solid var(--line); border-radius: 6px;
  margin-top: 4px; max-height: 200px; overflow-y: auto; box-shadow: 0 6px 16px rgba(0,0,0,0.1);
}
.cust-result-row { padding: 10px 12px; cursor: pointer; font-size: 0.84rem; border-bottom: 1px solid var(--line); }
.cust-result-row:last-child { border-bottom: none; }
.cust-result-row:hover { background: var(--stone); }
.cust-result-row .cn { font-weight: 700; }
.cust-result-row .ce { font-size: 0.73rem; opacity: 0.6; font-family: 'Plus Jakarta Sans', sans-serif; }
.cust-empty-hint { padding: 10px 12px; font-size: 0.8rem; opacity: 0.55; }
.cust-selected {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--stone); border: 1px solid var(--line); border-radius: 6px;
  padding: 9px 12px; font-size: 0.84rem; margin-bottom: 8px;
}
.cust-selected .cn { font-weight: 700; }
.cust-selected .ce { font-size: 0.71rem; opacity: 0.6; font-family: 'Plus Jakarta Sans', sans-serif; }
.cust-selected button {
  border: none; background: none; color: var(--brass-dark);
  font-size: 0.70rem; text-transform: uppercase; font-family: 'Plus Jakarta Sans', sans-serif; cursor: pointer; font-weight: 700;
}
.pos-hint { font-size: 0.70rem; color: var(--ink-muted); margin: 4px 0 10px; }
.pos-actions-row { display: flex; gap: 10px; margin-top: 4px; }
.pos-actions-row button { flex: 1; }

/* ================================================================
   CUSTOMIZE MODAL
   ================================================================ */
.cust-qty-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.cust-qty-row label { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.66rem; text-transform: uppercase; opacity: 0.55; }
.cust-qty-row .qty-controls button { width: 30px; height: 30px; font-size: 1rem; }
.cust-addon-section { margin-bottom: 16px; }
.cust-addon-section > label {
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.66rem; text-transform: uppercase;
  opacity: 0.55; display: block; margin-bottom: 6px;
}
.cust-addon-list { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.cust-addon-row {
  display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center;
  padding: 10px 14px; border-bottom: 1px solid var(--line); transition: background .12s;
}
.cust-addon-row:last-child { border-bottom: none; }
.cust-addon-row.is-selected { background: rgba(163,132,74,0.06); }
.cust-addon-row.is-disabled { opacity: 0.5; }
.cust-addon-check { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.cust-addon-check input { width: 16px; height: 16px; accent-color: var(--brass-dark); flex-shrink: 0; }
.cust-addon-check .cn { font-size: 0.86rem; font-weight: 600; }
.cust-addon-check .cs { font-size: 0.72rem; opacity: 0.55; margin-top: 1px; }
.cust-addon-row .cp { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.8rem; font-weight: 700; color: var(--brass-dark); }
.cust-addon-row .qty-controls button { width: 22px; height: 22px; }
.modal-box.cust-modal { max-width: 520px; width: 100%; }
.cust-totals { background: var(--stone); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 16px 0; }
.cust-totals .row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 0.84rem; }
.cust-totals .row.grand { font-weight: 700; border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 10px; font-size: 0.95rem; }

/* ================================================================
   PAYMENT SCREEN — full overlay on the admin content area
   ================================================================ */
.pay-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(10, 35, 37, 0.58);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  align-items: center;
  justify-content: center;
  padding: 18px;
  overflow-y: auto;
}
.pay-screen.active { display: flex; animation: payScreenIn 0.2s cubic-bezier(0.16,1,0.3,1) both; }

@keyframes payScreenIn {
  from { opacity: 0; transform: translateY(8px) scale(0.985); }
  to { opacity: 1; transform: none; }
}

.pay-card {
  background: var(--bone);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 520px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 36px);
}

/* Payment header */
.pay-card-header {
  background: linear-gradient(135deg, var(--brass) 0%, var(--brass-dark) 100%);
  color: #fff;
  padding: 15px 22px;
  display: flex;
  align-items: center;
  gap: 9px;
  flex-shrink: 0;
}
.pay-card-header .breadcrumb {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 600;
  font-size: 0.82rem;
  opacity: 0.72;
}
.pay-card-header .breadcrumb-sep { opacity: 0.5; margin: 0 3px; }
.pay-card-header .breadcrumb-current {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  font-size: 0.82rem;
  color: #fff;
}

/* Payment body scrollable */
.pay-card-body {
  overflow-y: auto;
  flex: 1;
  overscroll-behavior: contain;
  padding-bottom: 18px;
}

/* Total Amount Payable box */
.pay-total-box {
  margin: 18px 22px 0;
  background: #fff8e8;
  border: 1px solid #e9dfc8;
  border-radius: 9px;
  padding: 16px 18px;
}
.pay-total-label {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.68rem;
  color: var(--ink-muted);
  font-weight: 600;
  margin-bottom: 7px;
}
.pay-total-amount {
  font-family: 'Archivo', sans-serif;
  font-weight: 800;
  font-size: 2.15rem;
  color: var(--ink);
  letter-spacing: -0.025em;
  line-height: 1;
}

/* Payment method selector */
.pay-method-section { padding: 18px 22px 0; }
.pay-method-label {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-muted);
  font-weight: 700;
  margin-bottom: 10px;
}
.pay-method-pills {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.pay-method-pill {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bone);
  color: var(--ink-muted);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: all 0.14s;
}
.pay-method-pill:hover { border-color: var(--brass); color: var(--brass-dark); background: rgba(163,132,74,0.08); }
.pay-method-pill.active {
  background: var(--brass-dark); border-color: var(--brass-dark); color: #fff;
  box-shadow: 0 4px 12px rgba(138,109,58,0.28);
}
.pay-method-icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

/* Amount received box */
.pay-received-section {
  margin: 15px 22px 0;
  border: 1px solid var(--line);
  border-radius: 9px;
  overflow: hidden;
  background: #fff;
}
.pay-received-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 15px;
  border-bottom: 1px solid var(--line);
}
.pay-received-header span {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.72rem;
  color: var(--ink-muted);
  font-weight: 600;
}
.pay-split-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 11px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: #fff;
  color: var(--brass-dark);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.73rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.14s;
}
.pay-split-btn:hover { border-color: var(--brass); background: rgba(163,132,74,0.08); }
.pay-split-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

.pay-received-display {
  padding: 13px 16px 11px;
  font-family: 'Archivo', sans-serif;
  font-weight: 800;
  font-size: 2rem;
  color: var(--ink);
  letter-spacing: -0.02em;
  min-height: 58px;
  display: flex;
  align-items: center;
}
.pay-received-display.insufficient { color: var(--danger); }

/* Numeric Keypad */
.pay-keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  border-top: 1px solid var(--line);
  padding: 10px;
  background: var(--stone);
}
.pay-key {
  min-height: 50px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fff;
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 600;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.1s;
  text-align: center;
  user-select: none;
  -webkit-user-select: none;
}
.pay-key:hover { background: rgba(163,132,74,0.08); border-color: var(--brass); color: var(--brass-dark); }
.pay-key:active { transform: scale(0.96); background: rgba(163,132,74,0.16); }
.pay-key.backspace { color: var(--ink-muted); font-size: 1.1rem; }
.pay-key.backspace:hover { border-color: var(--danger); background: rgba(192,57,43,0.06); color: var(--danger); }

.pay-key-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 0 10px 10px;
  background: var(--stone);
}
.pay-key-action {
  min-height: 40px;
  border: 1px solid var(--line-strong);
  border-radius: 7px;
  background: #fff;
  color: var(--brass-dark);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.76rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.14s;
}
.pay-key-action:hover { background: rgba(163,132,74,0.08); border-color: var(--brass); }
.pay-key-action.clear { color: var(--ink-muted); }

/* Change display */
.pay-change-row {
  margin: 16px 22px 0;
  background: var(--stone);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 14px 18px;
}
.pay-change-row .row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
  font-size: 0.86rem;
}
.pay-change-row .row span:first-child { color: var(--ink-muted); }
.pay-change-row .change-value {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  color: var(--success);
}
.pay-change-row .change-value.negative { color: var(--danger); }
.pay-validation-msg {
  margin-top: 8px;
  padding: 8px 10px;
  background: rgba(192,57,43,0.07);
  border: 1px solid rgba(192,57,43,0.2);
  border-radius: 6px;
  color: var(--danger);
  font-size: 0.78rem;
  font-weight: 600;
  display: none;
}
.pay-validation-msg.visible { display: block; }

/* Split payment section (optional, shown when split toggled) */
.pay-split-section {
  display: none;
  margin: 14px 22px 0;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  overflow: hidden;
}
.pay-split-section.open { display: block; }
.pay-split-header {
  padding: 10px 14px;
  background: var(--stone);
  border-bottom: 1px solid var(--line);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.pay-split-close {
  background: none; border: none; color: var(--ink-muted);
  cursor: pointer; font-size: 0.9rem; padding: 0;
}
.pay-split-row {
  display: grid; grid-template-columns: 1fr auto auto;
  gap: 10px; align-items: center; padding: 10px 14px;
  border-bottom: 1px solid var(--line);
}
.pay-split-row:last-child { border-bottom: none; }
.pay-split-row select {
  padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.82rem; background: var(--bone); color: var(--ink);
}
.pay-split-row input[type="number"] {
  width: 110px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.82rem; background: var(--bone); color: var(--ink); text-align: right;
}
.pay-split-add-btn {
  display: flex; align-items: center; gap: 6px; padding: 8px 14px;
  margin: 8px 14px; border: 1px dashed var(--line); border-radius: 6px;
  background: none; color: var(--ink-muted); cursor: pointer; font-size: 0.8rem;
  transition: all 0.12s; width: calc(100% - 28px);
}
.pay-split-add-btn:hover { border-color: var(--brass); color: var(--brass-dark); }
.pay-split-total-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; background: var(--stone); border-top: 2px solid var(--line);
  font-size: 0.84rem; font-weight: 700;
}
.pay-split-total-row .split-overage { color: var(--success); }
.pay-split-total-row .split-shortage { color: var(--danger); }

/* Card footer — actions */
.pay-card-footer {
  flex-shrink: 0;
  padding: 14px 22px;
  border-top: 1px solid var(--line);
  background: #fff;
  display: flex;
  gap: 10px;
  margin-top: 0;
}
.pay-card-footer .btn { flex: 1; min-height: 44px; padding: 12px; font-size: 0.86rem; border-radius: 7px; }

/* Success screen */
.pay-success {
  display: none;
  flex-direction: column;
  align-items: center;
  padding: 32px 24px 24px;
  text-align: center;
}
.pay-success.active { display: flex; }
.pay-success-icon {
  width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(135deg, #2e7d4f, #1e5933);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
  box-shadow: 0 8px 24px rgba(46,125,79,0.28);
}
.pay-success-icon svg { width: 32px; height: 32px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.pay-success h3 {
  margin: 0 0 6px;
  font-family: 'Archivo', sans-serif;
  font-weight: 900;
  font-size: 1.3rem;
  text-transform: uppercase;
  color: var(--success);
}
.pay-success .txn-id {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.75rem;
  color: var(--ink-muted);
  margin-bottom: 20px;
}
.pay-receipt-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 20px;
  text-align: left;
  font-size: 0.86rem;
}
.pay-receipt-table td { padding: 8px 0; border-bottom: 1px solid var(--line); }
.pay-receipt-table td:last-child { text-align: right; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; }
.pay-receipt-table tr:last-child td { border-bottom: none; }
.pay-receipt-table .grand-row td {
  font-weight: 700; font-size: 0.95rem; border-top: 2px solid var(--ink); padding-top: 12px;
}
.pay-receipt-table .change-row td:last-child { color: var(--success); }

/* ================================================================
   RESPONSIVE
   ================================================================ */
@media (max-width: 900px) {
  .pos-workspace { grid-template-columns: 1fr; height: auto; overflow: visible; }
  .pos-left { border-right: none; border-bottom: 1px solid var(--line); }
  .pos-product-scroll { overflow: visible; max-height: none; }
  .pos-right { overflow: visible; }
  .pos-cart-scroll { overflow: visible; max-height: none; }
  .admin-body { overflow: auto !important; }
  .admin-section { overflow: visible !important; }
  .pay-card { max-height: none; }
}
@media (max-width: 480px) {
  .pos-product-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .pos-actions-row { flex-direction: column; }
  .pay-method-pill { min-width: 60px; font-size: 0.75rem; }
  .pay-total-amount { font-size: 1.8rem; }
  .pay-received-display { font-size: 1.6rem; }
}

</style>

  /* ================================================================
     DATA LOADING
     ================================================================ */
  function toggleModal(show) { document.getElementById('customizeModal').classList.toggle('active', show); }

  async function loadCategories() {
    try {
      const res = await adminFetch('/api/admin/products/categories');
      const data = await res.json();
      if (!res.ok) return;
      categories = data.data || [];
      const pillsWrap = document.getElementById('catPillsWrap');
      pillsWrap.innerHTML =
        `<button class="pos-cat-pill active" data-cat="all">All</button>` +
        categories.map(c => `<button class="pos-cat-pill" data-cat="${c.id}">${escapeHtml(c.name)}</button>`).join('');
      pillsWrap.querySelectorAll('.pos-cat-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          pillsWrap.querySelectorAll('.pos-cat-pill').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeCategoryId = btn.dataset.cat;
          renderList();
        });
      });
    } catch { /* non-fatal */ }
  }

  async function loadMenu() {
    try {
      const res = await adminFetch('/api/admin/products/menuitems');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not load menu.');
      menuItems = (data.items || []).filter(i => i.status === 'available');
      renderList();
    } catch (err) {
      document.getElementById('posListWrap').innerHTML = `<div class="admin-error">⚠ ${err.message}</div>`;
    }
  }

  async function loadAddons() {
    try {
      const res = await adminFetch('/api/admin/products/addons');
      const data = await res.json();
      if (!res.ok) return;
      addons = data.addons || [];
      renderList();
    } catch { /* non-fatal */ }
  }

  function getAddonsForProduct(menuId) {
    return addons.filter(a => {
      if (!a.products || a.products.length === 0) return true;
      return a.products.some(p => String(p.menu_id) === String(menuId));
    });
  }

  /* ================================================================
     MENU LIST
     ================================================================ */
  function renderList() {
    let visible = menuItems;
    if (activeCategoryId !== 'all') visible = visible.filter(i => String(i.category_id) === String(activeCategoryId));
    if (searchTerm) visible = visible.filter(i => i.name.toLowerCase().includes(searchTerm));

    const wrap = document.getElementById('posListWrap');
    if (visible.length === 0) {
      wrap.innerHTML = `<div class="pos-empty-orders">No items match.</div>`;
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'pos-product-grid';
    grid.innerHTML = visible.map(i => {
      const hasAddons = getAddonsForProduct(i.id).length > 0;
      const isDrink = (i.category_name || '').toLowerCase().match(/coffee|beverage|drink|tea|frappe|espresso/);
      const fallbackIcon = isDrink
        ? `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.75;"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>`
        : `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.75;"><path d="M4 12h16M4 12a8 4 0 0 0 16 0M4 12a8 4 0 0 1 16 0"/></svg>`;

      return `
        <div class="pos-product-card" data-id="${i.id}" data-name="${escapeHtml(i.name)}" data-price="${i.price}">
          <div class="pos-product-image${i.image_url ? ' has-image' : ''}">
            ${i.image_url ? `<img src="${escapeHtml(i.image_url)}" alt="${escapeHtml(i.name)}" loading="lazy" onerror="const p = this.parentElement; this.remove(); if (p) p.classList.remove('has-image');">` : ''}
            <span class="pos-product-fallback">${fallbackIcon}</span>
          </div>
          <div class="pos-product-copy">
            <div class="n">${escapeHtml(i.name)}${hasAddons ? '<span class="addon-flag">Add-ons</span>' : ''}</div>
            <div class="cat">${escapeHtml(i.category_name || 'Menu item')}</div>
            <div class="product-foot"><div class="p">${peso(i.price)}</div><span class="pos-add-mark">+</span></div>
          </div>
        </div>`;
    }).join('');

    wrap.innerHTML = '';
    wrap.appendChild(grid);
    grid.querySelectorAll('.pos-product-card').forEach(el => {
      el.addEventListener('click', () => openCustomizeModal(el.dataset.id, el.dataset.name, Number(el.dataset.price)));
    });
  }

  /* ================================================================
     CUSTOMIZE MODAL
     ================================================================ */
  function openCustomizeModal(menuId, name, price, line = null) {
    editingUniqueId = line ? line.uniqueId : null;
    customize = {
      menu_id: menuId, name,
      base_price: Number(price),
      qty: line ? line.qty : 1,
      notes: line ? (line.notes || '') : '',
      selected: new Map(),
    };
    if (line) {
      (line.add_ons || []).forEach(a => customize.selected.set(String(a.addon_id), a.qty));
    }
    document.getElementById('customizeModalTitle').textContent = `Customize — ${name}`;
    document.getElementById('customizeNotes').value = customize.notes;
    document.getElementById('customizeAddBtn').textContent = line ? 'Update Item' : 'Add to Order';
    renderAddonList();
    updateCustomizeTotals();
    toggleModal(true);
  }

  function renderAddonList() {
    const wrap = document.getElementById('custAddonsWrap');
    const list = document.getElementById('custAddonList');
    const applicable = getAddonsForProduct(customize.menu_id);

    if (!applicable.length) { wrap.style.display = 'none'; return; }
    wrap.style.display = 'block';

    list.innerHTML = applicable.map(a => {
      const selected = customize.selected.has(String(a.id));
      const disabled = a.status !== 'available';
      const qty = customize.selected.get(String(a.id)) || 1;
      return `
        <div class="cust-addon-row ${disabled ? 'is-disabled' : ''} ${selected ? 'is-selected' : ''}">
          <label class="cust-addon-check">
            <input type="checkbox" data-aid="${a.id}" ${disabled ? 'disabled' : ''} ${selected ? 'checked' : ''}>
            <div>
              <div class="cn">${escapeHtml(a.name)}</div>
              <div class="cs">${disabled ? 'Unavailable / out of stock' : escapeHtml(a.category || 'Add-On')}</div>
            </div>
          </label>
          <div class="cp">${peso(a.price)}</div>
          <div class="qty-controls addon-qty" ${selected && !disabled ? '' : 'style="display:none"'}>
            <button data-aid="${a.id}" data-d="-1">−</button>
            <span>${qty}</span>
            <button data-aid="${a.id}" data-d="1">+</button>
          </div>
        </div>`;
    }).join('');

    list.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', () => {
        if (cb.checked) customize.selected.set(cb.dataset.aid, 1);
        else customize.selected.delete(cb.dataset.aid);
        renderAddonList();
        updateCustomizeTotals();
      });
    });
    list.querySelectorAll('.addon-qty button').forEach(btn => {
      btn.addEventListener('click', () => {
        const aid = btn.dataset.aid;
        const cur = customize.selected.get(aid) || 1;
        const next = Math.max(1, cur + Number(btn.dataset.d));
        customize.selected.set(aid, next);
        btn.parentElement.querySelector('span').textContent = next;
        updateCustomizeTotals();
      });
    });
  }

  function changeCustomizeQty(delta) {
    if (!customize) return;
    customize.qty = Math.max(1, customize.qty + delta);
    document.getElementById('custQty').textContent = customize.qty;
    updateCustomizeTotals();
  }

  function updateCustomizeTotals() {
    if (!customize) return;
    const itemTotal = customize.base_price * customize.qty;
    let addonsTotal = 0;
    customize.selected.forEach((q, id) => {
      const a = addons.find(x => String(x.id) === String(id));
      if (a) addonsTotal += Number(a.price) * q;
    });
    document.getElementById('custItemTotal').textContent = peso(itemTotal);
    document.getElementById('custAddonsTotal').textContent = peso(addonsTotal);
    document.getElementById('custLineTotal').textContent = peso(itemTotal + addonsTotal);
  }

  function resetCustomize() { customize = null; editingUniqueId = null; }

  /* ================================================================
     CART
     ================================================================ */
  function cartLineKey(c) {
    const addonKey = (c.add_ons || []).slice()
      .sort((x, y) => x.addon_id - y.addon_id)
      .map(a => `${a.addon_id}x${a.qty}`).join(',');
    return `${c.menu_id}|${addonKey}|${c.notes || ''}`;
  }

  function lineTotal(c) {
    const adds = (c.add_ons || []).reduce((s, a) => s + Number(a.price) * Number(a.qty), 0);
    return Number(c.price) * Number(c.qty) + adds;
  }

  function confirmAddToCart() {
    if (!customize) return;
    const notes = document.getElementById('customizeNotes').value.trim() || null;
    const addOns = [...customize.selected.entries()].map(([id, q]) => {
      const a = addons.find(x => String(x.id) === String(id));
      return { addon_id: Number(id), name: a ? a.name : 'Add-On', price: a ? Number(a.price) : 0, qty: q };
    });
    const line = { menu_id: customize.menu_id, name: customize.name, price: customize.base_price, qty: customize.qty, notes, add_ons: addOns };

    if (editingUniqueId) {
      const idx = cart.findIndex(c => c.uniqueId === editingUniqueId);
      if (idx >= 0) cart[idx] = { ...line, uniqueId: editingUniqueId };
    } else {
      const key = cartLineKey(line);
      const existing = cart.find(c => cartLineKey(c) === key);
      if (existing) existing.qty += line.qty;
      else cart.push({ ...line, uniqueId: Date.now() + Math.random() });
    }
    resetCustomize();
    toggleModal(false);
    renderCart();
  }

  function changeQty(uniqueId, delta) {
    const entry = cart.find(c => c.uniqueId == uniqueId);
    if (!entry) return;
    entry.qty += delta;
    if (entry.qty <= 0) cart = cart.filter(c => c.uniqueId != uniqueId);
    renderCart();
  }

  function removeLine(uniqueId) {
    cart = cart.filter(c => c.uniqueId != uniqueId);
    renderCart();
  }

  function clearOrder() {
    cart = [];
    clearSelectedCustomer();
    const dfi = document.getElementById('deliveryFeeInput');
    if (dfi) dfi.value = '0';
    renderCart();
  }

  function renderCart() {
    const rowsWrap = document.getElementById('cartRowsWrap');
    const emptyState = document.getElementById('cartEmptyState');

    if (cart.length === 0) {
      rowsWrap.innerHTML = '';
      emptyState.style.display = 'block';
    } else {
      emptyState.style.display = 'none';
      rowsWrap.innerHTML = cart.map(c => `
        <div class="pos-cart-row">
          <div>
            <div style="display:flex; align-items:center; gap:5px; flex-wrap:wrap;">
              <span class="item-name">${escapeHtml(c.name)}</span>
              <button class="edit-line-btn" data-id="${c.uniqueId}" title="Customize">✎</button>
            </div>
            ${c.notes ? `<span class="item-notes">${escapeHtml(c.notes)}</span>` : ''}
            ${(c.add_ons || []).length ? `<span class="item-notes addon-notes">+ ${c.add_ons.map(a => `${escapeHtml(a.name)} ×${a.qty} (${peso(a.price * a.qty)})`).join(', ')}</span>` : ''}
            <button class="remove-line-btn" data-id="${c.uniqueId}">✕ Remove</button>
          </div>
          <div class="unit-price">${peso(c.price)}</div>
          <div class="qty-controls" style="padding: 0 6px;">
            <button data-id="${c.uniqueId}" data-delta="-1" class="qty-btn">−</button>
            <span>${c.qty}</span>
            <button data-id="${c.uniqueId}" data-delta="1" class="qty-btn">+</button>
          </div>
          <div class="line-total">${peso(lineTotal(c))}</div>
        </div>`).join('');

      rowsWrap.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', () => changeQty(btn.dataset.id, Number(btn.dataset.delta)));
      });
      rowsWrap.querySelectorAll('.remove-line-btn').forEach(btn => {
        btn.addEventListener('click', () => removeLine(btn.dataset.id));
      });
      rowsWrap.querySelectorAll('.edit-line-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const line = cart.find(c => c.uniqueId == btn.dataset.id);
          if (line) openCustomizeModal(line.menu_id, line.name, line.price, line);
        });
      });
    }

    const totalAmount = cart.reduce((sum, c) => sum + lineTotal(c), 0);
    const deliveryFee = Number(document.getElementById('deliveryFeeInput').value) || 0;
    document.getElementById('sumTotal').textContent = peso(totalAmount);
    document.getElementById('sumGrand').textContent = peso(totalAmount + deliveryFee);
  }

  /* ================================================================
     PAYMENT SCREEN
     ================================================================ */
  function openPaymentScreen() {
    const errEl = document.getElementById('posError');
    errEl.style.display = 'none';

    if (cart.length === 0) {
      errEl.textContent = 'Cart is empty.';
      errEl.style.display = 'block';
      return;
    }

    const order_type = document.getElementById('posOrderType').value;
    const delivery_fee = Number(document.getElementById('deliveryFeeInput').value) || 0;
    const totalAmount = cart.reduce((sum, c) => sum + lineTotal(c), 0);
    paymentGrandTotal = totalAmount + delivery_fee;

    // Validate delivery address for delivery orders
    if (order_type === 'delivery') {
      const hasAddress = selectedCustomer && selectedCustomer.address;
      if (!hasAddress) {
        errEl.textContent = 'Delivery orders require a customer with an address. Please add/select a customer with address.';
        errEl.style.display = 'block';
        return;
      }
    }

    // Cache params for final submit
    pendingOrderParams = {
      order_type,
      delivery_fee,
      customer_id: selectedCustomer && !selectedCustomer.isNew ? Number(selectedCustomer.id) : null,
      customer_name: selectedCustomer ? selectedCustomer.name : null,
      customer_phone: selectedCustomer ? selectedCustomer.phone : null,
      delivery_address: (order_type === 'delivery' && selectedCustomer) ? selectedCustomer.address : null,
      cart: cart.map(c => ({
        menu_id: c.menu_id,
        quantity: c.qty,
        notes: c.notes,
        add_ons: (c.add_ons || []).map(a => ({ addon_id: a.addon_id, quantity: a.qty })),
      })),
    };

    // Reset payment state
    paymentReceivedStr = '0';
    paymentMethod = 'cash';
    splitRows = [];
    splitMode = false;

    // Reset method pills
    document.querySelectorAll('.pay-method-pill').forEach(b => b.classList.remove('active'));
    document.querySelector('.pay-method-pill[data-method="cash"]').classList.add('active');

    // Reset split section
    closeSplitPayment();

    // Reset success view
    document.getElementById('paySuccess').classList.remove('active');
    document.getElementById('payCardBody').style.display = '';
    document.getElementById('payCardFooter').innerHTML = `
      <button class="btn btn-outline" id="payCancelBtn">Cancel</button>
      <button class="btn" id="payConfirmBtn">Confirm Payment</button>
    `;
    document.getElementById('payCancelBtn').addEventListener('click', closePaymentScreen);
    document.getElementById('payConfirmBtn').addEventListener('click', confirmPayment);

    // Set total display
    document.getElementById('payTotalDisplay').textContent = peso(paymentGrandTotal);

    toggleKeypadVisibility();
    updatePaymentUI();

    document.getElementById('payScreen').classList.add('active');
  }

  function closePaymentScreen() {
    document.getElementById('payScreen').classList.remove('active');
  }

  function toggleKeypadVisibility() {
    const receivedSection = document.getElementById('payReceivedSection');
    receivedSection.style.display = splitMode ? 'none' : '';
  }

  function handleKeypadInput(key) {
    if (key === 'back') {
      if (paymentReceivedStr.length <= 1) paymentReceivedStr = '0';
      else paymentReceivedStr = paymentReceivedStr.slice(0, -1);
    } else if (key === '.') {
      if (!paymentReceivedStr.includes('.')) paymentReceivedStr += '.';
    } else {
      if (paymentReceivedStr === '0') paymentReceivedStr = key;
      else paymentReceivedStr += key;
    }
    // Limit to 2 decimal places
    const parts = paymentReceivedStr.split('.');
    if (parts[1] && parts[1].length > 2) paymentReceivedStr = parts[0] + '.' + parts[1].slice(0, 2);
    updatePaymentUI();
  }

  function getEffectiveReceived() {
    if (splitMode) {
      return splitRows.reduce((s, r) => s + (Number(r.amount) || 0), 0);
    }
    return parseFloat(paymentReceivedStr) || 0;
  }

  function updatePaymentUI() {
    const received = getEffectiveReceived();
    const difference = received - paymentGrandTotal;
    const splitAmountsValid = !splitMode || (
      splitRows.length >= 2 &&
      splitRows.every((row) => Number(row.amount) > 0)
    );
    const isValid = splitMode
      ? splitAmountsValid && Math.abs(difference) < 0.01
      : received >= paymentGrandTotal - 0.001;

    const displayEl = document.getElementById('payReceivedDisplay');
    displayEl.textContent = splitMode
      ? peso(received)
      : (paymentReceivedStr.endsWith('.') ? `₱${paymentReceivedStr}` : peso(received || 0));
    displayEl.classList.toggle('insufficient', !isValid && received > 0);

    document.getElementById('payChangeReceived').textContent = peso(received);
    document.getElementById('payChangeDue').textContent = peso(paymentGrandTotal);
    const changeEl = document.getElementById('payChangeValue');
    const shownChange = splitMode ? 0 : difference;
    changeEl.textContent = shownChange >= 0 ? peso(shownChange) : `-${peso(Math.abs(shownChange))}`;
    changeEl.className = 'change-value' + (shownChange < 0 ? ' negative' : '');

    const validEl = document.getElementById('payValidationMsg');
    if (splitMode && !isValid) {
      validEl.textContent = !splitAmountsValid
        ? '⚠ Add at least two positive payment amounts.'
        : `⚠ Split total must equal ${peso(paymentGrandTotal)} (${difference > 0 ? 'over' : 'short'} by ${peso(Math.abs(difference))}).`;
    } else {
      validEl.textContent = '⚠ Amount received is insufficient.';
    }
    validEl.classList.toggle('visible', splitMode ? !isValid : (received > 0 && !isValid));

    const confirmBtn = document.getElementById('payConfirmBtn');
    if (confirmBtn) {
      confirmBtn.disabled = !isValid;
      confirmBtn.style.opacity = isValid ? '1' : '0.5';
    }
  }

  /* ================================================================
     SPLIT PAYMENT
     ================================================================ */
  function openSplitPayment() {
    splitMode = true;
    const firstAmount = Math.floor((paymentGrandTotal * 100) / 2) / 100;
    splitRows = [
      { method: paymentMethod, amount: firstAmount },
      { method: paymentMethod === 'cash' ? 'gcash' : 'cash', amount: Number((paymentGrandTotal - firstAmount).toFixed(2)) },
    ];
    document.getElementById('paySplitSection').classList.add('open');
    toggleKeypadVisibility();
    renderSplitRows();
    updatePaymentUI();
  }

  function closeSplitPayment() {
    splitMode = false;
    splitRows = [];
    document.getElementById('paySplitSection').classList.remove('open');
    toggleKeypadVisibility();
    updatePaymentUI();
  }

  function addSplitRow() {
    splitRows.push({ method: 'cash', amount: 0 });
    renderSplitRows();
    updatePaymentUI();
  }

  function updateSplitTotal() {
    const splitTotal = splitRows.reduce((sum, row) => sum + (Number(row.amount) || 0), 0);
    const difference = splitTotal - paymentGrandTotal;
    const totalEl = document.getElementById('paySplitTotalDisplay');
    totalEl.textContent = peso(splitTotal);
    totalEl.className = Math.abs(difference) < 0.01 ? 'split-overage' : 'split-shortage';
  }

  function renderSplitRows() {
    const container = document.getElementById('paySplitRows');
    container.innerHTML = splitRows.map((row, idx) => `
      <div class="pay-split-row">
        <select data-idx="${idx}" class="split-method-sel" aria-label="Payment method ${idx + 1}">
          <option value="cash" ${row.method === 'cash' ? 'selected' : ''}>Cash</option>
          <option value="gcash" ${row.method === 'gcash' ? 'selected' : ''}>GCash</option>
        </select>
        <input type="number" class="split-amount-inp" data-idx="${idx}" value="${Number(row.amount).toFixed(2)}" min="0.01" step="0.01" placeholder="Amount" aria-label="Payment amount ${idx + 1}">
        <button class="remove-line-btn" data-idx="${idx}" style="width:auto; padding:4px 8px;" ${splitRows.length <= 2 ? 'disabled' : ''} aria-label="Remove payment">${splitRows.length > 2 ? '✕' : ''}</button>
      </div>`).join('');

    updateSplitTotal();

    container.querySelectorAll('.split-method-sel').forEach(sel => {
      sel.addEventListener('change', () => {
        splitRows[Number(sel.dataset.idx)].method = sel.value;
        updatePaymentUI();
      });
    });
    container.querySelectorAll('.split-amount-inp').forEach(inp => {
      inp.addEventListener('input', () => {
        splitRows[Number(inp.dataset.idx)].amount = Number(inp.value) || 0;
        updateSplitTotal();
        updatePaymentUI();
      });
    });
    container.querySelectorAll('.remove-line-btn[data-idx]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (splitRows.length > 2) {
          splitRows.splice(Number(btn.dataset.idx), 1);
          renderSplitRows();
          updatePaymentUI();
        }
      });
    });
  }

  /* ================================================================
     CONFIRM PAYMENT — send to API
     ================================================================ */
  async function confirmPayment() {
    const received = getEffectiveReceived();
    const splitIsValid = splitMode && splitRows.length >= 2 &&
      splitRows.every((row) => Number(row.amount) > 0) &&
      Math.abs(received - paymentGrandTotal) < 0.01;
    if ((!splitMode && received < paymentGrandTotal - 0.001) || (splitMode && !splitIsValid)) {
      updatePaymentUI();
      document.getElementById('payValidationMsg').classList.add('visible');
      return;
    }

    const confirmBtn = document.getElementById('payConfirmBtn');
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Processing…';

    const completedPaymentMethod = splitMode ? 'split' : paymentMethod;
    try {
      const res = await adminFetch('/api/admin/sales/pos/orders', {
        method: 'POST',
        body: JSON.stringify({
          ...pendingOrderParams,
          payment_method: paymentMethod,
          payments: splitMode
            ? splitRows.map((row) => ({
                payment_method: row.method,
                amount: Number(Number(row.amount).toFixed(2)),
              }))
            : undefined,
          amount_received: received,
          change_given: splitMode ? 0 : parseFloat((received - paymentGrandTotal).toFixed(2)),
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not place order.');

      showSuccessScreen(data.order, received, completedPaymentMethod);
      clearOrder();
      loadMenu();
      loadAddons();

    } catch (err) {
      const validEl = document.getElementById('payValidationMsg');
      validEl.textContent = `⚠ ${err.message}`;
      validEl.classList.add('visible');
      confirmBtn.disabled = false;
      confirmBtn.textContent = 'Confirm Payment';
    }
  }

  function showSuccessScreen(order, amountReceived, completedPaymentMethod) {
    const change = completedPaymentMethod === 'split' ? 0 : amountReceived - paymentGrandTotal;
    const orderId = order ? order.id : '—';
    const orderTotal = order ? Number(order.total_amount) : paymentGrandTotal;
    const deliveryFee = Number(pendingOrderParams.delivery_fee) || 0;
    const methodLabel = { cash: 'Cash', gcash: 'GCash', split: 'Split Payment' };

    document.getElementById('paySuccessTxnId').textContent = `Transaction #${orderId}`;
    document.getElementById('payReceiptTable').innerHTML = `
      <tr><td style="color:var(--ink-muted)">Subtotal</td><td>${peso(orderTotal - deliveryFee)}</td></tr>
      <tr><td style="color:var(--ink-muted)">Delivery Fee</td><td>${peso(deliveryFee)}</td></tr>
      <tr class="grand-row"><td>Grand Total</td><td>${peso(paymentGrandTotal)}</td></tr>
      <tr><td style="color:var(--ink-muted)">Amount Paid</td><td>${peso(amountReceived)}</td></tr>
      <tr class="change-row"><td style="color:var(--ink-muted)">Change</td><td>${peso(Math.max(0, change))}</td></tr>
      <tr><td style="color:var(--ink-muted)">Payment Method</td><td>${methodLabel[completedPaymentMethod] || completedPaymentMethod}</td></tr>
    `;

    document.getElementById('paySuccess').classList.add('active');
    document.getElementById('payCardBody').scrollTop = 0;

    // Replace footer with Done button
    document.getElementById('payCardFooter').innerHTML = `
      <button class="btn" id="payDoneBtn" style="flex:1;">Done</button>
    `;
    document.getElementById('payDoneBtn').addEventListener('click', () => {
      closePaymentScreen();
    });
  }

  /* ================================================================
     CUSTOMER SEARCH
     ================================================================ */
  function onCustomerSearchInput(e) {
    const q = e.target.value.trim();
    clearTimeout(custSearchDebounce);
    if (q.length < 2) { document.getElementById('custResults').style.display = 'none'; return; }
    custSearchDebounce = setTimeout(() => searchCustomers(q), 250);
  }

  async function searchCustomers(q) {
    const resultsEl = document.getElementById('custResults');
    try {
      const res = await adminFetch(`/api/admin/customers/search?q=${encodeURIComponent(q)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Search failed.');
      const customers = data.customers || [];
      resultsEl.innerHTML = customers.length
        ? customers.map(c => `
            <div class="cust-result-row" data-id="${c.id}" data-name="${escapeHtml(c.name)}" data-email="${escapeHtml(c.email || '')}" data-phone="${escapeHtml(c.phone || '')}" data-address="${escapeHtml(c.address || '')}">
              <div class="cn">${escapeHtml(c.name)}</div>
              <div class="ce">${escapeHtml(c.email || c.phone || '')}</div>
            </div>`).join('')
        : `<div class="cust-empty-hint">No matching customers.</div>`;
      resultsEl.style.display = 'block';
      resultsEl.querySelectorAll('.cust-result-row[data-id]').forEach(row => {
        row.addEventListener('click', () => selectCustomer(row.dataset.id, row.dataset.name, row.dataset.email, row.dataset.phone, row.dataset.address));
      });
    } catch (err) {
      resultsEl.innerHTML = `<div class="cust-empty-hint">⚠ ${err.message}</div>`;
      resultsEl.style.display = 'block';
    }
  }

  function selectCustomer(id, name, email, phone, address) {
    selectedCustomer = { id, name, email, phone, address };
    document.getElementById('custResults').style.display = 'none';
    document.getElementById('custSearchInput').value = '';
    document.getElementById('custSearchWrap').style.display = 'none';
    const selectedWrap = document.getElementById('custSelectedWrap');
    selectedWrap.style.display = 'block';
    selectedWrap.innerHTML = `
      <div class="cust-selected">
        <div><div class="cn">${escapeHtml(name)}</div><div class="ce">${escapeHtml(email || phone || '')}</div></div>
        <button id="custChangeBtn">Change</button>
      </div>`;
    document.getElementById('custChangeBtn').addEventListener('click', clearSelectedCustomer);
  }

  function clearSelectedCustomer() {
    selectedCustomer = null;
    document.getElementById('custSelectedWrap').style.display = 'none';
    document.getElementById('custSelectedWrap').innerHTML = '';
    document.getElementById('custSearchWrap').style.display = 'block';
  }

  function clearCustForm() {
    document.getElementById('custFormName').value = '';
    document.getElementById('custFormPhone').value = '';
    document.getElementById('custFormEmail').value = '';
    document.getElementById('custFormAddress').value = '';
  }

  function saveNewCustomer() {
    const name = document.getElementById('custFormName').value.trim();
    const phone = document.getElementById('custFormPhone').value.trim();
    const email = document.getElementById('custFormEmail').value.trim();
    const address = document.getElementById('custFormAddress').value.trim();
    const orderType = document.getElementById('posOrderType').value;

    if (!name) { alert('Name is required'); return; }
    if (!phone) { alert('Phone is required'); return; }
    if (orderType === 'delivery' && !address) { alert('Address is required for delivery orders'); return; }

    selectedCustomer = {
      id: 'new_' + Date.now(),
      name,
      email,
      phone,
      address,
      isNew: true
    };

    clearCustForm();
    document.getElementById('custFormWrap').style.display = 'none';
    document.getElementById('showCustFormBtn').style.display = '';

    document.getElementById('custResults').style.display = 'none';
    document.getElementById('custSearchInput').value = '';
    document.getElementById('custSearchWrap').style.display = 'none';
    const selectedWrap = document.getElementById('custSelectedWrap');
    selectedWrap.style.display = 'block';
    selectedWrap.innerHTML = `
      <div class="cust-selected">
        <div><div class="cn">${escapeHtml(name)}</div><div class="ce">${escapeHtml(email || phone || '')}</div></div>
        <button id="custChangeBtn">Change</button>
      </div>`;
    document.getElementById('custChangeBtn').addEventListener('click', clearSelectedCustomer);
  }
</script>
</body>
</html>
