<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Point of Sale — The~Yo's Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-shell.css?v=4">
<style>

/* ================================================================
   POS PAGE OVERRIDE — make admin-body fill height, no padding
   ================================================================ */
.admin-body { padding: 0 !important; display: flex; flex-direction: column; }
.admin-section { max-width: none !important; flex: 1; display: flex; flex-direction: column; }

/* ================================================================
   POS WORKSPACE — two-panel horizontal split
   ================================================================ */
.pos-workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 420px;
  height: calc(100vh - var(--header-h));
  overflow: hidden;
}

/* LEFT PANEL */
.pos-left {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-right: 1px solid var(--line);
  background: var(--bone);
}

.pos-left-toolbar {
  flex-shrink: 0;
  padding: 18px 22px 14px;
  background: var(--component-bg);
  border-bottom: 1px solid var(--line);
}

.pos-search-row {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}

.pos-search-row input[type="text"] {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  font-size: 0.88rem;
  background: var(--bone);
  color: var(--ink);
  transition: border-color 0.14s;
}
.pos-search-row input[type="text"]:focus {
  outline: none;
  border-color: var(--brass);
  background: #fff;
}

.pos-cat-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.pos-cat-pill {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: var(--bone);
  color: var(--ink-muted);
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: all 0.14s;
  white-space: nowrap;
}
.pos-cat-pill:hover {
  border-color: var(--brass);
  color: var(--brass-dark);
  background: rgba(163,132,74,0.07);
}
.pos-cat-pill.active {
  background: var(--brass);
  border-color: var(--brass);
  color: #fff;
}

/* SCROLLABLE PRODUCT AREA */
.pos-product-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 20px 22px;
  overscroll-behavior: contain;
}

.pos-product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
  gap: 14px;
}

.pos-product-card {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--component-bg);
  box-shadow: var(--shadow-xs);
  cursor: pointer;
  transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
}
.pos-product-card:hover {
  transform: translateY(-3px);
  border-color: var(--brass);
  box-shadow: var(--shadow-md);
}

.pos-product-image {
  height: 110px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #ebe1d0, #c5ad80);
}
.pos-product-image img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
}
.pos-product-fallback {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; color: rgba(255,255,255,.9);
}
.pos-product-image.has-image .pos-product-fallback { display: none; }

.pos-product-copy {
  padding: 11px 13px 12px;
  display: flex; flex-direction: column;
}
.pos-product-card .n {
  font-weight: 700; font-size: .85rem; line-height: 1.3;
}
.pos-product-card .cat {
  font-size: .68rem; color: var(--ink-muted);
  margin-top: 3px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.pos-product-card .product-foot {
  display: flex; align-items: flex-end;
  justify-content: space-between; gap: 8px;
  margin-top: 10px;
}
.pos-product-card .p {
  font-family: 'Space Mono', monospace;
  color: var(--brass-dark); font-weight: 700; font-size: .88rem;
}
.pos-add-mark {
  width: 30px; height: 30px;
  border: 0; border-radius: 8px;
  background: var(--brass); color: #fff;
  font-size: 1.1rem; font-weight: 700;
  pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.14s;
}
.pos-product-card:hover .pos-add-mark { background: var(--brass-dark); }

.addon-flag {
  display: inline-block; margin-left: 6px;
  padding: 2px 6px; border-radius: 20px;
  font-family: 'Space Mono', monospace;
  font-size: 0.52rem; font-weight: 700; text-transform: uppercase;
  background: rgba(163,132,74,0.14); color: var(--brass-dark);
  vertical-align: middle;
}

/* ================================================================
   RIGHT PANEL — Orders cart
   ================================================================ */
.pos-right {
  display: flex;
  flex-direction: column;
  background: var(--component-bg);
  overflow: hidden;
}

/* Orders Header */
.pos-orders-head {
  flex-shrink: 0;
  display: flex; align-items: center;
  justify-content: space-between; gap: 10px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(to bottom, #fdfaf5, #fff);
}
.pos-orders-head h3 {
  margin: 0;
  font-family: 'Archivo', sans-serif;
  text-transform: uppercase;
  font-size: 0.95rem;
  letter-spacing: 0.03em;
}
.pos-orders-head select {
  padding: 7px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bone);
  font-family: 'Inter', sans-serif;
  font-size: 0.8rem;
  color: var(--ink);
  cursor: pointer;
}

/* Order table header */
.pos-order-thead {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: 0;
  padding: 9px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--stone);
}
.pos-order-thead span {
  font-family: 'Space Mono', monospace;
  font-size: 0.58rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-muted);
}
.pos-order-thead span:nth-child(2),
.pos-order-thead span:nth-child(3),
.pos-order-thead span:nth-child(4) { text-align: right; }

/* Cart items — scrollable */
.pos-cart-scroll {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.pos-empty-orders {
  padding: 50px 20px;
  text-align: center;
  color: var(--ink-muted);
  font-size: 0.85rem;
}
.pos-empty-orders svg {
  display: block; margin: 0 auto 12px;
  opacity: 0.25;
}

/* Cart rows */
.pos-cart-row {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: 0;
  align-items: start;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  transition: background 0.12s;
}
.pos-cart-row:hover { background: #faf7f2; }
.pos-cart-row:last-child { border-bottom: none; }

.pos-cart-row .item-name { font-weight: 600; font-size: 0.84rem; line-height: 1.3; }
.pos-cart-row .item-notes {
  display: block; font-size: 0.71rem;
  opacity: 0.55; margin-top: 2px;
}
.pos-cart-row .addon-notes { color: var(--brass-dark); opacity: 0.85; }

.cart-row-actions { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
.edit-line-btn {
  border: 1px solid var(--line); background: var(--bone);
  border-radius: 4px; cursor: pointer;
  width: 20px; height: 20px; font-size: 0.72rem;
  line-height: 1; color: var(--brass-dark); flex-shrink: 0;
}
.edit-line-btn:hover { border-color: var(--brass); }

.pos-cart-row .unit-price {
  font-family: 'Space Mono', monospace;
  font-size: 0.78rem; color: var(--ink-muted);
  text-align: right; padding: 0 10px;
  white-space: nowrap;
  padding-top: 2px;
}

.qty-controls {
  display: flex; align-items: center; gap: 4px;
  padding: 0 8px;
}
.qty-controls button {
  width: 22px; height: 22px;
  border-radius: 4px; border: 1px solid var(--line);
  background: var(--component-bg);
  cursor: pointer; font-weight: 700;
  color: var(--ink); line-height: 1;
  transition: border-color 0.12s, background 0.12s;
}
.qty-controls button:hover { border-color: var(--brass); background: var(--stone); }
.qty-controls span {
  font-family: 'Space Mono', monospace;
  min-width: 20px; text-align: center; font-size: 0.82rem;
}

.pos-cart-row .line-total {
  font-family: 'Space Mono', monospace;
  font-size: 0.82rem; font-weight: 700;
  text-align: right; white-space: nowrap;
  padding-top: 2px;
}
.remove-line-btn {
  display: block; width: 100%;
  border: none; background: none;
  color: var(--danger); cursor: pointer;
  font-size: 0.75rem; text-align: right;
  padding: 2px 0;
  opacity: 0.6; transition: opacity 0.12s;
}
.remove-line-btn:hover { opacity: 1; }

/* Totals area */
.pos-summary {
  flex-shrink: 0;
  padding: 14px 20px;
  border-top: 2px solid var(--line);
  background: #fdfaf5;
}
.pos-summary .sum-row {
  display: flex; justify-content: space-between;
  align-items: center; padding: 5px 0;
  font-size: 0.84rem;
}
.pos-summary .sum-row span:first-child { color: var(--ink-muted); }
.pos-summary .sum-row input[type="number"] {
  width: 90px; text-align: right;
  padding: 4px 7px;
  border: 1px solid var(--line); border-radius: 5px;
  font-family: 'Space Mono', monospace; font-size: 0.82rem;
  background: var(--bone); color: var(--ink);
}
.pos-summary .sum-grand {
  display: flex; justify-content: space-between;
  align-items: center;
  font-weight: 700; font-size: 1rem;
  border-top: 2px solid var(--ink);
  margin-top: 8px; padding-top: 10px;
}

/* Actions */
.pos-actions {
  flex-shrink: 0;
  padding: 14px 20px;
  border-top: 1px solid var(--line);
  background: #fff;
}

.pos-payment-select {
  width: 100%; padding: 9px 12px;
  border: 1px solid var(--line); border-radius: 7px;
  margin-bottom: 10px;
  font-family: 'Inter', sans-serif; font-size: 0.84rem;
  background: var(--bone); color: var(--ink);
  cursor: pointer;
}

.cust-search-wrap { position: relative; margin-bottom: 8px; }
.cust-search-wrap input[type="text"] {
  width: 100%; padding: 9px 12px;
  border: 1px solid var(--line); border-radius: 7px;
  font-family: 'Inter', sans-serif; font-size: 0.84rem;
  background: var(--bone); color: var(--ink);
}
.cust-results {
  position: absolute; top: 100%; left: 0; right: 0; z-index: 20;
  background: var(--component-bg); border: 1px solid var(--line);
  border-radius: 6px; margin-top: 4px;
  max-height: 200px; overflow-y: auto;
  box-shadow: 0 6px 16px rgba(0,0,0,0.1);
}
.cust-result-row {
  padding: 10px 12px; cursor: pointer;
  font-size: 0.84rem; border-bottom: 1px solid var(--line);
}
.cust-result-row:last-child { border-bottom: none; }
.cust-result-row:hover { background: var(--stone); }
.cust-result-row .cn { font-weight: 700; }
.cust-result-row .ce { font-size: 0.73rem; opacity: 0.6; font-family: 'Space Mono', monospace; }
.cust-empty-hint { padding: 10px 12px; font-size: 0.8rem; opacity: 0.55; }
.cust-selected {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--stone); border: 1px solid var(--line); border-radius: 6px;
  padding: 9px 12px; font-size: 0.84rem; margin-bottom: 8px;
}
.cust-selected .cn { font-weight: 700; }
.cust-selected .ce { font-size: 0.71rem; opacity: 0.6; font-family: 'Space Mono', monospace; }
.cust-selected button {
  border: none; background: none; color: var(--brass-dark);
  font-size: 0.70rem; text-transform: uppercase;
  font-family: 'Space Mono', monospace; cursor: pointer; font-weight: 700;
}

.pos-hint {
  font-size: 0.70rem; color: var(--ink-muted);
  margin: 4px 0 10px;
}

.pos-actions-row {
  display: flex; gap: 10px; margin-top: 4px;
}
.pos-actions-row button { flex: 1; }

/* ================================================================
   CUSTOMIZE MODAL
   ================================================================ */
.cust-qty-row {
  display: flex; align-items: center;
  justify-content: space-between; margin-bottom: 16px;
}
.cust-qty-row label {
  font-family: 'Space Mono', monospace;
  font-size: 0.66rem; text-transform: uppercase; opacity: 0.55;
}
.cust-qty-row .qty-controls button { width: 30px; height: 30px; font-size: 1rem; }

.cust-addon-section { margin-bottom: 16px; }
.cust-addon-section > label {
  font-family: 'Space Mono', monospace;
  font-size: 0.66rem; text-transform: uppercase;
  opacity: 0.55; display: block; margin-bottom: 6px;
}
.cust-addon-list { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.cust-addon-row {
  display: grid; grid-template-columns: 1fr auto auto;
  gap: 12px; align-items: center;
  padding: 10px 14px; border-bottom: 1px solid var(--line);
  transition: background .12s;
}
.cust-addon-row:last-child { border-bottom: none; }
.cust-addon-row.is-selected { background: rgba(163,132,74,0.06); }
.cust-addon-row.is-disabled { opacity: 0.5; }
.cust-addon-check { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.cust-addon-check input { width: 16px; height: 16px; accent-color: var(--brass-dark); flex-shrink: 0; }
.cust-addon-check .cn { font-size: 0.86rem; font-weight: 600; }
.cust-addon-check .cs { font-size: 0.72rem; opacity: 0.55; margin-top: 1px; }
.cust-addon-row .cp { font-family: 'Space Mono', monospace; font-size: 0.8rem; font-weight: 700; color: var(--brass-dark); }
.cust-addon-row .qty-controls button { width: 22px; height: 22px; }

.modal-box.cust-modal { max-width: 520px; width: 100%; }
.cust-totals {
  background: var(--stone); border: 1px solid var(--line);
  border-radius: 8px; padding: 12px 14px; margin: 16px 0;
}
.cust-totals .row {
  display: flex; justify-content: space-between;
  padding: 4px 0; font-size: 0.84rem;
}
.cust-totals .row.grand {
  font-weight: 700; border-top: 2px solid var(--ink);
  margin-top: 6px; padding-top: 10px; font-size: 0.95rem;
}

/* ================================================================
   RESPONSIVE — stack on narrow screens
   ================================================================ */
@media (max-width: 900px) {
  .pos-workspace {
    grid-template-columns: 1fr;
    height: auto;
    overflow: visible;
  }
  .pos-left {
    border-right: none;
    border-bottom: 1px solid var(--line);
  }
  .pos-product-scroll { overflow: visible; max-height: none; }
  .pos-right { overflow: visible; }
  .pos-cart-scroll { overflow: visible; max-height: none; }
  .admin-body { overflow: auto; }
  .admin-section { overflow: visible; }
}

@media (max-width: 480px) {
  .pos-product-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .pos-actions-row { flex-direction: column; }
}

</style>
</head>
<body>

<div id="adminShell"></div>

<script type="module">
  import { renderAdminShell, showAlert } from "./admin-shell.js";
  import { adminFetch, peso, escapeHtml } from "./admin-api.js";

  const session = renderAdminShell({ active: 'pos', title: 'Point of Sale' });
  if (session) init();

  let menuItems = [];
  let addons = [];
  let categories = [];
  // cart line: { uniqueId, menu_id, name, price, qty, notes, add_ons: [{ addon_id, name, price, qty }] }
  let cart = [];
  let searchTerm = '';
  let activeCategoryId = 'all';
  let selectedCustomer = null; // { id, name, email }
  let custSearchDebounce = null;

  // Customize modal state.
  let customize = null; // { menu_id, name, base_price, qty, notes, selected: Map(addon_id -> qty) }
  let editingUniqueId = null;

  function init() {
    const content = document.getElementById('adminContent');
    content.innerHTML = `
      <div class="pos-workspace">

        <!-- ============ LEFT: Product Area ============ -->
        <div class="pos-left">
          <div class="pos-left-toolbar">
            <div class="pos-search-row">
              <input type="text" id="posSearch" placeholder="Search by product name…">
            </div>
            <div class="pos-cat-pills" id="catPillsWrap">
              <button class="pos-cat-pill active" data-cat="all">All</button>
            </div>
          </div>
          <div class="pos-product-scroll" id="posListWrap">
            <div class="admin-loading">Loading menu…</div>
          </div>
        </div>

        <!-- ============ RIGHT: Orders Panel ============ -->
        <div class="pos-right">

          <!-- Header row -->
          <div class="pos-orders-head">
            <h3>Orders</h3>
            <select id="posOrderType">
              <option value="dine_in">Dine In</option>
              <option value="pickup">Takeout</option>
            </select>
          </div>

          <!-- Table head -->
          <div class="pos-order-thead">
            <span>Description</span>
            <span>Unit Price</span>
            <span>Qty</span>
            <span>Total</span>
          </div>

          <!-- Scrollable cart list -->
          <div class="pos-cart-scroll" id="cartScrollArea">
            <div id="cartEmptyState" class="pos-empty-orders">
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
              </svg>
              Select from the menu to add orders
            </div>
            <div id="cartRowsWrap"></div>
          </div>

          <!-- Totals -->
          <div class="pos-summary">
            <div class="sum-row"><span>Total Amount</span><span id="sumTotal">₱0.00</span></div>
            <div class="sum-row">
              <span>Delivery Fee</span>
              <input type="number" id="deliveryFeeInput" value="0" min="0" step="0.01">
            </div>
            <div class="sum-grand">
              <span>Grand Total</span>
              <span id="sumGrand">₱0.00</span>
            </div>
          </div>

          <!-- Payment + Customer + Buttons -->
          <div class="pos-actions">
            <select id="posPayment" class="pos-payment-select">
              <option value="cash">Payment Method — Cash</option>
              <option value="card">Payment Method — Card</option>
              <option value="gcash">Payment Method — GCash</option>
              <option value="other">Payment Method — Other</option>
            </select>

            <div id="custSelectedWrap" style="display:none;"></div>
            <div id="custSearchWrap" class="cust-search-wrap">
              <input type="text" id="custSearchInput" placeholder="Optional: search customer by name, email, or phone…" autocomplete="off">
              <div class="cust-results" id="custResults" style="display:none;"></div>
            </div>
            <p class="pos-hint">No customer? Orders logged under "Walk-in Customer" automatically.</p>

            <div class="pos-actions-row">
              <button class="btn btn-outline" id="clearOrderBtn">Clear</button>
              <button class="btn" id="submitOrderBtn">Place Order</button>
            </div>
            <div class="admin-error" id="posError" style="display:none; margin-top:10px;"></div>
          </div>

        </div>
      </div>

      <!-- ============ CUSTOMIZE MODAL ============ -->
      <div class="modal-backdrop" id="customizeModal">
        <div class="modal-box cust-modal">
          <h3 id="customizeModalTitle">Customize Item</h3>

          <div class="cust-qty-row">
            <label>Quantity</label>
            <div class="qty-controls">
              <button id="custQtyMinus">−</button>
              <span id="custQty" style="min-width:28px; font-size:1rem;">1</span>
              <button id="custQtyPlus">+</button>
            </div>
          </div>

          <div class="cust-addon-section" id="custAddonsWrap">
            <label>Add-Ons</label>
            <div class="cust-addon-list" id="custAddonList"></div>
          </div>

          <div class="form-field">
            <label>Special Instructions (optional)</label>
            <textarea id="customizeNotes" placeholder="e.g. No onions, extra spicy, less ice..."></textarea>
          </div>

          <div class="cust-totals">
            <div class="row"><span>Item Total</span><span id="custItemTotal">₱0.00</span></div>
            <div class="row"><span>Add-Ons Total</span><span id="custAddonsTotal">₱0.00</span></div>
            <div class="row grand"><span>Line Total</span><span id="custLineTotal">₱0.00</span></div>
          </div>

          <div class="modal-close-row">
            <button class="btn btn-outline" id="customizeCancelBtn">Cancel</button>
            <button class="btn" id="customizeAddBtn">Add to Order</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('posSearch').addEventListener('input', (e) => { searchTerm = e.target.value.toLowerCase(); renderList(); });
    document.getElementById('deliveryFeeInput').addEventListener('input', renderCart);
    document.getElementById('clearOrderBtn').addEventListener('click', clearOrder);
    document.getElementById('submitOrderBtn').addEventListener('click', submitOrder);
    document.getElementById('customizeCancelBtn').addEventListener('click', () => { resetCustomize(); toggleModal(false); });
    document.getElementById('customizeAddBtn').addEventListener('click', confirmAddToCart);
    document.getElementById('custQtyMinus').addEventListener('click', () => changeCustomizeQty(-1));
    document.getElementById('custQtyPlus').addEventListener('click', () => changeCustomizeQty(1));
    document.getElementById('customizeNotes').addEventListener('input', updateCustomizeTotals);
    document.getElementById('custSearchInput').addEventListener('input', onCustomerSearchInput);
    document.addEventListener('click', (e) => {
      const wrap = document.getElementById('custSearchWrap');
      if (wrap && !wrap.contains(e.target)) document.getElementById('custResults').style.display = 'none';
    });

    loadCategories();
    loadMenu();
    loadAddons();
  }

  /* ================================================================
     DATA LOADING
     ================================================================ */
  function toggleModal(show) { document.getElementById('customizeModal').classList.toggle('active', show); }

  async function loadCategories() {
    try {
      const res = await adminFetch('/api/admin/products/categories');
      const data = await res.json();
      if (!res.ok) return;
      categories = data.data || [];
      const pillsWrap = document.getElementById('catPillsWrap');
      pillsWrap.innerHTML =
        `<button class="pos-cat-pill active" data-cat="all">All</button>` +
        categories.map(c => `<button class="pos-cat-pill" data-cat="${c.id}">${escapeHtml(c.name)}</button>`).join('');

      pillsWrap.querySelectorAll('.pos-cat-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          pillsWrap.querySelectorAll('.pos-cat-pill').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeCategoryId = btn.dataset.cat;
          renderList();
        });
      });
    } catch { /* non-fatal */ }
  }

  async function loadMenu() {
    try {
      const res = await adminFetch('/api/admin/products/menuitems');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not load menu.');
      menuItems = (data.items || []).filter(i => i.status === 'available');
      renderList();
    } catch (err) {
      document.getElementById('posListWrap').innerHTML = `<div class="admin-error">⚠ ${err.message}</div>`;
    }
  }

  async function loadAddons() {
    try {
      const res = await adminFetch('/api/admin/products/addons');
      const data = await res.json();
      if (!res.ok) return;
      addons = data.addons || [];
      renderList(); // refresh "add-ons available" badges
    } catch { /* non-fatal */ }
  }

  function getAddonsForProduct(menuId) {
    return addons.filter(a => {
      if (!a.products || a.products.length === 0) return true;
      return a.products.some(p => String(p.menu_id) === String(menuId));
    });
  }

  /* ================================================================
     MENU LIST
     ================================================================ */
  function renderList() {
    let visible = menuItems;
    if (activeCategoryId !== 'all') visible = visible.filter(i => String(i.category_id) === String(activeCategoryId));
    if (searchTerm) visible = visible.filter(i => i.name.toLowerCase().includes(searchTerm));

    const wrap = document.getElementById('posListWrap');
    if (visible.length === 0) {
      wrap.innerHTML = `<div class="pos-empty-orders">No items match.</div>`;
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'pos-product-grid';
    grid.innerHTML = visible.map(i => {
      const hasAddons = getAddonsForProduct(i.id).length > 0;
      return `
        <div class="pos-product-card" data-id="${i.id}" data-name="${escapeHtml(i.name)}" data-price="${i.price}">
          <div class="pos-product-image${i.image_url ? ' has-image' : ''}">
            ${i.image_url ? `<img src="${escapeHtml(i.image_url)}" alt="${escapeHtml(i.name)}" loading="lazy" onerror="this.remove(); this.parentElement.classList.remove('has-image');">` : ''}
            <span class="pos-product-fallback">🍽</span>
          </div>
          <div class="pos-product-copy">
            <div class="n">${escapeHtml(i.name)}${hasAddons ? '<span class="addon-flag">Add-ons</span>' : ''}</div>
            <div class="cat">${escapeHtml(i.category_name || 'Menu item')}</div>
            <div class="product-foot"><div class="p">${peso(i.price)}</div><span class="pos-add-mark">+</span></div>
          </div>
        </div>
      `;
    }).join('');

    wrap.innerHTML = '';
    wrap.appendChild(grid);

    grid.querySelectorAll('.pos-product-card').forEach(el => {
      el.addEventListener('click', () => openCustomizeModal(el.dataset.id, el.dataset.name, Number(el.dataset.price)));
    });
  }

  /* ================================================================
     CUSTOMIZE MODAL
     ================================================================ */
  function openCustomizeModal(menuId, name, price, line = null) {
    editingUniqueId = line ? line.uniqueId : null;
    customize = {
      menu_id: menuId,
      name,
      base_price: Number(price),
      qty: line ? line.qty : 1,
      notes: line ? (line.notes || '') : '',
      selected: new Map(),
    };
    if (line) {
      (line.add_ons || []).forEach(a => customize.selected.set(String(a.addon_id), a.qty));
    }

    document.getElementById('customizeModalTitle').textContent = `Customize — ${name}`;
    document.getElementById('customizeNotes').value = customize.notes;
    document.getElementById('customizeAddBtn').textContent = line ? 'Update Item' : 'Add to Order';
    renderAddonList();
    updateCustomizeTotals();
    toggleModal(true);
  }

  function renderAddonList() {
    const wrap = document.getElementById('custAddonsWrap');
    const list = document.getElementById('custAddonList');
    const applicable = getAddonsForProduct(customize.menu_id);

    if (!applicable.length) { wrap.style.display = 'none'; return; }
    wrap.style.display = 'block';

    list.innerHTML = applicable.map(a => {
      const selected = customize.selected.has(String(a.id));
      const disabled = a.status !== 'available';
      const qty = customize.selected.get(String(a.id)) || 1;
      return `
        <div class="cust-addon-row ${disabled ? 'is-disabled' : ''} ${selected ? 'is-selected' : ''}">
          <label class="cust-addon-check">
            <input type="checkbox" data-aid="${a.id}" ${disabled ? 'disabled' : ''} ${selected ? 'checked' : ''}>
            <div>
              <div class="cn">${escapeHtml(a.name)}</div>
              <div class="cs">${disabled ? 'Unavailable / out of stock' : escapeHtml(a.category || 'Add-On')}</div>
            </div>
          </label>
          <div class="cp">${peso(a.price)}</div>
          <div class="qty-controls addon-qty" ${selected && !disabled ? '' : 'style="display:none"'}>
            <button data-aid="${a.id}" data-d="-1">−</button>
            <span>${qty}</span>
            <button data-aid="${a.id}" data-d="1">+</button>
          </div>
        </div>`;
    }).join('');

    list.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', () => {
        if (cb.checked) customize.selected.set(cb.dataset.aid, 1);
        else customize.selected.delete(cb.dataset.aid);
        renderAddonList();
        updateCustomizeTotals();
      });
    });
    list.querySelectorAll('.addon-qty button').forEach(btn => {
      btn.addEventListener('click', () => {
        const aid = btn.dataset.aid;
        const cur = customize.selected.get(aid) || 1;
        const next = Math.max(1, cur + Number(btn.dataset.d));
        customize.selected.set(aid, next);
        btn.parentElement.querySelector('span').textContent = next;
        updateCustomizeTotals();
      });
    });
  }

  function changeCustomizeQty(delta) {
    if (!customize) return;
    customize.qty = Math.max(1, customize.qty + delta);
    document.getElementById('custQty').textContent = customize.qty;
    updateCustomizeTotals();
  }

  function updateCustomizeTotals() {
    if (!customize) return;
    const itemTotal = customize.base_price * customize.qty;
    let addonsTotal = 0;
    customize.selected.forEach((q, id) => {
      const a = addons.find(x => String(x.id) === String(id));
      if (a) addonsTotal += Number(a.price) * q;
    });
    document.getElementById('custItemTotal').textContent = peso(itemTotal);
    document.getElementById('custAddonsTotal').textContent = peso(addonsTotal);
    document.getElementById('custLineTotal').textContent = peso(itemTotal + addonsTotal);
  }

  function resetCustomize() {
    customize = null;
    editingUniqueId = null;
  }

  /* ================================================================
     CART
     ================================================================ */
  function cartLineKey(c) {
    const addonKey = (c.add_ons || []).slice()
      .sort((x, y) => x.addon_id - y.addon_id)
      .map(a => `${a.addon_id}x${a.qty}`).join(',');
    return `${c.menu_id}|${addonKey}|${c.notes || ''}`;
  }

  function lineTotal(c) {
    const adds = (c.add_ons || []).reduce((s, a) => s + Number(a.price) * Number(a.qty), 0);
    return Number(c.price) * Number(c.qty) + adds;
  }

  function confirmAddToCart() {
    if (!customize) return;
    const notes = document.getElementById('customizeNotes').value.trim() || null;
    const addOns = [...customize.selected.entries()].map(([id, q]) => {
      const a = addons.find(x => String(x.id) === String(id));
      return { addon_id: Number(id), name: a ? a.name : 'Add-On', price: a ? Number(a.price) : 0, qty: q };
    });

    const line = {
      menu_id: customize.menu_id,
      name: customize.name,
      price: customize.base_price,
      qty: customize.qty,
      notes,
      add_ons: addOns,
    };

    if (editingUniqueId) {
      const idx = cart.findIndex(c => c.uniqueId === editingUniqueId);
      if (idx >= 0) cart[idx] = { ...line, uniqueId: editingUniqueId };
    } else {
      const key = cartLineKey(line);
      const existing = cart.find(c => cartLineKey(c) === key);
      if (existing) existing.qty += line.qty;
      else cart.push({ ...line, uniqueId: Date.now() + Math.random() });
    }

    resetCustomize();
    toggleModal(false);
    renderCart();
  }

  function changeQty(uniqueId, delta) {
    const entry = cart.find(c => c.uniqueId == uniqueId);
    if (!entry) return;
    entry.qty += delta;
    if (entry.qty <= 0) cart = cart.filter(c => c.uniqueId != uniqueId);
    renderCart();
  }

  function removeLine(uniqueId) {
    cart = cart.filter(c => c.uniqueId != uniqueId);
    renderCart();
  }

  function clearOrder() {
    cart = [];
    clearSelectedCustomer();
    document.getElementById('deliveryFeeInput').value = '0';
    document.getElementById('posPayment').value = 'cash';
    renderCart();
  }

  function renderCart() {
    const rowsWrap = document.getElementById('cartRowsWrap');
    const emptyState = document.getElementById('cartEmptyState');

    if (cart.length === 0) {
      rowsWrap.innerHTML = '';
      emptyState.style.display = 'block';
    } else {
      emptyState.style.display = 'none';
      rowsWrap.innerHTML = cart.map(c => `
        <div class="pos-cart-row">
          <div>
            <div style="display:flex; align-items:center; gap:5px; flex-wrap:wrap;">
              <span class="item-name">${escapeHtml(c.name)}</span>
              <button class="edit-line-btn" data-id="${c.uniqueId}" title="Customize">✎</button>
            </div>
            ${c.notes ? `<span class="item-notes">${escapeHtml(c.notes)}</span>` : ''}
            ${(c.add_ons || []).length ? `
              <span class="item-notes addon-notes">+ ${c.add_ons.map(a => `${escapeHtml(a.name)} ×${a.qty} (${peso(a.price * a.qty)})`).join(', ')}</span>
            ` : ''}
            <button class="remove-line-btn" data-id="${c.uniqueId}">✕ Remove</button>
          </div>
          <div class="unit-price">${peso(c.price)}</div>
          <div class="qty-controls" style="padding: 0 6px;">
            <button data-id="${c.uniqueId}" data-delta="-1" class="qty-btn">−</button>
            <span>${c.qty}</span>
            <button data-id="${c.uniqueId}" data-delta="1" class="qty-btn">+</button>
          </div>
          <div class="line-total">${peso(lineTotal(c))}</div>
        </div>
      `).join('');

      rowsWrap.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', () => changeQty(btn.dataset.id, Number(btn.dataset.delta)));
      });
      rowsWrap.querySelectorAll('.remove-line-btn').forEach(btn => {
        btn.addEventListener('click', () => removeLine(btn.dataset.id));
      });
      rowsWrap.querySelectorAll('.edit-line-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const line = cart.find(c => c.uniqueId == btn.dataset.id);
          if (line) openCustomizeModal(line.menu_id, line.name, line.price, line);
        });
      });
    }

    const totalAmount = cart.reduce((sum, c) => sum + lineTotal(c), 0);
    const deliveryFee = Number(document.getElementById('deliveryFeeInput').value) || 0;
    document.getElementById('sumTotal').textContent = peso(totalAmount);
    document.getElementById('sumGrand').textContent = peso(totalAmount + deliveryFee);
  }

  /* ================================================================
     SUBMIT ORDER
     ================================================================ */
  async function submitOrder() {
    const errEl = document.getElementById('posError');
    errEl.style.display = 'none';

    const order_type = document.getElementById('posOrderType').value;
    const delivery_fee = Number(document.getElementById('deliveryFeeInput').value) || 0;
    const payment_method = document.getElementById('posPayment').value;

    if (cart.length === 0) { errEl.textContent = 'Cart is empty.'; errEl.style.display = 'block'; return; }

    const submitBtn = document.getElementById('submitOrderBtn');
    submitBtn.disabled = true; submitBtn.textContent = 'Placing…';

    try {
      const res = await adminFetch('/api/admin/sales/pos/orders', {
        method: 'POST',
        body: JSON.stringify({
          customer_id: selectedCustomer ? Number(selectedCustomer.id) : null,
          order_type,
          delivery_fee,
          payment_method,
          cart: cart.map(c => ({
            menu_id: c.menu_id,
            quantity: c.qty,
            notes: c.notes,
            add_ons: (c.add_ons || []).map(a => ({ addon_id: a.addon_id, quantity: a.qty })),
          })),
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not place order.');

      showAlert(`Order #${data.order.id} placed successfully (${peso(data.order.total_amount)}).`, { title: 'Order placed' });
      clearOrder();
      loadMenu();
      loadAddons();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    } finally {
      submitBtn.disabled = false; submitBtn.textContent = 'Place Order';
    }
  }

  /* ================================================================
     CUSTOMER SEARCH (walk-ins optional)
     ================================================================ */
  function onCustomerSearchInput(e) {
    const q = e.target.value.trim();
    clearTimeout(custSearchDebounce);
    if (q.length < 2) {
      document.getElementById('custResults').style.display = 'none';
      return;
    }
    custSearchDebounce = setTimeout(() => searchCustomers(q), 250);
  }

  async function searchCustomers(q) {
    const resultsEl = document.getElementById('custResults');
    try {
      const res = await adminFetch(`/api/admin/customers/search?q=${encodeURIComponent(q)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Search failed.');

      const customers = data.customers || [];
      resultsEl.innerHTML = customers.length
        ? customers.map(c => `
            <div class="cust-result-row" data-id="${c.id}" data-name="${escapeHtml(c.name)}" data-email="${escapeHtml(c.email || '')}">
              <div class="cn">${escapeHtml(c.name)}</div>
              <div class="ce">${escapeHtml(c.email || c.phone || '')}</div>
            </div>`).join('')
        : `<div class="cust-empty-hint">No matching customers.</div>`;
      resultsEl.style.display = 'block';

      resultsEl.querySelectorAll('.cust-result-row[data-id]').forEach(row => {
        row.addEventListener('click', () => selectCustomer(row.dataset.id, row.dataset.name, row.dataset.email));
      });
    } catch (err) {
      resultsEl.innerHTML = `<div class="cust-empty-hint">⚠ ${err.message}</div>`;
      resultsEl.style.display = 'block';
    }
  }

  function selectCustomer(id, name, email) {
    selectedCustomer = { id, name, email };
    document.getElementById('custResults').style.display = 'none';
    document.getElementById('custSearchInput').value = '';
    document.getElementById('custSearchWrap').style.display = 'none';

    const selectedWrap = document.getElementById('custSelectedWrap');
    selectedWrap.style.display = 'block';
    selectedWrap.innerHTML = `
      <div class="cust-selected">
        <div><div class="cn">${escapeHtml(name)}</div><div class="ce">${escapeHtml(email || '')}</div></div>
        <button id="custChangeBtn">Change</button>
      </div>
    `;
    document.getElementById('custChangeBtn').addEventListener('click', clearSelectedCustomer);
  }

  function clearSelectedCustomer() {
    selectedCustomer = null;
    document.getElementById('custSelectedWrap').style.display = 'none';
    document.getElementById('custSelectedWrap').innerHTML = '';
    document.getElementById('custSearchWrap').style.display = 'block';
  }
</script>
</body>
