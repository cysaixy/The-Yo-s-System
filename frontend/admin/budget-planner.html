<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Planner — The~Yo's Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-shell.css?v=3">
<style>
  .budget-bar-track { background: var(--stone); border-radius: 20px; height: 8px; overflow: hidden; width: 140px; }
  .budget-bar-fill { height: 100%; background: var(--brass); }
  .budget-bar-fill.over { background: var(--danger); }
</style>
</head>
<body>

<div id="adminShell"></div>

<script type="module">
  import { renderAdminShell } from "./admin-shell.js";
  import { adminFetch, peso, escapeHtml } from "./admin-api.js";

  const session = renderAdminShell({ active: 'budget', title: 'Budget Planner' });
  if (session) init();

  function currentMonthValue() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }

  function init() {
    const content = document.getElementById('adminContent');
    content.innerHTML = `
      <div class="filter-bar">
        <div><label>Month</label>
          <input type="month" id="filterMonth" value="${currentMonthValue()}">
        </div>
      </div>
      <div class="admin-panel">
        <div class="admin-panel-head">
          <h3>Monthly Budgets</h3>
          <button class="btn small" id="newBudgetBtn">+ New Budget Line</button>
        </div>
        <div class="admin-panel-body" style="padding:0;" id="budgetWrap"><div class="admin-loading">Loading…</div></div>
      </div>

      <div class="modal-backdrop" id="budgetModal">
        <div class="modal-box">
          <h3>New Budget Line</h3>
          <div class="form-grid">
            <div class="form-field" style="grid-column:1/-1;">
              <label>Category</label><input type="text" id="bCategory" placeholder="e.g. Ingredients, Utilities, Marketing">
            </div>
            <div class="form-field">
              <label>Month</label><input type="month" id="bMonth" value="${currentMonthValue()}">
            </div>
            <div class="form-field">
              <label>Planned Amount (₱)</label><input type="number" step="0.01" id="bAmount">
            </div>
            <div class="form-field" style="grid-column:1/-1;">
              <label>Notes (optional)</label><textarea id="bNotes"></textarea>
            </div>
          </div>
          <div class="modal-close-row">
            <button class="btn btn-outline" id="bCancelBtn">Cancel</button>
            <button class="btn" id="bSaveBtn">Save Budget</button>
          </div>
          <div class="admin-error" id="bError" style="display:none; padding:10px 0 0; text-align:left;"></div>
        </div>
      </div>
    `;

    document.getElementById('filterMonth').addEventListener('change', load);
    document.getElementById('newBudgetBtn').addEventListener('click', openModal);
    document.getElementById('bCancelBtn').addEventListener('click', () => toggleModal(false));
    document.getElementById('bSaveBtn').addEventListener('click', save);

    load();
  }

  function toggleModal(show) { document.getElementById('budgetModal').classList.toggle('active', show); }

  async function load() {
    const month = document.getElementById('filterMonth').value; // "YYYY-MM"
    const wrap = document.getElementById('budgetWrap');
    wrap.innerHTML = `<div class="admin-loading">Loading…</div>`;
    try {
      const res = await adminFetch(`/api/admin/budgets?month=${month}-01`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not load budgets.');
      render(data.budgets || []);
    } catch (err) {
      wrap.innerHTML = `<div class="admin-error">⚠ ${err.message}</div>`;
    }
  }

  function render(budgets) {
    const wrap = document.getElementById('budgetWrap');
    if (budgets.length === 0) {
      wrap.innerHTML = `<div class="panel-empty" style="padding:20px;">No budget lines set for this month yet.</div>`;
      return;
    }
    wrap.innerHTML = `
      <table class="admin-table">
        <thead><tr><th>Category</th><th>Planned</th><th>Actual Spend</th><th>Remaining</th><th>Status</th><th>Progress</th><th>Notes</th><th>Actions</th></tr></thead>
        <tbody>
          ${budgets.map(b => {
            const pct = b.planned_amount > 0 ? Math.min(100, (b.actual_spent / b.planned_amount) * 100) : 0;
            const over = Number(b.actual_spent) > Number(b.planned_amount);
            const nearLimit = !over && Number(b.planned_amount) > 0 && Number(b.actual_spent) >= Number(b.planned_amount) * 0.8;
            const remaining = Number(b.planned_amount) - Number(b.actual_spent);
            const status = over
              ? { label: 'Over budget', className: 'pill-danger' }
              : nearLimit
                ? { label: 'Nearly used', className: 'pill-warning' }
                : { label: 'Under budget', className: 'pill-success' };
            return `<tr>
              <td>${escapeHtml(b.category)}</td>
              <td>${peso(b.planned_amount)}</td>
              <td style="color:${over ? 'var(--danger)' : 'var(--ink)'}; font-weight:${over ? '700' : '400'};">${peso(b.actual_spent)}</td>
              <td style="color:${over ? 'var(--danger)' : 'var(--success)'}; font-weight:700;">${over ? '−' : ''}${peso(Math.abs(remaining))}</td>
              <td><span class="pill ${status.className}">${status.label}</span></td>
              <td><div class="budget-bar-track"><div class="budget-bar-fill${over ? ' over' : ''}" style="width:${pct}%;"></div></div></td>
              <td style="font-size:0.8rem; opacity:0.75; max-width:180px;">${escapeHtml(b.notes || '—')}</td>
              <td><div class="row-actions"><button class="danger del-budget-btn" data-id="${b.id}">Delete</button></div></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    `;
    wrap.querySelectorAll('.del-budget-btn').forEach(btn => btn.addEventListener('click', () => remove(btn.dataset.id)));
  }

  function openModal() {
    document.getElementById('bCategory').value = '';
    document.getElementById('bMonth').value = document.getElementById('filterMonth').value;
    document.getElementById('bAmount').value = '';
    document.getElementById('bNotes').value = '';
    document.getElementById('bError').style.display = 'none';
    toggleModal(true);
  }

  async function save() {
    const errEl = document.getElementById('bError');
    const payload = {
      category: document.getElementById('bCategory').value.trim(),
      budget_month: `${document.getElementById('bMonth').value}-01`,
      planned_amount: Number(document.getElementById('bAmount').value),
      notes: document.getElementById('bNotes').value.trim() || null,
    };

    if (!payload.category || payload.planned_amount < 0 || isNaN(payload.planned_amount)) {
      errEl.textContent = 'Enter a category and a valid planned amount.';
      errEl.style.display = 'block';
      return;
    }

    try {
      const res = await adminFetch('/api/admin/budgets', { method: 'POST', body: JSON.stringify(payload) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not save budget.');
      toggleModal(false);
      load();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    }
  }

  async function remove(id) {
    if (!confirm('Delete this budget line?')) return;
    try {
      const res = await adminFetch(`/api/admin/budgets/${id}`, { method: 'DELETE' });
      if (res.status !== 204) {
        const data = await res.json();
        throw new Error(data.error || 'Could not delete budget.');
      }
      load();
    } catch (err) {
      alert(err.message);
    }
  }
</script>
</body>
</html>
