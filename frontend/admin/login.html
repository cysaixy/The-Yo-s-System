<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login — The~Yo's Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-shell.css">
<style>
  :root {
    --login-card-w: 400px;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  .login-wrap {
    width: 100%;
    max-width: var(--login-card-w);
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* ---- Card ---- */
  .login-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 38px 36px 32px;
    box-shadow:
      0 4px 24px rgba(47,37,20,0.08),
      0 1px 4px rgba(47,37,20,0.04),
      0 0 0 1px rgba(255,255,255,0.6) inset;
  }

  /* ---- Brand ---- */
  .login-brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 30px;
  }
  .login-brand .brand-mark {
    width: 48px; height: 48px;
    border-radius: 14px;
    background: linear-gradient(140deg, #c9a86c 0%, #8a6d3a 100%);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Archivo', sans-serif;
    font-weight: 900; font-size: 1.1rem;
    flex-shrink: 0;
    box-shadow: 0 6px 18px rgba(138,109,58,0.32);
  }
  .login-brand-text h1 {
    font-family: 'Archivo', sans-serif;
    font-weight: 900; font-size: 1.25rem;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    margin: 0; color: var(--ink);
  }
  .login-brand-text span {
    display: block;
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    opacity: 0.45;
    text-transform: uppercase;
    letter-spacing: 0.10em;
    margin-top: 2px;
  }

  /* ---- Divider ---- */
  .login-divider {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 22px;
  }
  .login-divider::before,
  .login-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--line);
  }
  .login-divider span {
    font-family: 'Space Mono', monospace;
    font-size: 0.60rem; text-transform: uppercase;
    letter-spacing: 0.10em; color: var(--ink-muted); opacity: 0.7;
    white-space: nowrap;
  }

  /* ---- Fields ---- */
  .login-field { margin-bottom: 15px; }
  .login-field label {
    display: block;
    font-family: 'Space Mono', monospace;
    font-size: 0.63rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-muted);
    margin-bottom: 7px;
  }
  .login-field input {
    width: 100%; padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 9px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    background: var(--bone);
    color: var(--ink);
    transition: border-color 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
  }
  .login-field input:hover { border-color: var(--line-strong); }
  .login-field input:focus {
    outline: none;
    border-color: var(--brass);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(163,132,74,0.14);
  }

  /* ---- Password toggle ---- */
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 46px; }
  .password-toggle {
    position: absolute; top: 50%; right: 8px;
    transform: translateY(-50%);
    background: none; border: none; padding: 6px;
    cursor: pointer; color: var(--ink);
    opacity: 0.4; display: flex; align-items: center;
    justify-content: center; transition: opacity 0.15s ease;
    border-radius: 5px;
  }
  .password-toggle:hover { opacity: 0.85; }
  .password-toggle .eye-closed { display: none; }
  .password-toggle.shown .eye-open { display: none; }
  .password-toggle.shown .eye-closed { display: block; }

  /* ---- Submit button ---- */
  .login-submit {
    width: 100%;
    justify-content: center;
    padding: 12px 18px;
    border-radius: 9px;
    margin-top: 8px;
    font-size: 0.88rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  /* ---- Status message ---- */
  .login-status {
    margin-top: 13px;
    font-size: 0.80rem;
    text-align: center;
    font-family: 'Space Mono', monospace;
    min-height: 18px;
    color: var(--ink-muted);
  }
  .login-status.err {
    color: var(--danger);
    background: rgba(192,57,43,0.06);
    padding: 8px 12px;
    border-radius: 7px;
    border: 1px solid rgba(192,57,43,0.18);
  }
  .login-status.ok { color: var(--success); }

  /* ---- Expired session notice ---- */
  .login-expired-notice {
    display: none;
    align-items: center;
    gap: 10px;
    background: rgba(184,134,11,0.10);
    border: 1px solid rgba(184,134,11,0.28);
    border-radius: 9px;
    padding: 11px 14px;
    margin-bottom: 20px;
    font-size: 0.82rem;
    color: var(--warning);
    font-weight: 600;
  }
  .login-expired-notice.show { display: flex; }
  .login-expired-notice svg {
    width: 16px; height: 16px; flex-shrink: 0;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* ---- Footer branding ---- */
  .login-footer {
    text-align: center;
    margin-top: 18px;
    font-family: 'Space Mono', monospace;
    font-size: 0.60rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    opacity: 0.5;
  }

  @media (max-width: 480px) {
    .login-card { padding: 28px 22px 24px; border-radius: 14px; }
    :root { --login-card-w: 100%; }
  }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark">TY</div>
      <div class="login-brand-text">
        <h1>The~Yo's</h1>
        <span>Staff &amp; Admin Panel</span>
      </div>
    </div>

    <div class="login-expired-notice" id="expiredNotice">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      Your session expired. Please sign in again.
    </div>

    <div class="login-divider"><span>Sign in to continue</span></div>

    <form id="loginForm">
      <div class="login-field">
        <label for="staffEmail">Email address</label>
        <input id="staffEmail" type="email" required placeholder="staff@theyos.com" autocomplete="username">
      </div>
      <div class="login-field">
        <label for="staffPassword">Password</label>
        <div class="password-wrap">
          <input id="staffPassword" type="password" required placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="password-toggle" data-toggle-pw="staffPassword" aria-label="Show password">
            <svg class="eye-open" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn login-submit" id="loginBtn">Sign In</button>
      <div class="login-status" id="loginStatus"></div>
    </form>
  </div>

  <div class="login-footer">The~Yo's Restaurant &mdash; Staff Portal</div>
</div>

<script type="module">
  // Show the expired-session notice if redirected here with ?expired=1
  const params = new URLSearchParams(window.location.search);
  if (params.get('expired') === '1') {
    document.getElementById('expiredNotice').classList.add('show');
  }

  // Password visibility toggle
  document.querySelectorAll('[data-toggle-pw]').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.togglePw);
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.classList.toggle('shown', !showing);
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });
  });

  // Login form submission
  const form = document.getElementById('loginForm');
  const statusEl = document.getElementById('loginStatus');
  const loginBtn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusEl.textContent = '';
    statusEl.className = 'login-status';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in…';

    try {
      const res = await fetch('/api/staff/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('staffEmail').value.trim(),
          password: document.getElementById('staffPassword').value,
        }),
      });
      const data = await res.json();

      if (!res.ok) {
        statusEl.textContent = data.error || 'Invalid email or password.';
        statusEl.className = 'login-status err';
        return;
      }

      localStorage.setItem('staffToken', data.token);
      localStorage.setItem('staffInfo', JSON.stringify(data.staff));

      const redirect = params.get('redirect') || 'home.html';
      window.location.href = redirect;
    } catch (err) {
      statusEl.textContent = 'Connection error. Please try again.';
      statusEl.className = 'login-status err';
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
