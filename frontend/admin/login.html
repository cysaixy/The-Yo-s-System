<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login — The~Yo's Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-shell.css?v=7">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }

  /* the sign-in is a menu card: double brass frame on ivory */
  .login-card {
    width: 100%; max-width: 420px;
    background: #fffdf9;
    border: 1px solid var(--brass);
    border-radius: 6px;
    padding: 10px;
    box-shadow: var(--shadow-md);
  }
  .login-inner {
    border: 1px solid var(--brass-light);
    border-radius: 3px;
    padding: 40px 36px 34px;
  }
  .login-brand { text-align: center; margin-bottom: 26px; }
  .login-brand h1 {
    font-family: var(--font-display); font-weight: 600;
    font-size: 2.6rem; letter-spacing: -0.025em; line-height: 1; margin: 0;
  }
  .login-brand p { margin: 10px 0 0; font-size: 0.9rem; color: var(--ink-muted); }
  .login-rule { display: flex; align-items: center; gap: 12px; margin: 0 auto 26px; max-width: 200px; }
  .login-rule::before, .login-rule::after { content: ''; flex: 1; height: 1px; background: var(--brass-light); }
  .login-rule i { width: 7px; height: 7px; background: var(--brass); transform: rotate(45deg); }

  .login-field { margin-bottom: 16px; }
  .login-field label { display: block; font-size: 0.82rem; font-weight: 700; margin-bottom: 6px; }
  .login-field input {
    width: 100%; padding: 12px 14px;
    border: 1px solid var(--line-strong); border-radius: 8px;
    font-family: var(--font-body); font-size: 0.95rem;
    background: #fff; color: var(--ink);
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
  }
  .login-field input:hover { border-color: var(--brass-light); }
  .login-field input:focus { outline: none; border-color: var(--brass); box-shadow: 0 0 0 3px rgba(163,132,74,0.18); }

  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 46px; }
  .password-toggle {
    position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
    background: none; border: none; padding: 6px; cursor: pointer; color: var(--ink);
    opacity: 0.45; display: flex; align-items: center; justify-content: center; border-radius: 6px;
    transition: opacity var(--transition-fast);
  }
  .password-toggle:hover { opacity: 0.9; }
  .password-toggle .eye-closed { display: none; }
  .password-toggle.shown .eye-open { display: none; }
  .password-toggle.shown .eye-closed { display: block; }

  .login-submit { width: 100%; padding: 13px 18px; margin-top: 8px; font-size: 0.95rem; }

  .login-status { margin-top: 14px; font-size: 0.84rem; text-align: center; min-height: 20px; color: var(--ink-muted); }
  .login-status.err { color: var(--danger); background: rgba(192,57,43,0.06); padding: 9px 12px; border-radius: 8px; border: 1px solid rgba(192,57,43,0.2); }
  .login-status.ok { color: var(--success); }

  .login-expired-notice {
    display: none; align-items: center; gap: 10px;
    background: rgba(184,134,11,0.10); border: 1px solid rgba(184,134,11,0.28);
    border-radius: 8px; padding: 11px 14px; margin-bottom: 20px;
    font-size: 0.84rem; color: var(--warning); font-weight: 600;
  }
  .login-expired-notice.show { display: flex; }
  .login-expired-notice svg { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .login-footer { text-align: center; margin-top: 18px; font-size: 0.78rem; color: var(--ink-muted); }

  @media (max-width: 480px) {
    .login-inner { padding: 30px 22px 26px; }
    .login-brand h1 { font-size: 2.2rem; }
  }
</style>
</head>
<body>

<main style="width:100%; max-width:420px;">
  <div class="login-card">
    <div class="login-inner">
      <div class="login-brand">
        <h1>The~Yo's</h1>
        <p>Staff sign-in</p>
      </div>
      <div class="login-rule" aria-hidden="true"><i></i></div>

      <div class="login-expired-notice" id="expiredNotice">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        Your session expired. Please sign in again.
      </div>

      <form id="loginForm">
        <div class="login-field">
          <label for="staffEmail">Email</label>
          <input id="staffEmail" type="email" required placeholder="staff@theyos.com" autocomplete="username">
        </div>
        <div class="login-field">
          <label for="staffPassword">Password</label>
          <div class="password-wrap">
            <input id="staffPassword" type="password" required placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="password-toggle" data-toggle-pw="staffPassword" aria-label="Show password">
              <svg class="eye-open" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn login-submit" id="loginBtn">Sign in</button>
        <div class="login-status" id="loginStatus" role="status"></div>
      </form>
    </div>
  </div>
  <div class="login-footer">The~Yo's Restaurant &mdash; Staff Portal</div>
</main>

<script type="module">
  // Show the expired-session notice if redirected here with ?expired=1
  const params = new URLSearchParams(window.location.search);
  if (params.get('expired') === '1') {
    document.getElementById('expiredNotice').classList.add('show');
  }

  // Password visibility toggle
  document.querySelectorAll('[data-toggle-pw]').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.togglePw);
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.classList.toggle('shown', !showing);
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });
  });

  // Login form submission
  const form = document.getElementById('loginForm');
  const statusEl = document.getElementById('loginStatus');
  const loginBtn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusEl.textContent = '';
    statusEl.className = 'login-status';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in…';

try {
        const res = await fetch('/api/admin/staff/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            email: document.getElementById('staffEmail').value.trim(),
            password: document.getElementById('staffPassword').value,
          }),
        });
        const data = await res.json();

        if (!res.ok) {
          statusEl.textContent = data.error || 'Invalid email or password.';
          statusEl.className = 'login-status err';
          return;
        }

        // Token is set as httpOnly cookie by server
        localStorage.setItem('staffInfo', JSON.stringify(data.staff));
        // Also persist the csrfToken so adminFetch can fall back to it
        if (data.csrfToken) localStorage.setItem('__admin_csrf_token', data.csrfToken);

        const redirect = params.get('redirect') || 'dashboard.html';
        window.location.href = redirect;
    } catch (err) {
      statusEl.textContent = 'Connection error. Please try again.';
      statusEl.className = 'login-status err';
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
