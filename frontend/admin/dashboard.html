<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — The~Yo's Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-shell.css?v=6">
<style>
  /* ---------- Section headers ---------- */
  .dash-section { margin-bottom: 30px; }
  .dash-section-head {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin: 0 0 14px; padding-left: 10px; border-left: 3px solid var(--brass);
  }
  .dash-section-head h3 {
    font-family: 'Archivo', sans-serif; font-weight: 900; text-transform: uppercase;
    font-size: 1.02rem; letter-spacing: 0.02em; margin: 0;
  }
  .dash-section-head .dash-sub {
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.66rem; text-transform: uppercase;
    opacity: 0.5; letter-spacing: 0.05em;
  }

  /* Stat cards now fully styled by admin-shell.css shared component */

  /* ---------- Tables ---------- */
  .admin-table-wrap { overflow-x: auto; }
  .admin-table td.r, .admin-table th.r { text-align: right; }
  .admin-table td.amt { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; color: var(--brass-dark); white-space: nowrap; }
  .admin-table td.rank { color: var(--brass); font-weight: 800; }
  .admin-table td.muted { opacity: 0.6; }
  .admin-table td .sub-line { display: block; font-size: 0.72rem; opacity: 0.55; font-family: 'Plus Jakarta Sans', sans-serif; }

  /* ---------- Sales breakdown ---------- */
  .breakdown-grid { display: grid; grid-template-columns: 240px 1fr; gap: 24px; align-items: center; }
  @media (max-width: 900px) { .breakdown-grid { grid-template-columns: 1fr; } }
  .donut-box { position: relative; width: 170px; height: 170px; margin: 0 auto; }
  .donut-box svg { display: block; }
  .donut-label {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    font-family: 'Archivo', sans-serif; font-size: 0.82rem; line-height: 1.25; opacity: 0.8;
  }
  .donut-label strong { font-size: 1.05rem; color: var(--brass-dark); }
  .type-row { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .type-row:last-child { border-bottom: none; }
  .type-head { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; flex-wrap: wrap; }
  .type-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .type-name { flex: 1; font-weight: 600; }
  .type-orders { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.7rem; opacity: 0.55; }
  .type-amt { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; color: var(--brass-dark); }
  .type-pct { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.72rem; opacity: 0.6; width: 40px; text-align: right; }
  .type-track { height: 6px; background: var(--stone); border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .type-fill { height: 100%; border-radius: 4px; }

  /* ---------- Monthly target ---------- */
  .target-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .target-main { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; flex: 1; }
  .target-cell { min-width: 0; }
  .target-cell .label { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.65rem; text-transform: uppercase; opacity: 0.55; }
  .target-cell .target-value { font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 1.35rem; margin-top: 4px; overflow-wrap: anywhere; }
  .target-cell .target-value.brass { color: var(--brass-dark); }
  .target-cell .target-value .muted { font-size: 0.8rem; opacity: 0.45; font-weight: 600; }
  .target-progress { margin-top: 20px; }
  .progress-track { height: 10px; background: var(--stone); border-radius: 6px; overflow: hidden; }
  .progress-fill {
    height: 100%; min-width: 0; border-radius: 6px;
    background: linear-gradient(90deg, var(--brass), var(--brass-dark));
    transition: width .4s ease;
  }
  .progress-labels {
    display: flex; justify-content: space-between; margin-top: 8px;
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.68rem; opacity: 0.6;
    text-transform: uppercase; letter-spacing: 0.03em;
    flex-wrap: wrap; gap: 4px 12px;
  }

  /* ---------- Charts ---------- */
  .chart-wrap { width: 100%; position: relative; }
  .chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart-label { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10px; fill: var(--ink-muted); }
  .chart-grid-line { stroke: var(--line); stroke-width: 1; }
  .chart-baseline { stroke: var(--line-strong); stroke-width: 1.2; }
  .chart-area { transition: opacity var(--transition-base); }
  .chart-line-path {
    filter: drop-shadow(0 3px 6px rgba(163,132,74,0.22));
  }
  .chart-peak-badge-bg {
    filter: drop-shadow(0 4px 10px rgba(47,37,20,0.18));
  }
  .chart-peak-label {
    font-family: 'Archivo', sans-serif; font-size: 11.5px; font-weight: 800; fill: #fff;
  }
  .chart-peak-sub {
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 8px; font-weight: 600; fill: rgba(255,255,255,0.75);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .chart-legend-row { margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .chart-legend {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 12px 5px 9px; border-radius: 999px;
    background: var(--stone); border: 1px solid var(--line);
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.7rem; font-weight: 700;
    color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.03em;
    transition: background var(--transition-fast), border-color var(--transition-fast);
  }
  .chart-legend:hover { background: var(--stone-hover); border-color: var(--line-strong); }
  .chart-legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }
  .chart-dot-hit { cursor: pointer; }
  .chart-dot-visible {
    transition: r 0.15s cubic-bezier(0.34,1.56,0.64,1), stroke-width 0.15s ease;
  }
  .chart-dot-hit:hover + .chart-dot-visible,
  .chart-dot-visible.hoverable:hover { r: 6; stroke-width: 2.5; }

  /* Custom floating tooltip (replaces native <title> for a themed look) */
  .chart-tooltip {
    position: fixed; z-index: 500; pointer-events: none;
    background: #1b1d22; color: #fff;
    border-radius: 8px; padding: 9px 12px;
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.74rem; font-weight: 600;
    box-shadow: 0 10px 28px rgba(0,0,0,0.28);
    opacity: 0; transform: translate(-50%, calc(-100% - 12px)) translateY(4px);
    transition: opacity 0.12s ease, transform 0.12s ease;
    white-space: nowrap;
    max-width: min(260px, 90vw); white-space: normal;
  }
  .chart-tooltip.visible { opacity: 1; transform: translate(-50%, calc(-100% - 12px)) translateY(0); }
  .chart-tooltip::after {
    content: ''; position: absolute; left: 50%; top: 100%;
    transform: translateX(-50%);
    border: 6px solid transparent; border-top-color: #1b1d22;
  }
  .chart-tooltip .tt-title { font-weight: 800; color: var(--brass-light); margin-bottom: 2px; display: block; }
  .chart-tooltip .tt-sub { display: block; opacity: 0.8; font-weight: 500; font-size: 0.7rem; }

  /* ---------- Live order rail ---------- */
  .live-orders-section {
    position: relative; overflow: hidden;
    margin-bottom: 30px; padding: 20px 22px;
    border: 1px solid var(--line); border-radius: 16px;
    background: #fff; box-shadow: var(--shadow-sm);
    transition: box-shadow var(--transition-base), border-color var(--transition-base);
  }
  .live-orders-section::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--brass-light), var(--brass-dark));
  }
  .live-orders-section:hover { box-shadow: var(--shadow-md); border-color: var(--line-strong); }
  .live-orders-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; margin-bottom: 16px;
  }
  .live-orders-title { display: flex; align-items: center; gap: 10px; }
  .live-orders-title h2 { margin: 0; font: 700 1rem 'Plus Jakarta Sans', sans-serif; color: var(--ink); }
  .live-orders-title p { margin: 2px 0 0; font-size: .72rem; color: var(--ink-muted); }
  .live-indicator {
    width: 9px; height: 9px; border-radius: 50%; background: var(--success);
    box-shadow: 0 0 0 4px rgba(46,125,79,.14); animation: livePulse 2s ease-in-out infinite;
  }
  .live-orders-count {
    flex-shrink: 0; padding: 6px 12px; border-radius: 999px;
    background: rgba(163,132,74,0.12); color: var(--brass-dark);
    border: 1px solid rgba(163,132,74,0.25);
    font-size: .72rem; font-weight: 700;
  }
  .live-orders-viewport { overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; }
  .live-orders-viewport::-webkit-scrollbar { display: none; }
  .live-orders-rail { display: flex; gap: 14px; width: max-content; min-width: 100%; padding: 2px; }
  .order-ticket {
    width: 292px; min-height: 212px; flex: 0 0 292px;
    display: flex; flex-direction: column; padding: 15px;
    border: 1px solid var(--line); border-top: 3px solid var(--brass-dark);
    border-radius: 12px; background: #fff; color: var(--ink);
    text-decoration: none; box-shadow: var(--shadow-xs);
    scroll-snap-align: start; transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .order-ticket:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--line-strong); }
  .order-ticket.status-preparing { border-top-color: #2c5fb0; }
  .order-ticket.status-ready { border-top-color: var(--success); }
  .order-ticket.status-confirmed { border-top-color: var(--brass); }
  .order-ticket.live-updated { animation: ticketFlash 1.25s ease both; }
  .ticket-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ticket-number { font-size: .88rem; font-weight: 700; color: var(--ink); }
  .ticket-status {
    padding: 4px 8px; border-radius: 999px; background: rgba(163,132,74,0.12);
    color: var(--brass-dark); font-size: .62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
  }
  .status-preparing .ticket-status { color: #2c5fb0; background: rgba(44,95,176,.1); }
  .status-ready .ticket-status { color: var(--success); background: rgba(46,125,79,.12); }
  .ticket-trail {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    margin: 13px 0 10px; padding: 0; list-style: none;
  }
  .ticket-trail-step { position: relative; min-width: 0; text-align: center; }
  .ticket-trail-step:not(:last-child)::after {
    content: ''; position: absolute; z-index: 0;
    top: 7px; left: calc(50% + 8px); right: calc(-50% + 8px);
    height: 2px; background: var(--line);
  }
  .ticket-trail-step.done:not(:last-child)::after { background: var(--brass-dark); }
  .ticket-trail-dot {
    position: relative; z-index: 1; width: 16px; height: 16px;
    display: grid; place-items: center; margin: 0 auto 5px;
    border: 2px solid var(--line-strong); border-radius: 50%;
    background: #fff; color: transparent; font-size: 9px; font-weight: 700;
  }
  .ticket-trail-step.done .ticket-trail-dot { border-color: var(--brass-dark); background: var(--brass-dark); color: #fff; }
  .ticket-trail-step.current .ticket-trail-dot { border-color: var(--brass-dark); box-shadow: 0 0 0 3px rgba(163,132,74,.16); }
  .ticket-trail-step.current .ticket-trail-dot::after { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--brass-dark); }
  .ticket-trail-label {
    display: block; overflow: hidden; text-overflow: ellipsis;
    color: #a2a6b0; font-size: .53rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .025em; white-space: nowrap;
  }
  .ticket-trail-step.done .ticket-trail-label,
  .ticket-trail-step.current .ticket-trail-label { color: var(--brass-dark); }
  .ticket-items { flex: 1; margin: 8px 0 13px; padding: 0; list-style: none; }
  .ticket-items li { display: flex; gap: 8px; margin-top: 6px; font-size: .76rem; line-height: 1.35; }
  .ticket-items li:first-child { margin-top: 0; }
  .ticket-items .qty { min-width: 22px; color: var(--brass-dark); font-weight: 700; }
  .ticket-more { color: var(--ink-muted); font-style: italic; }
  .ticket-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 11px; border-top: 1px solid var(--line); }
  .ticket-owner { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .ticket-avatar {
    width: 28px; height: 28px; flex: 0 0 28px; border-radius: 50%;
    display: grid; place-items: center; background: rgba(163,132,74,0.14); color: var(--brass-dark);
    font-size: .68rem; font-weight: 700;
  }
  .ticket-owner-copy { min-width: 0; }
  .ticket-owner-copy span { display: block; color: #9a9fac; font-size: .58rem; text-transform: uppercase; letter-spacing: .07em; }
  .ticket-owner-copy strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .7rem; font-weight: 600; }
  .ticket-elapsed { color: var(--ink-muted); font-size: .68rem; font-weight: 600; white-space: nowrap; }

  /* ---- Empty / connecting state ---- */
  .live-orders-empty {
    width: 100%; padding: 40px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    text-align: center;
    border: 1.5px dashed var(--line-strong); border-radius: 12px;
    background: var(--stone);
  }
  .loe-icon {
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(163,132,74,0.14); color: var(--brass-dark);
    margin-bottom: 12px;
  }
  .loe-icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .live-orders-empty .loe-title { margin: 0; font: 700 0.86rem 'Plus Jakarta Sans', sans-serif; color: var(--ink); }
  .live-orders-empty .loe-sub { margin: 3px 0 0; font-size: 0.76rem; color: var(--ink-muted); max-width: 300px; }

  @keyframes ticketFlash { 0% { background: #fff5d9; box-shadow: 0 0 0 3px rgba(163,132,74,.22); } 100% { background: #fff; box-shadow: var(--shadow-xs); } }
  @keyframes livePulse { 50% { opacity: .45; transform: scale(.82); } }
  @media (prefers-reduced-motion: reduce) { .live-indicator, .order-ticket.live-updated { animation: none; } .live-orders-viewport { scroll-behavior: auto; } }
  @media (max-width: 600px) { .live-orders-section { padding: 16px; } .order-ticket { width: 260px; flex-basis: 260px; } }
</style>
</head>
<body>

<div id="adminShell"></div>

<script type="module">
  import { renderAdminShell, showAlert } from "./admin-shell.js";
  import { adminFetch, peso, escapeHtml } from "./admin-api.js";

  const session = renderAdminShell({ active: 'dashboard', title: 'Dashboard' });
  let liveRailScrollTimer = null;
  let liveElapsedTimer = null;
  if (session) init();

  /* ================================================================
     Shared helpers
     ================================================================ */
  const TYPE_COLORS = {
    dine_in: '#a3844a', pickup: '#2e7d4f', delivery: '#2c5fb0',
    takeout: '#b8860b', online: '#7d5aa6',
  };
  const TYPE_LABELS = {
    dine_in: 'Dine-in', pickup: 'Pickup', delivery: 'Delivery',
    takeout: 'Takeout', online: 'Online Order',
  };
  const STATUS_LABEL = {
    in_stock: ['In Stock', 'pill-success'],
    below_reorder: ['Below Reorder', 'pill-warning'],
    low_stock: ['Low Stock', 'pill-warning'],
    out_of_stock: ['Out of Stock', 'pill-danger'],
  };
  const STATUS_REMARK = {
    in_stock: 'Healthy stock level.',
    below_reorder: 'At or below reorder level — restock soon.',
    low_stock: 'Running low — monitor closely.',
    out_of_stock: 'Out of stock — reorder immediately.',
  };

  function num(n) { return Number(n) || 0; }
  function fmtDay(dateStr) {
    return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
  }
  function compactPeso(v) {
    const n = num(v);
    if (n >= 1000000) return '₱' + (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return '₱' + (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'k';
    return '₱' + Math.round(n);
  }
  const lockBox = (msg) => `<div class="panel-empty">🔒 ${escapeHtml(msg)}</div>`;

  async function getJSON(path) {
    const res = await adminFetch(path);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Could not load data.');
    return data;
  }

  // Hand-rolled SVG line chart. Lines are drawn as a gently smoothed
  // Catmull-Rom → cubic-Bezier curve so trends read cleanly, while each
  // real value still gets its own dot — a genuine spike still looks like
  // a spike, it just isn't drawn with harsh straight-line corners.
  // Each dot has a larger invisible hit-circle (for touch) that drives a
  // themed floating tooltip (see chartTooltip helpers below) instead of
  // the slow, unstyled native <title> tooltip.
  let chartIdSeq = 0;
  function smoothPath(pts) {
    if (pts.length < 3) return pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)} `;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[i + 2] || p2;
      const segMin = Math.min(p1[1], p2[1]);
      const segMax = Math.max(p1[1], p2[1]);
      const c1x = p1[0] + (p2[0] - p0[0]) / 6;
      const c1y = Math.min(Math.max(p1[1] + (p2[1] - p0[1]) / 6, segMin), segMax);
      const c2x = p2[0] - (p3[0] - p1[0]) / 6;
      const c2y = Math.min(Math.max(p2[1] - (p3[1] - p1[1]) / 6, segMin), segMax);
      d += `C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)} `;
    }
    return d.trim();
  }

  function trendChart({ labels, series, height = 230, highlightPeak = false }) {
    const W = 640, PL = 56, PR = 16, PT = 24, PB = 30;
    const gid = `tcg${chartIdSeq++}`;
    const allVals = series.flatMap((s) => s.values);
    const max = Math.max(...allVals, 1);
    const innerW = W - PL - PR;
    const innerH = height - PT - PB;
    const n = labels.length;
    const xs = (i) => PL + (n === 1 ? innerW / 2 : (i / (n - 1)) * innerW);
    const ys = (v) => PT + innerH - (v / max) * innerH;

    const gridSteps = [0, 0.25, 0.5, 0.75, 1];
    const grid = gridSteps.map((f) => {
      const y = ys(max * f);
      const isBase = f === 0;
      return `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W - PR}" y2="${y.toFixed(1)}" class="${isBase ? 'chart-baseline' : 'chart-grid-line'}"/>` +
        `<text x="${PL - 10}" y="${(y + 4).toFixed(1)}" text-anchor="end" class="chart-label">${compactPeso(max * f)}</text>`;
    }).join('');

    const areaPath = series.length === 1
      ? `<defs>
           <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
             <stop offset="0%" stop-color="${series[0].color}" stop-opacity="0.30"/>
             <stop offset="65%" stop-color="${series[0].color}" stop-opacity="0.06"/>
             <stop offset="100%" stop-color="${series[0].color}" stop-opacity="0"/>
           </linearGradient>
         </defs>
         <path class="chart-area" d="${smoothPath(series[0].values.map((v, i) => [xs(i), ys(v)]))} L${xs(n - 1).toFixed(1)},${(PT + innerH)} L${xs(0).toFixed(1)},${(PT + innerH)} Z" fill="url(#${gid})"/>`
      : '';

    const lines = series.map((s) => {
      const pts = s.values.map((v, i) => [xs(i), ys(v)]);
      const path = smoothPath(pts);
      const dots = s.values.map((v, i) => {
        const tt = s.titles ? s.titles[i] : `${labels[i]}: ${v}`;
        return `
          <circle class="chart-dot-hit" data-tt="${escapeHtml(tt)}" cx="${xs(i).toFixed(1)}" cy="${ys(v).toFixed(1)}" r="11" fill="transparent"></circle>
          <circle class="chart-dot-visible hoverable" cx="${xs(i).toFixed(1)}" cy="${ys(v).toFixed(1)}" r="3" fill="${s.color}" stroke="#fff" stroke-width="1.4" pointer-events="none"/>`;
      }).join('');
      return `<path class="chart-line-path" d="${path}" fill="none" stroke="${s.color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>${dots}`;
    }).join('');

    // Highlight the peak point on single-series charts (e.g. Sales Trend)
    // with a soft halo + a rounded value badge, so a spike reads at a glance.
    let peakMarkup = '';
    if (highlightPeak && series.length === 1) {
      const vals = series[0].values;
      const maxV = Math.max(...vals);
      if (maxV > 0) {
        const idx = vals.indexOf(maxV);
        const px = xs(idx);
        const py = ys(maxV);
        const label = compactPeso(maxV);
        const badgeW = Math.max(52, label.length * 8.2 + 20);
        const badgeH = 30;
        const nearLeft = idx < n * 0.14;
        const nearRight = idx > n * 0.86;
        const bx = nearLeft ? px : nearRight ? px - badgeW : px - badgeW / 2;
        const clampedBx = Math.min(Math.max(bx, PL - 4), W - PR - badgeW + 4);
        const by = Math.max(py - badgeH - 16, 2);
        peakMarkup = `
          <circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="13" fill="${series[0].color}" opacity="0.14"/>
          <circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="5" fill="${series[0].color}" stroke="#fff" stroke-width="2.2"/>
          <g class="chart-peak-badge-bg">
            <rect x="${clampedBx.toFixed(1)}" y="${by.toFixed(1)}" width="${badgeW.toFixed(1)}" height="${badgeH}" rx="8" fill="${series[0].color}"/>
            <text x="${(clampedBx + badgeW / 2).toFixed(1)}" y="${(by + 13).toFixed(1)}" text-anchor="middle" class="chart-peak-sub">Peak</text>
            <text x="${(clampedBx + badgeW / 2).toFixed(1)}" y="${(by + 24.5).toFixed(1)}" text-anchor="middle" class="chart-peak-label">${label}</text>
          </g>`;
      }
    }

    const labelStep = Math.max(1, Math.ceil(n / 6));
    const xLabels = labels.map((l, i) => (i % labelStep === 0 || i === n - 1)
      ? `<text x="${xs(i).toFixed(1)}" y="${height - 10}" text-anchor="middle" class="chart-label">${l}</text>` : '').join('');

    const legend = `<div class="chart-legend-row">${series.map((s) =>
      `<span class="chart-legend"><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>`;

    return `<div class="chart-wrap">${legend}<svg viewBox="0 0 ${W} ${height}" role="img">${grid}${areaPath}${lines}${peakMarkup}${xLabels}</svg></div>`;
  }

  /* ---------- Shared floating tooltip for chart dots ---------- */
  let chartTooltipEl = null;
  function ensureChartTooltip() {
    if (chartTooltipEl) return chartTooltipEl;
    chartTooltipEl = document.createElement('div');
    chartTooltipEl.className = 'chart-tooltip';
    document.body.appendChild(chartTooltipEl);
    return chartTooltipEl;
  }
  function positionChartTooltip(x, y) {
    const tt = ensureChartTooltip();
    const margin = 12;
    const clampedX = Math.min(Math.max(x, margin + 60), window.innerWidth - margin - 60);
    tt.style.left = `${clampedX}px`;
    tt.style.top = `${Math.max(y, 50)}px`;
  }
  document.addEventListener('mouseover', (e) => {
    const dot = e.target.closest('.chart-dot-hit');
    if (!dot) return;
    const tt = ensureChartTooltip();
    const raw = dot.getAttribute('data-tt') || '';
    const [title, ...rest] = raw.split(' · ');
    tt.innerHTML = `<span class="tt-title">${title || ''}</span>${rest.length ? `<span class="tt-sub">${rest.join(' · ')}</span>` : ''}`;
    const rect = dot.getBoundingClientRect();
    positionChartTooltip(rect.left + rect.width / 2, rect.top);
    tt.classList.add('visible');
  });
  document.addEventListener('mousemove', (e) => {
    if (!chartTooltipEl || !chartTooltipEl.classList.contains('visible')) return;
    const dot = e.target.closest('.chart-dot-hit');
    if (!dot) return;
    const rect = dot.getBoundingClientRect();
    positionChartTooltip(rect.left + rect.width / 2, rect.top);
  });
  document.addEventListener('mouseout', (e) => {
    const dot = e.target.closest('.chart-dot-hit');
    if (!dot) return;
    if (chartTooltipEl) chartTooltipEl.classList.remove('visible');
  });

  // Donut chart for the order-type breakdown.
  function donutChart(segments, total) {
    const size = 170, R = 62, C = 2 * Math.PI * R;
    const cx = size / 2;
    let cumulative = 0;
    const arcs = segments.map((seg) => {
      const frac = total > 0 ? num(seg.total_sales) / total : 0;
      const dash = frac * C;
      const offset = C * 0.25 - cumulative * C;
      cumulative += frac;
      return `<circle cx="${cx}" cy="${cx}" r="${R}" fill="none"
        stroke="${TYPE_COLORS[seg.order_type] || '#a3844a'}" stroke-width="24"
        stroke-dasharray="${dash.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}">
        <title>${TYPE_LABELS[seg.order_type] || seg.order_type}: ${peso(seg.total_sales)}</title>
      </circle>`;
    }).join('');
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${arcs}</svg>`;
  }

  function elapsedLabel(value) {
    const started = new Date(value).getTime();
    if (!Number.isFinite(started)) return 'Just now';
    const minutes = Math.max(0, Math.floor((Date.now() - started) / 60000));
    if (minutes < 1) return 'Just now';
    if (minutes < 60) return `${minutes}m`;
    const hours = Math.floor(minutes / 60);
    return `${hours}h ${minutes % 60}m`;
  }

  function liveStatusLabel(status) {
    return ({ pending: 'Pending', confirmed: 'Accepted', preparing: 'Preparing', ready: 'Ready' })[status] || status;
  }

  function orderStatusTrail(status) {
    const stages = [
      { key: 'pending', label: 'Pending' },
      { key: 'confirmed', label: 'Confirm' },
      { key: 'preparing', label: 'Preparing' },
      { key: 'completed', label: 'Completed' },
    ];
    const currentIndex = ({ pending: 0, confirmed: 1, preparing: 2, ready: 2, completed: 3 })[status] ?? 0;
    return `<ol class="ticket-trail" aria-label="Order progress">
      ${stages.map((stage, index) => {
        const state = index < currentIndex ? 'done' : (index === currentIndex ? 'current' : 'upcoming');
        const current = index === currentIndex ? ' aria-current="step"' : '';
        return `<li class="ticket-trail-step ${state}"${current}>
          <span class="ticket-trail-dot" aria-hidden="true">${state === 'done' ? '✓' : ''}</span>
          <span class="ticket-trail-label">${stage.label}</span>
        </li>`;
      }).join('')}
    </ol>`;
  }

  function updateElapsedLabels() {
    document.querySelectorAll('.ticket-elapsed[data-ordered-at]').forEach(el => {
      el.textContent = elapsedLabel(el.dataset.orderedAt);
    });
  }

  function startRailAutoScroll() {
    window.clearInterval(liveRailScrollTimer);
    const viewport = document.getElementById('liveOrdersViewport');
    const rail = document.getElementById('liveOrdersRail');
    if (!viewport || !rail || rail.children.length < 2) return;
    liveRailScrollTimer = window.setInterval(() => {
      if (viewport.matches(':hover') || viewport.contains(document.activeElement)) return;
      const firstCard = rail.querySelector('.order-ticket');
      if (!firstCard || viewport.scrollWidth <= viewport.clientWidth) return;
      const atEnd = viewport.scrollLeft + viewport.clientWidth >= viewport.scrollWidth - 24;
      viewport.scrollTo({ left: atEnd ? 0 : viewport.scrollLeft + firstCard.offsetWidth + 14, behavior: 'smooth' });
    }, 4200);
  }

  function renderLiveOrderRail(orders, changedIds = []) {
    const rail = document.getElementById('liveOrdersRail');
    const count = document.getElementById('liveOrdersCount');
    if (!rail || !count) return;

    const priority = { ready: 0, preparing: 1, confirmed: 2, pending: 3 };
    const active = [...(orders || [])].sort((a, b) =>
      (priority[a.status] ?? 9) - (priority[b.status] ?? 9) ||
      new Date(a.datetime_ordered) - new Date(b.datetime_ordered)
    );
    count.textContent = `${active.length} active`;

    if (!active.length) {
      rail.innerHTML = `
        <div class="live-orders-empty">
          <div class="loe-icon"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
          <p class="loe-title">No orders in progress</p>
          <p class="loe-sub">New orders will appear here automatically as they come in.</p>
        </div>`;
      window.clearInterval(liveRailScrollTimer);
      return;
    }

    const changed = new Set((changedIds || []).map(String));
    rail.innerHTML = active.map(order => {
      const items = Array.isArray(order.items) ? order.items : [];
      const visibleItems = items.slice(0, 3);
      const owner = order.handler_name || 'Unassigned';
      const initials = owner === 'Unassigned'
        ? '—'
        : owner.split(/\s+/).filter(Boolean).slice(0, 2).map(part => part[0]).join('').toUpperCase();
      return `
        <a class="order-ticket status-${escapeHtml(order.status)}${changed.has(String(order.id)) ? ' live-updated' : ''}" href="sales.html" aria-label="Open order ${escapeHtml(order.id)}">
          <div class="ticket-top">
            <span class="ticket-number">Order #${escapeHtml(order.id)}</span>
            <span class="ticket-status">${escapeHtml(liveStatusLabel(order.status))}</span>
          </div>
          ${orderStatusTrail(order.status)}
          <ul class="ticket-items">
            ${visibleItems.length ? visibleItems.map(item => `<li><span class="qty">×${Number(item.quantity) || 1}</span><span>${escapeHtml(item.name || 'Menu item')}</span></li>`).join('') : `<li><span class="qty">×${Number(order.item_count) || 0}</span><span>Order items</span></li>`}
            ${items.length > visibleItems.length ? `<li class="ticket-more">+${items.length - visibleItems.length} more item${items.length - visibleItems.length === 1 ? '' : 's'}</li>` : ''}
          </ul>
          <div class="ticket-bottom">
            <div class="ticket-owner">
              <span class="ticket-avatar" aria-hidden="true">${escapeHtml(initials)}</span>
              <span class="ticket-owner-copy"><span>Handled by</span><strong>${escapeHtml(owner)}</strong></span>
            </div>
            <span class="ticket-elapsed" data-ordered-at="${escapeHtml(order.datetime_ordered)}">${escapeHtml(elapsedLabel(order.datetime_ordered))}</span>
          </div>
        </a>`;
    }).join('');
    window.setTimeout(startRailAutoScroll, 0);
  }

  function openTargetModal(current) {
    const existing = document.querySelector('.modal-backdrop');
    if (existing) existing.remove();
    const back = document.createElement('div');
    back.className = 'modal-backdrop active';
    back.innerHTML = `
      <div class="modal-box">
        <h3>Set Monthly Sales Target</h3>
        <div class="form-field">
          <label>Monthly target (₱) for ${current.month}</label>
          <input type="number" id="targetInput" min="0" step="0.01" value="${current.target != null ? current.target : ''}" placeholder="e.g. 100000">

        <div class="form-field" style="margin-top:12px;">
          <label>Sales so far this month</label>
          <div style="font-size:0.9rem; color:var(--ink-muted);">${peso(current.month_sales)}</div>
        </div>
        <div class="modal-close-row">
          <button class="btn btn-outline" id="targetCancel">Cancel</button>
          <button class="btn" id="targetSave">Save Target</button>
        </div>
      </div>`;
    document.body.appendChild(back);

    const close = () => back.remove();
    back.querySelector('#targetCancel').addEventListener('click', close);
    back.addEventListener('click', (e) => { if (e.target === back) close(); });
    back.querySelector('#targetSave').addEventListener('click', async () => {
      const target = parseFloat(back.querySelector('#targetInput').value);
      if (!Number.isFinite(target) || target < 0) {
        showAlert('Enter a valid non-negative amount.', { title: 'Invalid target' });
        return;
      }
      const saveBtn = back.querySelector('#targetSave');
      saveBtn.disabled = true;
      try {
        const res = await adminFetch('/api/admin/dashboard/monthly-target', {
          method: 'PUT',
          body: JSON.stringify({ target }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Could not save target.');
        close();
        loadMonthlyTarget();
      } catch (err) {
        showAlert(err.message, { title: 'Save failed' });
        saveBtn.disabled = false;
      }
    });
    back.querySelector('#targetInput').focus();
  }

      el.innerHTML = `
        <div class="stat-hero-row">
          <div class="stat-hero">
            <div class="label">Cash Sales Today</div>
            <div class="hero-row"><div class="value">${peso(d.cash_sales)}</div></div>
            <div class="stat-note">${d.cash_sale_count} ${d.cash_sale_count === 1 ? 'sale' : 'sales'} · variance
              <strong style="color:${d.variance === 0 ? 'inherit' : (d.variance < 0 ? 'var(--danger)' : 'var(--success)')}">${peso(d.variance)}</strong>
            </div>
          </div>
          <div class="stat-secondary-grid">
            <div class="stat-card"><div class="label">Opening</div><div class="value">${peso(d.opening)}</div></div>
            <div class="stat-card"><div class="label">Cash In</div><div class="value success">${peso(d.cash_in)}</div></div>
            <div class="stat-card"><div class="label">Cash Out</div><div class="value danger">${peso(d.cash_out)}</div></div>
            <div class="stat-card"><div class="label">Expected</div><div class="value">${peso(d.expected)}</div></div>
            <div class="stat-card"><div class="label">Actual</div><div class="value">${peso(d.actual)}</div></div>
            <div class="stat-card"><div class="label">Variance</div><div class="value ${varClass}">${peso(d.variance)}</div></div>
          </div>
        </div>
      `;
    } catch (err) {
      el.innerHTML = lockBox(err.message);
    }
  }

  /* ========== 7. Cash trend ========== */
  async function loadCashTrend() {
    const el = document.getElementById('sec-cash-trend');
    try {
      const d = await getJSON('/api/admin/dashboard/cash-trend');
      const days = d.days || [];
      const hasData = days.some((x) => num(x.cash_sales) > 0 || num(x.cash_in) > 0 || num(x.cash_out) > 0);
      el.innerHTML = hasData
        ? trendChart({
            labels: days.map((x) => fmtDay(x.date)),
            series: [
              { name: 'Cash Sales', color: '#a3844a', values: days.map((x) => num(x.cash_sales)), titles: days.map((x) => `${fmtDay(x.date)} · Cash sales ${peso(x.cash_sales)}`) },
              { name: 'Cash In', color: '#2e7d4f', values: days.map((x) => num(x.cash_in)), titles: days.map((x) => `${fmtDay(x.date)} · Cash in ${peso(x.cash_in)}`) },
              { name: 'Cash Out', color: '#c0392b', values: days.map((x) => num(x.cash_out)), titles: days.map((x) => `${fmtDay(x.date)} · Cash out ${peso(x.cash_out)}`) },
            ],
          })
        : `<div class="panel-empty">No cash activity in the last 15 days.</div>`;
    } catch (err) {
      el.innerHTML = lockBox(err.message);
    }
  }

  /* ========== 8. Inventory overview ========== */
  async function loadInventoryOverview() {
    const el = document.getElementById('sec-inventory-overview');
    try {
      const d = await getJSON('/api/admin/dashboard/inventory-overview');
      const needsAttention = d.below_reorder + d.low_stock + d.out_of_stock;
      el.innerHTML = `
        <div class="stat-hero-row">
          <div class="stat-hero">
            <div class="label">Needs Attention</div>
            <div class="hero-row"><div class="value ${needsAttention > 0 ? 'danger' : ''}">${needsAttention}</div></div>
            <div class="stat-note">out of ${d.total_items} total items tracked</div>
          </div>
          <div class="stat-secondary-grid">
            <div class="stat-card"><div class="label">In Stock</div><div class="value success">${d.in_stock}</div></div>
            <div class="stat-card"><div class="label">Below Reorder</div><div class="value warning">${d.below_reorder}</div></div>
            <div class="stat-card"><div class="label">Low Stock</div><div class="value warning">${d.low_stock}</div></div>
            <div class="stat-card"><div class="label">Out of Stock</div><div class="value ${d.out_of_stock > 0 ? 'danger' : ''}">${d.out_of_stock}</div></div>
          </div>
        </div>
      `;
    } catch (err) {
      el.innerHTML = lockBox(err.message);
    }
  }

  /* ========== 9. Inventory usage ========== */
  async function loadInventoryUsage() {
    const el = document.getElementById('sec-inventory-usage');
    try {
      const d = await getJSON('/api/admin/dashboard/inventory-usage');
      const items = d.items || [];
      el.innerHTML = items.length ? `
        <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>Item</th><th class="r">Opening Qty</th><th class="r">Closing Qty</th><th class="r">Used Qty</th><th class="r">Usage</th></tr></thead>
          <tbody>
            ${items.map((it) => `
              <tr>
                <td>${escapeHtml(it.description)}<span class="sub-line">per ${escapeHtml(it.unit)}</span></td>
                <td class="r">${it.opening_qty}</td>
                <td class="r">${it.closing_qty}</td>
                <td class="r amt">${it.used_qty}</td>
                <td class="r">${it.usage_percent != null ? it.usage_percent + '%' : '—'}</td>
              </tr>`).join('')}
          </tbody>
        </table>
        </div>`
      : `<div class="panel-empty">No stock was consumed today.</div>`;
    } catch (err) {
      el.innerHTML = lockBox(err.message);
    }
  }

  /* ========== 10. Inventory status ========== */
  async function loadInventoryStatus() {
    const el = document.getElementById('sec-inventory-status');
    try {
      const d = await getJSON('/api/admin/dashboard/inventory-status');
      const items = d.items || [];
      el.innerHTML = items.length ? `
        <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>Item</th><th>Category</th><th class="r">Quantity</th><th>Status</th><th>Days of Stock</th><th>Remarks</th></tr></thead>
          <tbody>
            ${items.map((it) => {
              const [label, cls] = STATUS_LABEL[it.stock_status] || [it.stock_status, 'pill-neutral'];
              const remark = it.notes || STATUS_REMARK[it.stock_status] || '';
              const supplier = it.supplier ? `<span class="sub-line">Supplier: ${escapeHtml(it.supplier)}</span>` : '';
              return `
              <tr>
                <td>${escapeHtml(it.name)}${it.sku ? `<span class="sub-line">${escapeHtml(it.sku)}</span>` : ''}</td>
                <td class="muted">${escapeHtml(it.category)}</td>
                <td class="r">${it.quantity} <span class="muted">${escapeHtml(it.unit)}</span></td>
                <td><span class="pill ${cls}">${label}</span></td>
                <td class="muted">N/A</td>
                <td class="muted">${escapeHtml(remark)}${supplier}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        </div>`
      : `<div class="panel-empty">No inventory items yet.</div>`;
    } catch (err) {
      el.innerHTML = lockBox(err.message);
    }
  }
</script>
</body>
</html>
