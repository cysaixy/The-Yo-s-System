<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — The~Yo's Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-shell.css?v=4">
<style>
  /* ---------- Section headers ---------- */
  .dash-section { margin-bottom: 30px; }
  .dash-section-head {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin: 0 0 14px; padding-left: 10px; border-left: 3px solid var(--brass);
  }
  .dash-section-head h3 {
    font-family: 'Archivo', sans-serif; font-weight: 900; text-transform: uppercase;
    font-size: 1.02rem; letter-spacing: 0.02em; margin: 0;
  }
  .dash-section-head .dash-sub {
    font-family: 'Space Mono', monospace; font-size: 0.66rem; text-transform: uppercase;
    opacity: 0.5; letter-spacing: 0.05em;
  }

  /* ---------- Stat cards ---------- */
  .stat-card .stat-note { margin-top: 4px; font-family: 'Space Mono', monospace; font-size: 0.68rem; opacity: 0.55; }
  .stat-card .value.warning { color: var(--warning); }

  /* ---------- Tables ---------- */
  .admin-table-wrap { overflow-x: auto; }
  .admin-table td.r, .admin-table th.r { text-align: right; }
  .admin-table td.amt { font-family: 'Space Mono', monospace; font-weight: 700; color: var(--brass-dark); white-space: nowrap; }
  .admin-table td.rank { color: var(--brass); font-weight: 800; }
  .admin-table td.muted { opacity: 0.6; }
  .admin-table td .sub-line { display: block; font-size: 0.72rem; opacity: 0.55; font-family: 'Space Mono', monospace; }

  /* ---------- Sales breakdown ---------- */
  .breakdown-grid { display: grid; grid-template-columns: 240px 1fr; gap: 24px; align-items: center; }
  @media (max-width: 900px) { .breakdown-grid { grid-template-columns: 1fr; } }
  .donut-box { position: relative; width: 170px; height: 170px; margin: 0 auto; }
  .donut-box svg { display: block; }
  .donut-label {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    font-family: 'Space Mono', monospace; font-size: 0.64rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-muted);
  }
  .donut-label strong {
    font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 1.15rem;
    letter-spacing: -0.02em; color: var(--brass-dark); margin-top: 2px;
  }
  .type-row { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .type-row:last-child { border-bottom: none; }
  .type-head { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; flex-wrap: wrap; }
  .type-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .type-name { flex: 1; font-weight: 600; }
  .type-orders { font-family: 'Space Mono', monospace; font-size: 0.7rem; font-weight: 700; color: var(--ink-muted); }
  .type-amt { font-family: 'Space Mono', monospace; font-weight: 700; color: var(--brass-dark); }
  .type-pct { font-family: 'Space Mono', monospace; font-size: 0.72rem; font-weight: 700; color: var(--ink-muted); width: 40px; text-align: right; }
  .type-track { height: 6px; background: var(--stone); border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .type-fill { height: 100%; border-radius: 4px; }

  /* ---------- Monthly target ---------- */
  .target-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .target-main { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; flex: 1; }
  .target-cell { min-width: 0; }
  .target-cell .label { font-family: 'Space Mono', monospace; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--ink-muted); }
  .target-cell .target-value { font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 1.35rem; margin-top: 4px; overflow-wrap: anywhere; }
  .target-cell .target-value.brass { color: var(--brass-dark); }
  .target-cell .target-value .muted { font-size: 0.8rem; color: var(--ink-muted); font-weight: 600; }
  .target-progress { margin-top: 20px; }
  .progress-track { height: 10px; background: var(--stone); border-radius: 6px; overflow: hidden; }
  .progress-fill {
    height: 100%; min-width: 0; border-radius: 6px;
    background: var(--brass);
    transition: width .4s ease;
  }
  .progress-labels {
    display: flex; justify-content: space-between; margin-top: 8px;
    font-family: 'Space Mono', monospace; font-size: 0.68rem; font-weight: 700;
    color: var(--ink-muted);
    text-transform: uppercase; letter-spacing: 0.03em;
    flex-wrap: wrap; gap: 4px 12px;
  }

  /* ---------- Charts ---------- */
  .chart-wrap { width: 100%; }
  .chart-wrap svg { width: 100%; height: auto; display: block; }
  .chart-label { font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; fill: var(--ink-muted, #4d5156); letter-spacing: 0.02em; }
  .chart-legend-row { margin-bottom: 12px; }
  .chart-legend {
    display: inline-flex; align-items: center; gap: 7px; margin-right: 20px;
    font-family: 'Space Mono', monospace; font-size: 0.72rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink); opacity: 0.9;
  }
  .chart-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex-shrink: 0; }
</style>
</head>
<body>

<div id="adminShell"></div>

<script type="module">
  import { renderAdminShell, showAlert } from "./admin-shell.js";
  import { adminFetch, peso, escapeHtml } from "./admin-api.js";

  const session = renderAdminShell({ active: 'dashboard', title: 'Dashboard' });
  if (session) init();

  /* ================================================================
     Shared helpers
     ================================================================ */
  const TYPE_COLORS = {
    dine_in: '#a3844a', pickup: '#2e7d4f', delivery: '#2c5fb0',
    takeout: '#b8860b', online: '#7d5aa6',
  };
  const TYPE_LABELS = {
    dine_in: 'Dine-in', pickup: 'Pickup', delivery: 'Delivery',
    takeout: 'Takeout', online: 'Online Order',
  };
  const STATUS_LABEL = {
    in_stock: ['In Stock', 'pill-success'],
    below_reorder: ['Below Reorder', 'pill-warning'],
    low_stock: ['Low Stock', 'pill-warning'],
    out_of_stock: ['Out of Stock', 'pill-danger'],
  };
  const STATUS_REMARK = {
    in_stock: 'Healthy stock level.',
    below_reorder: 'At or below reorder level — restock soon.',
    low_stock: 'Running low — monitor closely.',
    out_of_stock: 'Out of stock — reorder immediately.',
  };

  function num(n) { return Number(n) || 0; }
  function fmtDay(dateStr) {
    return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
  }
  function compactPeso(v) {
    const n = num(v);
    if (n >= 1000000) return '₱' + (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return '₱' + (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'k';
    return '₱' + Math.round(n);
  }
  const lockBox = (msg) => `<div class="panel-empty">🔒 ${escapeHtml(msg)}</div>`;

  async function getJSON(path) {
    const res = await adminFetch(path);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Could not load data.');
    return data;
  }

  // Hand-rolled SVG line chart — no library, no fake data.
  // Uses tactile dashed grid, soft outlier curve scaling, diamond markers,
  // and direct peak annotation.
  function trendChart({ labels, series, height = 230 }) {
    const W = 640, PL = 60, PR = 20, PT = 24, PB = 30;
    const allVals = series.flatMap((s) => s.values);
    const max = Math.max(...allVals, 1);
    const innerW = W - PL - PR;
    const innerH = height - PT - PB;
    const n = labels.length;

    // Soft power scaling to prevent a single outlier day from flattening lower values
    const norm = (v) => (v <= 0 ? 0 : Math.pow(v / max, 0.82));
    const xs = (i) => PL + (n === 1 ? innerW / 2 : (i / (n - 1)) * innerW);
    const ys = (v) => PT + innerH - norm(v) * innerH;

    // Tactile dashed grid lines with accurate tick labeling
    const grid = [0, 0.25, 0.5, 0.75, 1].map((f) => {
      const val = max * f;
      const y = ys(val);
      return `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W - PR}" y2="${y.toFixed(1)}" stroke="#dfd7ca" stroke-width="1" stroke-dasharray="3,3"/>` +
        `<text x="${PL - 10}" y="${(y + 3.5).toFixed(1)}" text-anchor="end" class="chart-label">${compactPeso(val)}</text>`;
    }).join('');

    const areaPath = series.length === 1
      ? `<path d="${series[0].values.map((v, i) => `${i === 0 ? 'M' : 'L'}${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(' ')} L${xs(n - 1).toFixed(1)},${(PT + innerH)} L${xs(0).toFixed(1)},${(PT + innerH)} Z" fill="rgba(163,132,74,0.08)"/>`
      : '';

    // Find peak value across series to annotate directly
    let peakVal = 0, peakX = 0, peakY = 0, peakColor = '#a3844a';
    series.forEach((s) => {
      s.values.forEach((v, i) => {
        if (v > peakVal) {
          peakVal = v;
          peakX = xs(i);
          peakY = ys(v);
          peakColor = s.color || '#a3844a';
        }
      });
    });

    const lines = series.map((s) => {
      const path = s.values.map((v, i) => `${i === 0 ? 'M' : 'L'}${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(' ');
      const diamonds = s.values.map((v, i) => {
        const x = xs(i);
        const y = ys(v);
        const title = s.titles ? s.titles[i] : (labels[i] + ': ' + v);
        return `<polygon points="${x.toFixed(1)},${(y - 4.5).toFixed(1)} ${(x + 4.5).toFixed(1)},${y.toFixed(1)} ${x.toFixed(1)},${(y + 4.5).toFixed(1)} ${(x - 4.5).toFixed(1)},${y.toFixed(1)}" fill="${s.color}" stroke="#ffffff" stroke-width="1.6">
          <title>${title}</title>
        </polygon>`;
      }).join('');
      return `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>${diamonds}`;
    }).join('');

    // Peak annotation callout badge directly on the chart
    let peakAnnotation = '';
    if (peakVal > 0) {
      const badgeW = 72;
      const badgeH = 18;
      const clampedX = Math.max(PL + badgeW / 2, Math.min(W - PR - badgeW / 2, peakX));
      peakAnnotation = `
        <g class="peak-badge">
          <line x1="${peakX.toFixed(1)}" y1="${(peakY - 18).toFixed(1)}" x2="${peakX.toFixed(1)}" y2="${(peakY - 5).toFixed(1)}" stroke="${peakColor}" stroke-width="1.2" stroke-dasharray="2,2"/>
          <rect x="${(clampedX - badgeW / 2).toFixed(1)}" y="${(peakY - 26).toFixed(1)}" width="${badgeW}" height="${badgeH}" rx="4" fill="#15171a" />
          <text x="${clampedX.toFixed(1)}" y="${(peakY - 14).toFixed(1)}" text-anchor="middle" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#faf7f2">PEAK ${compactPeso(peakVal)}</text>
        </g>`;
    }

    const labelStep = Math.max(1, Math.ceil(n / 6));
    const xLabels = labels.map((l, i) => (i % labelStep === 0 || i === n - 1)
      ? `<text x="${xs(i).toFixed(1)}" y="${height - 10}" text-anchor="middle" class="chart-label">${l}</text>` : '').join('');

    const legend = `<div class="chart-legend-row">${series.map((s) =>
      `<span class="chart-legend"><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>`;

    return `<div class="chart-wrap">${legend}<svg viewBox="0 0 ${W} ${height}" role="img">${grid}${areaPath}${lines}${peakAnnotation}${xLabels}</svg></div>`;
  }

  // Donut chart with tactile gaps and percentage labels on segments
  function donutChart(segments, total) {
    const size = 170, R = 62, C = 2 * Math.PI * R;
    const cx = size / 2;
    const cy = size / 2;
    let cumulative = 0;
    const gap = (segments.length > 1 && total > 0) ? 3.5 : 0;

    let segmentTexts = '';
    const arcs = segments.map((seg) => {
      const frac = total > 0 ? num(seg.total_sales) / total : 0;
      if (frac <= 0) return '';
      const dash = Math.max(0, frac * C - gap);
      const offset = C * 0.25 - cumulative * C - gap / 2;

      // Add percentage text on sufficiently large slices
      if (frac >= 0.08) {
        const midAngle = 2 * Math.PI * (cumulative + frac / 2) - Math.PI / 2;
        const lx = cx + R * Math.cos(midAngle);
        const ly = cy + R * Math.sin(midAngle) + 3.5;
        const pct = Math.round(frac * 100);
        segmentTexts += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#ffffff">${pct}%</text>`;
      }

      cumulative += frac;
      return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none"
        stroke="${TYPE_COLORS[seg.order_type] || '#a3844a'}" stroke-width="24"
        stroke-dasharray="${dash.toFixed(2)} ${(C - dash).toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}">
        <title>${TYPE_LABELS[seg.order_type] || seg.order_type}: ${peso(seg.total_sales)} (${Math.round(frac * 100)}%)</title>
      </circle>`;
    }).join('');

    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${arcs}${segmentTexts}</svg>`;
  }

  /* ================================================================
     Page skeleton — all 10 sections always render; individual sections
     show a 🔒 lock note if the logged-in staff lacks that permission.
     ================================================================ */
  function init() {
    const today = new Date().toLocaleDateString('en-PH', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
    });
    const content = document.getElementById('adminContent');
    content.innerHTML = `
      <div class="dash-section">
        <div class="dash-section-head"><h3>Sales Overview</h3><span class="dash-sub">as of today · ${today}</span></div>
        <div class="stat-grid" id="sec-overview"><div class="admin-loading">Loading…</div></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Sales Breakdown</h3><span class="dash-sub">by order type · today</span></div>
        <div class="admin-panel"><div class="admin-panel-body" id="sec-breakdown"><div class="admin-loading">Loading…</div></div></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Monthly Sales Target</h3><span class="dash-sub">${today}</span></div>
        <div class="admin-panel"><div class="admin-panel-body" id="sec-monthly-target"><div class="admin-loading">Loading…</div></div></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Top 10 Best Sellers</h3><span class="dash-sub">as of today</span></div>
        <div class="admin-panel"><div class="admin-panel-body" id="sec-best-sellers"><div class="admin-loading">Loading…</div></div></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Sales Trend</h3><span class="dash-sub">last 15 days</span></div>
        <div class="admin-panel"><div class="admin-panel-body" id="sec-sales-trend"><div class="admin-loading">Loading…</div></div></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Cash Overview</h3><span class="dash-sub">as of today</span></div>
        <div class="stat-grid" id="sec-cash-overview"><div class="admin-loading">Loading…</div></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Cash Trend</h3><span class="dash-sub">last 15 days</span></div>
        <div class="admin-panel"><div class="admin-panel-body" id="sec-cash-trend"><div class="admin-loading">Loading…</div></div></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Inventory Overview</h3><span class="dash-sub">raw stock status</span></div>
        <div class="stat-grid" id="sec-inventory-overview"><div class="admin-loading">Loading…</div></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Inventory Usage</h3><span class="dash-sub">as of today</span></div>
        <div class="admin-panel"><div class="admin-panel-body" id="sec-inventory-usage"><div class="admin-loading">Loading…</div></div></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Inventory Status</h3><span class="dash-sub">days of stock: N/A · insufficient history</span></div>
        <div class="admin-panel"><div class="admin-panel-body" id="sec-inventory-status"><div class="admin-loading">Loading…</div></div></div>
      </div>
    `;

    // Each section loads independently so one slow/failed section never
    // blanks the rest of the dashboard.
    loadSalesOverview();
    loadSalesBreakdown();
    loadMonthlyTarget();
    loadBestSellers();
    loadSalesTrend();
    loadCashOverview();
    loadCashTrend();
    loadInventoryOverview();
    loadInventoryUsage();
    loadInventoryStatus();
  }

  /* ========== 1. Sales overview ========== */
  async function loadSalesOverview() {
    const el = document.getElementById('sec-overview');
    try {
      const d = await getJSON('/api/admin/dashboard');
      el.innerHTML = `
        <div class="stat-card"><div class="label">Today's Sales</div><div class="value brass">${peso(d.todaySales)}</div></div>
        <div class="stat-card"><div class="label">Today's Orders</div><div class="value">${d.todayOrderCount}</div></div>
        <div class="stat-card"><div class="label">Avg Order Value</div><div class="value">${peso(d.avgOrderValue)}</div></div>
        <div class="stat-card"><div class="label">Gross Profit</div><div class="value ${d.grossProfit < 0 ? 'danger' : 'brass'}">${peso(d.grossProfit)}</div><div class="stat-note">${d.profitMargin}% margin</div></div>
        <div class="stat-card"><div class="label">Order Types</div><div class="value">${d.orderTypesCount}</div><div class="stat-note">of 5 tracked today</div></div>
      `;
    } catch (err) {
      el.innerHTML = lockBox(err.message);
    }
  }

  /* ========== 2. Sales breakdown ========== */
  async function loadSalesBreakdown() {
    const el = document.getElementById('sec-breakdown');
    try {
      const d = await getJSON('/api/admin/dashboard/sales-breakdown');
      const types = d.byOrderType || [];
      const total = types.reduce((s, t) => s + num(t.total_sales), 0);
      const maxType = Math.max(...types.map((t) => num(t.total_sales)), 0);
      const active = types.filter((t) => num(t.total_sales) > 0);

      const donut = total > 0
        ? donutChart(active, total)
        : `<svg viewBox="0 0 170 170" width="170" height="170"><circle cx="85" cy="85" r="62" fill="none" stroke="#efe9dd" stroke-width="24"/></svg>`;

      const legend = types.map((t) => {
        const pct = total > 0 ? Math.round((num(t.total_sales) / total) * 100) : 0;
        const barWidth = maxType > 0 ? Math.round((num(t.total_sales) / maxType) * 100) : 0;
        return `
          <div class="type-row">
            <div class="type-head">
              <span class="type-dot" style="background:${TYPE_COLORS[t.order_type] || '#a3844a'}"></span>
              <span class="type-name">${TYPE_LABELS[t.order_type] || t.order_type}</span>
              <span class="type-orders">${t.order_count} ${t.order_count === 1 ? 'order' : 'orders'}</span>
              <span class="type-amt">${peso(t.total_sales)}</span>
              <span class="type-pct">${pct}%</span>
            </div>
            <div class="type-track"><div class="type-fill" style="width:${barWidth}%;background:${TYPE_COLORS[t.order_type] || '#a3844a'}"></div></div>
          </div>`;
      }).join('');

      el.innerHTML = `
        <div class="breakdown-grid">
          <div class="donut-box">
            ${donut}
            <div class="donut-label">Total today<br><strong>${peso(total)}</strong></div>
          </div>
          <div>${legend}</div>
        </div>`;
    } catch (err) {
      el.innerHTML = lockBox(err.message);
    }
  }

  /* ========== 3. Monthly sales target ========== */
  async function loadMonthlyTarget() {
    const el = document.getElementById('sec-monthly-target');
    try {
      const d = await getJSON('/api/admin/dashboard/monthly-target');
      const pct = d.target ? Math.min(100, num(d.progress_percent)) : 0;
      const remaining = d.target ? Math.max(0, num(d.target) - num(d.month_sales)) : null;
      const canSet = session.staff && session.staff.role === 'Admin';

      el.innerHTML = `
        <div class="target-top">
          <div class="target-main">
            <div class="target-cell"><div class="label">Target</div>
              <div class="target-value">${d.target != null ? peso(d.target) : '<span class="muted">Not set</span>'}</div></div>
            <div class="target-cell"><div class="label">Sales this month</div>
              <div class="target-value brass">${peso(d.month_sales)}</div></div>
            <div class="target-cell"><div class="label">Remaining</div>
              <div class="target-value">${remaining != null ? peso(remaining) : '—'}</div></div>
            <div class="target-cell"><div class="label">Days left</div>
              <div class="target-value">${d.days_remaining} <span class="muted">of ${d.days_in_month}</span></div></div>
          </div>
          ${canSet ? `<button class="btn btn-outline small" id="setTargetBtn">Set Target</button>` : ''}
        </div>
        <div class="target-progress">
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-labels">
            <span>${d.target ? num(d.progress_percent) + '% of target reached' : 'Set a monthly target to track progress'}</span>
            <span>${d.month} · ${d.month_orders} ${d.month_orders === 1 ? 'order' : 'orders'} this month</span>
          </div>
        </div>
      `;

      if (canSet) {
        document.getElementById('setTargetBtn').addEventListener('click', () => openTargetModal(d));
      }
    } catch (err) {
      el.innerHTML = lockBox(err.message);
    }
  }

  function openTargetModal(current) {
    const existing = document.querySelector('.modal-backdrop');
    if (existing) existing.remove();
    const back = document.createElement('div');
    back.className = 'modal-backdrop active';
    back.innerHTML = `
      <div class="modal-box">
        <h3>Set Monthly Sales Target</h3>
        <div class="form-field">
          <label>Monthly target (₱) for ${current.month}</label>
          <input type="number" id="targetInput" min="0" step="0.01" value="${current.target != null ? current.target : ''}" placeholder="e.g. 100000">
        </div>
        <div class="form-field" style="margin-top:12px;">
          <label>Sales so far this month</label>
          <div style="font-size:0.9rem; color:var(--ink-muted);">${peso(current.month_sales)}</div>
        </div>
        <div class="modal-close-row">
          <button class="btn btn-outline" id="targetCancel">Cancel</button>
          <button class="btn" id="targetSave">Save Target</button>
        </div>
      </div>`;
    document.body.appendChild(back);

    const close = () => back.remove();
    back.querySelector('#targetCancel').addEventListener('click', close);
    back.addEventListener('click', (e) => { if (e.target === back) close(); });
    back.querySelector('#targetSave').addEventListener('click', async () => {
      const target = parseFloat(back.querySelector('#targetInput').value);
      if (!Number.isFinite(target) || target < 0) {
        showAlert('Enter a valid non-negative amount.', { title: 'Invalid target' });
        return;
      }
      const saveBtn = back.querySelector('#targetSave');
      saveBtn.disabled = true;
      try {
        const res = await adminFetch('/api/admin/dashboard/monthly-target', {
          method: 'PUT',
          body: JSON.stringify({ target }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Could not save target.');
        close();
        loadMonthlyTarget();
      } catch (err) {
        showAlert(err.message, { title: 'Save failed' });
        saveBtn.disabled = false;
      }
    });
    back.querySelector('#targetInput').focus();
  }

  /* ========== 4. Best sellers ========== */
  async function loadBestSellers() {
    const el = document.getElementById('sec-best-sellers');
    try {
      const d = await getJSON('/api/admin/dashboard/best-sellers');
      const items = d.items || [];
      el.innerHTML = items.length ? `
        <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>#</th><th>Product</th><th>Category</th><th class="r">Qty Sold</th><th class="r">Sales</th><th class="r">% of Total</th></tr></thead>
          <tbody>
            ${items.map((b, i) => `
              <tr>
                <td class="rank">${i + 1}</td>
                <td>${escapeHtml(b.name)}</td>
                <td class="muted">${escapeHtml(b.category_name)}</td>
                <td class="r">${b.qty_sold}</td>
                <td class="r amt">${peso(b.sales_amount)}</td>
                <td class="r">${b.share_percent}%</td>
              </tr>`).join('')}
          </tbody>
        </table>
        </div>`
      : `<div class="panel-empty">No products sold today yet.</div>`;
    } catch (err) {
      el.innerHTML = lockBox(err.message);
    }
  }

  /* ========== 5. Sales trend ========== */
  async function loadSalesTrend() {
    const el = document.getElementById('sec-sales-trend');
    try {
      const d = await getJSON('/api/admin/dashboard/sales-trend');
      const days = d.days || [];
      const hasSales = days.some((x) => num(x.sales) > 0);
      el.innerHTML = hasSales
        ? trendChart({
            labels: days.map((x) => fmtDay(x.date)),
            series: [{
              name: 'Sales',
              color: '#a3844a',
              values: days.map((x) => num(x.sales)),
              titles: days.map((x) => `${fmtDay(x.date)} · ${peso(x.sales)} · ${x.orders} ${x.orders === 1 ? 'order' : 'orders'}`),
            }],
          })
        : `<div class="panel-empty">No sales recorded in the last 15 days.</div>`;
    } catch (err) {
      el.innerHTML = lockBox(err.message);
    }
  }

  /* ========== 6. Cash overview ========== */
  async function loadCashOverview() {
    const el = document.getElementById('sec-cash-overview');
    try {
      const d = await getJSON('/api/admin/dashboard/cash-overview');
      const varClass = d.variance === 0 ? '' : (d.variance < 0 ? 'danger' : 'success');
      el.innerHTML = `
        <div class="stat-card"><div class="label">Opening Cash</div><div class="value">${peso(d.opening)}</div></div>
        <div class="stat-card"><div class="label">Cash Sales Today</div><div class="value brass">${peso(d.cash_sales)}</div><div class="stat-note">${d.cash_sale_count} ${d.cash_sale_count === 1 ? 'sale' : 'sales'}</div></div>
        <div class="stat-card"><div class="label">Cash In</div><div class="value success">${peso(d.cash_in)}</div></div>
        <div class="stat-card"><div class="label">Cash Out</div><div class="value danger">${peso(d.cash_out)}</div></div>
        <div class="stat-card"><div class="label">Expected Cash</div><div class="value">${peso(d.expected)}</div></div>
        <div class="stat-card"><div class="label">Actual Cash</div><div class="value">${peso(d.actual)}</div></div>
        <div class="stat-card"><div class="label">Variance</div><div class="value ${varClass}">${peso(d.variance)}</div></div>
      `;
    } catch (err) {
      el.innerHTML = lockBox(err.message);
    }
  }

  /* ========== 7. Cash trend ========== */
  async function loadCashTrend() {
    const el = document.getElementById('sec-cash-trend');
    try {
      const d = await getJSON('/api/admin/dashboard/cash-trend');
      const days = d.days || [];
      const hasData = days.some((x) => num(x.cash_sales) > 0 || num(x.cash_in) > 0 || num(x.cash_out) > 0);
      el.innerHTML = hasData
        ? trendChart({
            labels: days.map((x) => fmtDay(x.date)),
            series: [
              { name: 'Cash Sales', color: '#a3844a', values: days.map((x) => num(x.cash_sales)), titles: days.map((x) => `${fmtDay(x.date)} · Cash sales ${peso(x.cash_sales)}`) },
              { name: 'Cash In', color: '#2e7d4f', values: days.map((x) => num(x.cash_in)), titles: days.map((x) => `${fmtDay(x.date)} · Cash in ${peso(x.cash_in)}`) },
              { name: 'Cash Out', color: '#c0392b', values: days.map((x) => num(x.cash_out)), titles: days.map((x) => `${fmtDay(x.date)} · Cash out ${peso(x.cash_out)}`) },
            ],
          })
        : `<div class="panel-empty">No cash activity in the last 15 days.</div>`;
    } catch (err) {
      el.innerHTML = lockBox(err.message);
    }
  }

  /* ========== 8. Inventory overview ========== */
  async function loadInventoryOverview() {
    const el = document.getElementById('sec-inventory-overview');
    try {
      const d = await getJSON('/api/admin/dashboard/inventory-overview');
      el.innerHTML = `
        <div class="stat-card"><div class="label">Total Items</div><div class="value">${d.total_items}</div></div>
        <div class="stat-card"><div class="label">In Stock</div><div class="value success">${d.in_stock}</div></div>
        <div class="stat-card"><div class="label">Below Reorder</div><div class="value warning">${d.below_reorder}</div></div>
        <div class="stat-card"><div class="label">Low Stock</div><div class="value warning">${d.low_stock}</div></div>
        <div class="stat-card"><div class="label">Out of Stock</div><div class="value ${d.out_of_stock > 0 ? 'danger' : ''}">${d.out_of_stock}</div></div>
      `;
    } catch (err) {

    }

  /* ========== 9. Inventory usage ========== */
  async function loadInventoryUsage() {
    const el = document.getElementById('sec-inventory-usage');
    try {
      const d = await getJSON('/api/admin/dashboard/inventory-usage');
      const items = d.items || [];
      el.innerHTML = items.length ? `
        <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>Item</th><th class="r">Opening Qty</th><th class="r">Closing Qty</th><th class="r">Used Qty</th><th class="r">Usage</th></tr></thead>
          <tbody>
            ${items.map((it) => `
              <tr>
                <td>${escapeHtml(it.description)}<span class="sub-line">per ${escapeHtml(it.unit)}</span></td>
                <td class="r">${it.opening_qty}</td>
                <td class="r">${it.closing_qty}</td>
                <td class="r amt">${it.used_qty}</td>
                <td class="r">${it.usage_percent != null ? it.usage_percent + '%' : '—'}</td>
              </tr>`).join('')}
          </tbody>
        </table>
        </div>`
      : `<div class="panel-empty">No stock was consumed today.</div>`;
    } catch (err) {
      el.innerHTML = lockBox(err.message);
    }
  }

  /* ========== 10. Inventory status ========== */
  async function loadInventoryStatus() {
    const el = document.getElementById('sec-inventory-status');
    try {
      const d = await getJSON('/api/admin/dashboard/inventory-status');
      const items = d.items || [];
      el.innerHTML = items.length ? `
        <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>Item</th><th>Category</th><th class="r">Quantity</th><th>Status</th><th>Days of Stock</th><th>Remarks</th></tr></thead>
          <tbody>
            ${items.map((it) => {
              const [label, cls] = STATUS_LABEL[it.stock_status] || [it.stock_status, 'pill-neutral'];
              const remark = it.notes || STATUS_REMARK[it.stock_status] || '';
              const supplier = it.supplier ? `<span class="sub-line">Supplier: ${escapeHtml(it.supplier)}</span>` : '';
              return `
              <tr>
                <td>${escapeHtml(it.name)}${it.sku ? `<span class="sub-line">${escapeHtml(it.sku)}</span>` : ''}</td>
                <td class="muted">${escapeHtml(it.category)}</td>
                <td class="r">${it.quantity} <span class="muted">${escapeHtml(it.unit)}</span></td>
                <td><span class="pill ${cls}">${label}</span></td>
                <td class="muted">N/A</td>
                <td class="muted">${escapeHtml(remark)}${supplier}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        </div>`
      : `<div class="panel-empty">No inventory items yet.</div>`;
    } catch (err) {
      el.innerHTML = lockBox(err.message);
    }
  }
</script>
