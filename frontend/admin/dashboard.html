<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — The~Yo's Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Poppins:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-shell.css?v=5">
<style>
  /* ---------- Section headers ---------- */
  .dash-section { margin-bottom: 30px; }
  .dash-section-head {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin: 0 0 14px; padding-left: 10px; border-left: 3px solid var(--brass);
  }
  .dash-section-head h3 {
    font-family: 'Archivo', sans-serif; font-weight: 900; text-transform: uppercase;
    font-size: 1.02rem; letter-spacing: 0.02em; margin: 0;
  }
  .dash-section-head .dash-sub {
    font-family: 'Space Mono', monospace; font-size: 0.66rem; text-transform: uppercase;
    opacity: 0.5; letter-spacing: 0.05em;
  }

  /* ---------- Stat cards ---------- */
  .stat-card .stat-note { margin-top: 4px; font-family: 'Space Mono', monospace; font-size: 0.68rem; opacity: 0.55; }
  .stat-card .value.warning { color: var(--warning); }

  /* ---------- Tables ---------- */
  .admin-table-wrap { overflow-x: auto; }
  .admin-table td.r, .admin-table th.r { text-align: right; }
  .admin-table td.amt { font-family: 'Space Mono', monospace; font-weight: 700; color: var(--brass-dark); white-space: nowrap; }
  .admin-table td.rank { color: var(--brass); font-weight: 800; }
  .admin-table td.muted { opacity: 0.6; }
  .admin-table td .sub-line { display: block; font-size: 0.72rem; opacity: 0.55; font-family: 'Space Mono', monospace; }

  /* ---------- Sales breakdown ---------- */
  .breakdown-grid { display: grid; grid-template-columns: 240px 1fr; gap: 24px; align-items: center; }
  @media (max-width: 900px) { .breakdown-grid { grid-template-columns: 1fr; } }
  .donut-box { position: relative; width: 170px; height: 170px; margin: 0 auto; }
  .donut-box svg { display: block; }
  .donut-label {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    font-family: 'Archivo', sans-serif; font-size: 0.82rem; line-height: 1.25; opacity: 0.8;
  }
  .donut-label strong { font-size: 1.05rem; color: var(--brass-dark); }
  .type-row { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .type-row:last-child { border-bottom: none; }
  .type-head { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; flex-wrap: wrap; }
  .type-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .type-name { flex: 1; font-weight: 600; }
  .type-orders { font-family: 'Space Mono', monospace; font-size: 0.7rem; opacity: 0.55; }
  .type-amt { font-family: 'Space Mono', monospace; font-weight: 700; color: var(--brass-dark); }
  .type-pct { font-family: 'Space Mono', monospace; font-size: 0.72rem; opacity: 0.6; width: 40px; text-align: right; }
  .type-track { height: 6px; background: var(--stone); border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .type-fill { height: 100%; border-radius: 4px; }

  /* ---------- Monthly target ---------- */
  .target-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .target-main { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; flex: 1; }
  .target-cell { min-width: 0; }
  .target-cell .label { font-family: 'Space Mono', monospace; font-size: 0.65rem; text-transform: uppercase; opacity: 0.55; }
  .target-cell .target-value { font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 1.35rem; margin-top: 4px; overflow-wrap: anywhere; }
  .target-cell .target-value.brass { color: var(--brass-dark); }
  .target-cell .target-value .muted { font-size: 0.8rem; opacity: 0.45; font-weight: 600; }
  .target-progress { margin-top: 20px; }
  .progress-track { height: 10px; background: var(--stone); border-radius: 6px; overflow: hidden; }
  .progress-fill {
    height: 100%; min-width: 0; border-radius: 6px;
    background: linear-gradient(90deg, var(--brass), var(--brass-dark));
    transition: width .4s ease;
  }
  .progress-labels {
    display: flex; justify-content: space-between; margin-top: 8px;
    font-family: 'Space Mono', monospace; font-size: 0.68rem; opacity: 0.6;
    text-transform: uppercase; letter-spacing: 0.03em;
    flex-wrap: wrap; gap: 4px 12px;
  }

  /* ---------- Charts ---------- */
  .chart-wrap { width: 100%; }
  .chart-wrap svg { width: 100%; height: auto; display: block; }
  .chart-label { font-family: 'Space Mono', monospace; font-size: 10px; fill: #96928a; }
  .chart-legend-row { margin-bottom: 10px; }
  .chart-legend {
    display: inline-flex; align-items: center; gap: 6px; margin-right: 18px;
    font-family: 'Space Mono', monospace; font-size: 0.7rem; text-transform: uppercase; opacity: 0.7;
  }
  .chart-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* ---------- Live order rail ---------- */
  .live-orders-section {
    margin-bottom: 30px; padding: 18px;
    border: 1px solid #ece3d4; border-radius: 14px;
    background: rgba(255,255,255,0.78); box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .live-orders-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; margin-bottom: 14px;
  }
  .live-orders-title { display: flex; align-items: center; gap: 10px; }
  .live-orders-title h2 { margin: 0; font: 700 1rem 'Poppins', sans-serif; color: #39435c; }
  .live-orders-title p { margin: 2px 0 0; font-size: .72rem; color: #858b99; }
  .live-indicator {
    width: 9px; height: 9px; border-radius: 50%; background: #2e7d4f;
    box-shadow: 0 0 0 4px rgba(46,125,79,.13); animation: livePulse 2s ease-in-out infinite;
  }
  .live-orders-count {
    flex-shrink: 0; padding: 5px 9px; border-radius: 999px;
    background: #f4ecdd; color: #a9752b; font-size: .7rem; font-weight: 600;
  }
  .live-orders-viewport { overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; }
  .live-orders-viewport::-webkit-scrollbar { display: none; }
  .live-orders-rail { display: flex; gap: 14px; width: max-content; min-width: 100%; padding: 2px; }
  .order-ticket {
    width: 292px; min-height: 212px; flex: 0 0 292px;
    display: flex; flex-direction: column; padding: 15px;
    border: 1px solid #ece3d4; border-top: 3px solid #a9752b;
    border-radius: 11px; background: #fff; color: #39435c;
    text-decoration: none; box-shadow: 0 3px 12px rgba(57,67,92,.07);
    scroll-snap-align: start; transition: transform .16s ease, box-shadow .16s ease;
  }
  .order-ticket:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(57,67,92,.11); }
  .order-ticket.status-preparing { border-top-color: #2c5fb0; }
  .order-ticket.status-ready { border-top-color: #2e7d4f; }
  .order-ticket.status-confirmed { border-top-color: #a3844a; }
  .order-ticket.live-updated { animation: ticketFlash 1.25s ease both; }
  .ticket-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ticket-number { font-size: .88rem; font-weight: 700; color: #29334c; }
  .ticket-status {
    padding: 4px 8px; border-radius: 999px; background: #f8f1e4;
    color: #94651f; font-size: .62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
  }
  .status-preparing .ticket-status { color: #2c5fb0; background: rgba(44,95,176,.1); }
  .status-ready .ticket-status { color: #23633e; background: rgba(46,125,79,.12); }
  .ticket-trail {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    margin: 13px 0 10px; padding: 0; list-style: none;
  }
  .ticket-trail-step { position: relative; min-width: 0; text-align: center; }
  .ticket-trail-step:not(:last-child)::after {
    content: ''; position: absolute; z-index: 0;
    top: 7px; left: calc(50% + 8px); right: calc(-50% + 8px);
    height: 2px; background: #e6dfd4;
  }
  .ticket-trail-step.done:not(:last-child)::after { background: #a9752b; }
  .ticket-trail-dot {
    position: relative; z-index: 1; width: 16px; height: 16px;
    display: grid; place-items: center; margin: 0 auto 5px;
    border: 2px solid #d8d1c6; border-radius: 50%;
    background: #fff; color: transparent; font-size: 9px; font-weight: 700;
  }
  .ticket-trail-step.done .ticket-trail-dot { border-color: #a9752b; background: #a9752b; color: #fff; }
  .ticket-trail-step.current .ticket-trail-dot { border-color: #a9752b; box-shadow: 0 0 0 3px rgba(169,117,43,.14); }
  .ticket-trail-step.current .ticket-trail-dot::after { content: ''; width: 5px; height: 5px; border-radius: 50%; background: #a9752b; }
  .ticket-trail-label {
    display: block; overflow: hidden; text-overflow: ellipsis;
    color: #a2a6b0; font-size: .53rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .025em; white-space: nowrap;
  }
  .ticket-trail-step.done .ticket-trail-label,
  .ticket-trail-step.current .ticket-trail-label { color: #94651f; }
  .ticket-items { flex: 1; margin: 8px 0 13px; padding: 0; list-style: none; }
  .ticket-items li { display: flex; gap: 8px; margin-top: 6px; font-size: .76rem; line-height: 1.35; }
  .ticket-items li:first-child { margin-top: 0; }
  .ticket-items .qty { min-width: 22px; color: #a9752b; font-weight: 700; }
  .ticket-more { color: #858b99; font-style: italic; }
  .ticket-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 11px; border-top: 1px solid #f0e9de; }
  .ticket-owner { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .ticket-avatar {
    width: 28px; height: 28px; flex: 0 0 28px; border-radius: 50%;
    display: grid; place-items: center; background: #f4ecdd; color: #a9752b;
    font-size: .68rem; font-weight: 700;
  }
  .ticket-owner-copy { min-width: 0; }
  .ticket-owner-copy span { display: block; color: #9a9fac; font-size: .58rem; text-transform: uppercase; letter-spacing: .07em; }
  .ticket-owner-copy strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .7rem; font-weight: 600; }
  .ticket-elapsed { color: #858b99; font-size: .68rem; font-weight: 600; white-space: nowrap; }
  .live-orders-empty { width: 100%; padding: 38px 20px; text-align: center; color: #858b99; font-size: .82rem; }
  @keyframes ticketFlash { 0% { background: #fff5d9; box-shadow: 0 0 0 3px rgba(169,117,43,.22); } 100% { background: #fff; box-shadow: 0 3px 12px rgba(57,67,92,.07); } }
  @keyframes livePulse { 50% { opacity: .45; transform: scale(.82); } }
  @media (prefers-reduced-motion: reduce) { .live-indicator, .order-ticket.live-updated { animation: none; } .live-orders-viewport { scroll-behavior: auto; } }
  @media (max-width: 600px) { .live-orders-section { padding: 14px; } .order-ticket { width: 260px; flex-basis: 260px; } }
</style>
</head>
<body>

<div id="adminShell"></div>

<script type="module">
  import { renderAdminShell, showAlert } from "./admin-shell.js";
  import { adminFetch, peso, escapeHtml } from "./admin-api.js";

  const session = renderAdminShell({ active: 'dashboard', title: 'Dashboard' });
  let liveRailScrollTimer = null;
  let liveElapsedTimer = null;
  if (session) init();

  /* ================================================================
     Shared helpers
     ================================================================ */
  const TYPE_COLORS = {
    dine_in: '#a3844a', pickup: '#2e7d4f', delivery: '#2c5fb0',
    takeout: '#b8860b', online: '#7d5aa6',
  };
  const TYPE_LABELS = {
    dine_in: 'Dine-in', pickup: 'Pickup', delivery: 'Delivery',
    takeout: 'Takeout', online: 'Online Order',
  };
  const STATUS_LABEL = {
    in_stock: ['In Stock', 'pill-success'],
    below_reorder: ['Below Reorder', 'pill-warning'],
    low_stock: ['Low Stock', 'pill-warning'],
    out_of_stock: ['Out of Stock', 'pill-danger'],
  };
  const STATUS_REMARK = {
    in_stock: 'Healthy stock level.',
    below_reorder: 'At or below reorder level — restock soon.',
    low_stock: 'Running low — monitor closely.',
    out_of_stock: 'Out of stock — reorder immediately.',
  };

  function num(n) { return Number(n) || 0; }
  function fmtDay(dateStr) {
    return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
  }
  function compactPeso(v) {
    const n = num(v);
    if (n >= 1000000) return '₱' + (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return '₱' + (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'k';
    return '₱' + Math.round(n);
  }
  const lockBox = (msg) => `<div class="panel-empty">🔒 ${escapeHtml(msg)}</div>`;

  async function getJSON(path) {
    const res = await adminFetch(path);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Could not load data.');
    return data;
  }

  // Hand-rolled SVG line chart — no library, no fake data. Each dot
  // carries a native <title> tooltip so values are inspectable.
  function trendChart({ labels, series, height = 230 }) {
    const W = 640, PL = 56, PR = 16, PT = 14, PB = 30;
    const allVals = series.flatMap((s) => s.values);
    const max = Math.max(...allVals, 1);
    const innerW = W - PL - PR;
    const innerH = height - PT - PB;
    const n = labels.length;
    const xs = (i) => PL + (n === 1 ? innerW / 2 : (i / (n - 1)) * innerW);
    const ys = (v) => PT + innerH - (v / max) * innerH;

    const grid = [0, 0.25, 0.5, 0.75, 1].map((f) => {
      const y = ys(max * f);
      return `<line x1="${PL}" y1="${y}" x2="${W - PR}" y2="${y}" stroke="#ebe6db" stroke-width="1"/>` +
        `<text x="${PL - 8}" y="${y + 4}" text-anchor="end" class="chart-label">${compactPeso(max * f)}</text>`;
    }).join('');

    const areaPath = series.length === 1
      ? `<path d="${series[0].values.map((v, i) => `${i === 0 ? 'M' : 'L'}${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(' ')} L${xs(n - 1).toFixed(1)},${(PT + innerH)} L${xs(0).toFixed(1)},${(PT + innerH)} Z" fill="rgba(163,132,74,0.10)"/>`
      : '';

    const lines = series.map((s) => {
      const path = s.values.map((v, i) => `${i === 0 ? 'M' : 'L'}${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(' ');
      const dots = s.values.map((v, i) =>
        `<circle cx="${xs(i).toFixed(1)}" cy="${ys(v).toFixed(1)}" r="3" fill="${s.color}" stroke="#fff" stroke-width="1.4">
          <title>${s.titles ? s.titles[i] : (labels[i] + ': ' + v)}</title>
        </circle>`
      ).join('');
      return `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>${dots}`;
    }).join('');

    const labelStep = Math.max(1, Math.ceil(n / 6));
    const xLabels = labels.map((l, i) => (i % labelStep === 0 || i === n - 1)
      ? `<text x="${xs(i).toFixed(1)}" y="${height - 10}" text-anchor="middle" class="chart-label">${l}</text>` : '').join('');

    const legend = `<div class="chart-legend-row">${series.map((s) =>
      `<span class="chart-legend"><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>`;

    return `<div class="chart-wrap">${legend}<svg viewBox="0 0 ${W} ${height}" role="img">${grid}${areaPath}${lines}${xLabels}</svg></div>`;
  }

  // Donut chart for the order-type breakdown.
  function donutChart(segments, total) {
    const size = 170, R = 62, C = 2 * Math.PI * R;
    const cx = size / 2;
    let cumulative = 0;
    const arcs = segments.map((seg) => {
      const frac = total > 0 ? num(seg.total_sales) / total : 0;
      const dash = frac * C;
      const offset = C * 0.25 - cumulative * C;
      cumulative += frac;
      return `<circle cx="${cx}" cy="${cx}" r="${R}" fill="none"
        stroke="${TYPE_COLORS[seg.order_type] || '#a3844a'}" stroke-width="24"
        stroke-dasharray="${dash.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}">
        <title>${TYPE_LABELS[seg.order_type] || seg.order_type}: ${peso(seg.total_sales)}</title>
      </circle>`;
    }).join('');
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${arcs}</svg>`;
  }

  /* ================================================================
     Page skeleton — all 10 sections always render; individual sections
     show a 🔒 lock note if the logged-in staff lacks that permission.
     ================================================================ */
  function init() {
    const today = new Date().toLocaleDateString('en-PH', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
    });
    const content = document.getElementById('adminContent');
    content.innerHTML = `
      <section class="live-orders-section" aria-labelledby="liveOrdersHeading">
        <div class="live-orders-head">
          <div class="live-orders-title">
            <span class="live-indicator" aria-hidden="true"></span>
            <div><h2 id="liveOrdersHeading">Live Orders</h2><p>Pending, preparing, and ready now · updates automatically</p></div>
          </div>
          <span class="live-orders-count" id="liveOrdersCount">Connecting…</span>
        </div>
        <div class="live-orders-viewport" id="liveOrdersViewport" tabindex="0" aria-label="Orders currently in progress">
          <div class="live-orders-rail" id="liveOrdersRail"><div class="live-orders-empty">Connecting to live orders…</div></div>
        </div>
      </section>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Sales Overview</h3><span class="dash-sub">as of today · ${today}</span></div>
        <div class="stat-grid" id="sec-overview"><div class="admin-loading">Loading…</div></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Sales Breakdown</h3><span class="dash-sub">by order type · today</span></div>
        <div class="admin-panel"><div class="admin-panel-body" id="sec-breakdown"><div class="admin-loading">Loading…</div></div></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Monthly Sales Target</h3><span class="dash-sub">${today}</span></div>
        <div class="admin-panel"><div class="admin-panel-body" id="sec-monthly-target"><div class="admin-loading">Loading…</div></div></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Top 10 Best Sellers</h3><span class="dash-sub">as of today</span></div>
        <div class="admin-panel"><div class="admin-panel-body" id="sec-best-sellers"><div class="admin-loading">Loading…</div></div></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Sales Trend</h3><span class="dash-sub">last 15 days</span></div>
        <div class="admin-panel"><div class="admin-panel-body" id="sec-sales-trend"><div class="admin-loading">Loading…</div></div></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Cash Overview</h3><span class="dash-sub">as of today</span></div>
        <div class="stat-grid" id="sec-cash-overview"><div class="admin-loading">Loading…</div></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Cash Trend</h3><span class="dash-sub">last 15 days</span></div>
        <div class="admin-panel"><div class="admin-panel-body" id="sec-cash-trend"><div class="admin-loading">Loading…</div></div></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Inventory Overview</h3><span class="dash-sub">raw stock status</span></div>
        <div class="stat-grid" id="sec-inventory-overview"><div class="admin-loading">Loading…</div></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Inventory Usage</h3><span class="dash-sub">as of today</span></div>
        <div class="admin-panel"><div class="admin-panel-body" id="sec-inventory-usage"><div class="admin-loading">Loading…</div></div></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Inventory Status</h3><span class="dash-sub">days of stock: N/A · insufficient history</span></div>
        <div class="admin-panel"><div class="admin-panel-body" id="sec-inventory-status"><div class="admin-loading">Loading…</div></div></div>
      </div>
    `;

    setupLiveOrderRail();

    // Each section loads independently so one slow/failed section never
    // blanks the rest of the dashboard.
    loadSalesOverview();
    loadSalesBreakdown();
    loadMonthlyTarget();
    loadBestSellers();
    loadSalesTrend();
    loadCashOverview();
    loadCashTrend();
    loadInventoryOverview();
    loadInventoryUsage();
    loadInventoryStatus();
  }

  function elapsedLabel(value) {
    const started = new Date(value).getTime();
    if (!Number.isFinite(started)) return 'Just now';
    const minutes = Math.max(0, Math.floor((Date.now() - started) / 60000));
    if (minutes < 1) return 'Just now';
    if (minutes < 60) return `${minutes}m`;
    const hours = Math.floor(minutes / 60);
    return `${hours}h ${minutes % 60}m`;
  }

  function liveStatusLabel(status) {
    return ({ pending: 'Pending', confirmed: 'Accepted', preparing: 'Preparing', ready: 'Ready' })[status] || status;
  }

  function orderStatusTrail(status) {
    const stages = [
      { key: 'pending', label: 'Pending' },
      { key: 'confirmed', label: 'Confirm' },
      { key: 'preparing', label: 'Preparing' },
      { key: 'completed', label: 'Completed' },
    ];
    const currentIndex = ({ pending: 0, confirmed: 1, preparing: 2, ready: 2, completed: 3 })[status] ?? 0;
    return `<ol class="ticket-trail" aria-label="Order progress">
      ${stages.map((stage, index) => {
        const state = index < currentIndex ? 'done' : (index === currentIndex ? 'current' : 'upcoming');
        const current = index === currentIndex ? ' aria-current="step"' : '';
        return `<li class="ticket-trail-step ${state}"${current}>
          <span class="ticket-trail-dot" aria-hidden="true">${state === 'done' ? '✓' : ''}</span>
          <span class="ticket-trail-label">${stage.label}</span>
        </li>`;
      }).join('')}
    </ol>`;
  }

  function updateElapsedLabels() {
    document.querySelectorAll('.ticket-elapsed[data-ordered-at]').forEach(el => {
      el.textContent = elapsedLabel(el.dataset.orderedAt);
    });
  }

  function startRailAutoScroll() {
    window.clearInterval(liveRailScrollTimer);
    const viewport = document.getElementById('liveOrdersViewport');
    const rail = document.getElementById('liveOrdersRail');
    if (!viewport || !rail || rail.children.length < 2) return;
    liveRailScrollTimer = window.setInterval(() => {
      if (viewport.matches(':hover') || viewport.contains(document.activeElement)) return;
      const firstCard = rail.querySelector('.order-ticket');
      if (!firstCard || viewport.scrollWidth <= viewport.clientWidth) return;
      const atEnd = viewport.scrollLeft + viewport.clientWidth >= viewport.scrollWidth - 24;
      viewport.scrollTo({ left: atEnd ? 0 : viewport.scrollLeft + firstCard.offsetWidth + 14, behavior: 'smooth' });
    }, 4200);
  }

  function renderLiveOrderRail(orders, changedIds = []) {
    const rail = document.getElementById('liveOrdersRail');
    const count = document.getElementById('liveOrdersCount');
    if (!rail || !count) return;

    const priority = { ready: 0, preparing: 1, confirmed: 2, pending: 3 };
    const active = [...(orders || [])].sort((a, b) =>
      (priority[a.status] ?? 9) - (priority[b.status] ?? 9) ||
      new Date(a.datetime_ordered) - new Date(b.datetime_ordered)
    );
    count.textContent = `${active.length} active`;

    if (!active.length) {
      rail.innerHTML = '<div class="live-orders-empty">No orders are in progress right now.</div>';
      window.clearInterval(liveRailScrollTimer);
      return;
    }

    const changed = new Set((changedIds || []).map(String));
    rail.innerHTML = active.map(order => {
      const items = Array.isArray(order.items) ? order.items : [];
      const visibleItems = items.slice(0, 3);
      const owner = order.handler_name || 'Unassigned';
      const initials = owner === 'Unassigned'
        ? '—'
        : owner.split(/\s+/).filter(Boolean).slice(0, 2).map(part => part[0]).join('').toUpperCase();
      return `
        <a class="order-ticket status-${escapeHtml(order.status)}${changed.has(String(order.id)) ? ' live-updated' : ''}" href="sales.html" aria-label="Open order ${escapeHtml(order.id)}">
          <div class="ticket-top">
            <span class="ticket-number">Order #${escapeHtml(order.id)}</span>
            <span class="ticket-status">${escapeHtml(liveStatusLabel(order.status))}</span>
          </div>
          ${orderStatusTrail(order.status)}
          <ul class="ticket-items">
            ${visibleItems.length ? visibleItems.map(item => `<li><span class="qty">×${Number(item.quantity) || 1}</span><span>${escapeHtml(item.name || 'Menu item')}</span></li>`).join('') : `<li><span class="qty">×${Number(order.item_count) || 0}</span><span>Order items</span></li>`}
            ${items.length > visibleItems.length ? `<li class="ticket-more">+${items.length - visibleItems.length} more item${items.length - visibleItems.length === 1 ? '' : 's'}</li>` : ''}
          </ul>
          <div class="ticket-bottom">
            <div class="ticket-owner">
              <span class="ticket-avatar" aria-hidden="true">${escapeHtml(initials)}</span>
              <span class="ticket-owner-copy"><span>Handled by</span><strong>${escapeHtml(owner)}</strong></span>
            </div>
            <span class="ticket-elapsed" data-ordered-at="${escapeHtml(order.datetime_ordered)}">${escapeHtml(elapsedLabel(order.datetime_ordered))}</span>
          </div>
        </a>`;
    }).join('');
    window.setTimeout(startRailAutoScroll, 0);
  }

  function setupLiveOrderRail() {
    document.addEventListener('admin:orders-updated', event => {
      renderLiveOrderRail(event.detail?.orders || [], event.detail?.changedIds || []);
    });
    if (Array.isArray(window.__adminLiveOrders)) renderLiveOrderRail(window.__adminLiveOrders);
    window.clearInterval(liveElapsedTimer);
    liveElapsedTimer = window.setInterval(updateElapsedLabels, 30000);
  }

  /* ========== 2. Sales breakdown ========== */
  async function loadSalesBreakdown() {
    const el = document.getElementById('sec-breakdown');
    try {
      const d = await getJSON('/api/admin/dashboard/sales-breakdown');
      const types = d.byOrderType || [];
      const total = types.reduce((s, t) => s + num(t.total_sales), 0);
      const maxType = Math.max(...types.map((t) => num(t.total_sales)), 0);
      const active = types.filter((t) => num(t.total_sales) > 0);

      const donut = total > 0
        ? donutChart(active, total)
        : `<svg viewBox="0 0 170 170" width="170" height="170"><circle cx="85" cy="85" r="62" fill="none" stroke="#efe9dd" stroke-width="24"/></svg>`;

      const legend = types.map((t) => {
        const pct = total > 0 ? Math.round((num(t.total_sales) / total) * 100) : 0;
        const barWidth = maxType > 0 ? Math.round((num(t.total_sales) / maxType) * 100) : 0;
        return `
          <div class="type-row">
            <div class="type-head">
              <span class="type-dot" style="background:${TYPE_COLORS[t.order_type] || '#a3844a'}"></span>
              <span class="type-name">${TYPE_LABELS[t.order_type] || t.order_type}</span>
              <span class="type-orders">${t.order_count} ${t.order_count === 1 ? 'order' : 'orders'}</span>
              <span class="type-amt">${peso(t.total_sales)}</span>
              <span class="type-pct">${pct}%</span>
            </div>
            <div class="type-track"><div class="type-fill" style="width:${barWidth}%;background:${TYPE_COLORS[t.order_type] || '#a3844a'}"></div></div>
          </div>`;
      }).join('');

      el.innerHTML = `
        <div class="breakdown-grid">
          <div class="donut-box">
            ${donut}
            <div class="donut-label">Total today<br><strong>${peso(total)}</strong></div>
          </div>
          <div>${legend}</div>
        </div>`;
    } catch (err) {
      el.innerHTML = lockBox(err.message);
    }
  }

  /* ========== 3. Monthly sales target ========== */
  async function loadMonthlyTarget() {
    const el = document.getElementById('sec-monthly-target');
    try {
      const d = await getJSON('/api/admin/dashboard/monthly-target');
      const pct = d.target ? Math.min(100, num(d.progress_percent)) : 0;
      const remaining = d.target ? Math.max(0, num(d.target) - num(d.month_sales)) : null;
      const canSet = session.staff && session.staff.role === 'Admin';

      el.innerHTML = `
        <div class="target-top">
          <div class="target-main">
            <div class="target-cell"><div class="label">Target</div>
              <div class="target-value">${d.target != null ? peso(d.target) : '<span class="muted">Not set</span>'}</div></div>
            <div class="target-cell"><div class="label">Sales this month</div>
              <div class="target-value brass">${peso(d.month_sales)}</div></div>
            <div class="target-cell"><div class="label">Remaining</div>
              <div class="target-value">${remaining != null ? peso(remaining) : '—'}</div></div>
            <div class="target-cell"><div class="label">Days left</div>
              <div class="target-value">${d.days_remaining} <span class="muted">of ${d.days_in_month}</span></div></div>
          </div>
          ${canSet ? `<button class="btn btn-outline small" id="setTargetBtn">Set Target</button>` : ''}
        </div>
        <div class="target-progress">
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-labels">
            <span>${d.target ? num(d.progress_percent) + '% of target reached' : 'Set a monthly target to track progress'}</span>
            <span>${d.month} · ${d.month_orders} ${d.month_orders === 1 ? 'order' : 'orders'} this month</span>
          </div>
        </div>
      `;

      if (canSet) {
        document.getElementById('setTargetBtn').addEventListener('click', () => openTargetModal(d));
      }
    } catch (err) {
      el.innerHTML = lockBox(err.message);
    }
  }

  function openTargetModal(current) {
    const existing = document.querySelector('.modal-backdrop');
    if (existing) existing.remove();
    const back = document.createElement('div');
    back.className = 'modal-backdrop active';
    back.innerHTML = `
      <div class="modal-box">
        <h3>Set Monthly Sales Target</h3>
        <div class="form-field">
          <label>Monthly target (₱) for ${current.month}</label>
          <input type="number" id="targetInput" min="0" step="0.01" value="${current.target != null ? current.target : ''}" placeholder="e.g. 100000">
        </div>
        <div class="form-field" style="margin-top:12px;">
          <label>Sales so far this month</label>
          <div style="font-size:0.9rem; color:var(--ink-muted);">${peso(current.month_sales)}</div>
        </div>
        <div class="modal-close-row">
          <button class="btn btn-outline" id="targetCancel">Cancel</button>
          <button class="btn" id="targetSave">Save Target</button>
        </div>
      </div>`;
    document.body.appendChild(back);

    const close = () => back.remove();
    back.querySelector('#targetCancel').addEventListener('click', close);
    back.addEventListener('click', (e) => { if (e.target === back) close(); });
    back.querySelector('#targetSave').addEventListener('click', async () => {
      const target = parseFloat(back.querySelector('#targetInput').value);
      if (!Number.isFinite(target) || target < 0) {
        showAlert('Enter a valid non-negative amount.', { title: 'Invalid target' });
        return;
      }
      const saveBtn = back.querySelector('#targetSave');
      saveBtn.disabled = true;
      try {
        const res = await adminFetch('/api/admin/dashboard/monthly-target', {
          method: 'PUT',
          body: JSON.stringify({ target }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Could not save target.');
        close();
        loadMonthlyTarget();
      } catch (err) {
        showAlert(err.message, { title: 'Save failed' });
        saveBtn.disabled = false;
      }
    });
    back.querySelector('#targetInput').focus();
  }
